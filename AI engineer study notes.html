# Chapter 23: Rate Limits and Retries, Latency Optimization, Token Cost Management, Prompt and Semantic Caching

This chapter covers the operational knobs that decide whether an LLM feature is fast enough, cheap enough and reliable under load.

## Part 1: Rate limits and retries

**Provider limits you'll hit:**

| Limit | Meaning |
| --- | --- |
| **RPM** | Requests per minute |
| **TPM** (input and output, sometimes separate) | Tokens per minute |
| **Concurrency** | Simultaneous in-flight requests |
| **Daily and monthly spend caps / quotas** | Budget ceilings |
| **Per-model and per-organization tiers** | Limits grow with usage tier and verified spend |

**Signals:** HTTP **429 Too Many Requests**, sometimes with `Retry-After` and headers showing remaining quota and reset times. **5xx / overloaded** errors indicate provider capacity problems, which are different from your quota.

**Note on TPM:** the limit usually counts **input plus the requested `max_tokens`** (or actual output). Setting a huge `max_tokens` "just in case" can reserve quota and trigger 429s. Set it to what you realistically need.

**Handling strategy (layered):**

1. **Retry with exponential backoff and jitter** (Chapter 17), honoring `Retry-After`. Retry only 429, 5xx, timeouts and network errors.
2. **Client-side throttling:** a **token-bucket or leaky-bucket rate limiter** in front of API calls, sized below your limits, so you rarely see 429s. Track both request and token budgets.
3. **Concurrency limiter** (semaphore) for async workloads.
4. **Queueing:** put non-interactive work on a queue (SQS, Kafka, Celery, Redis streams), with workers pulling at a controlled rate. This smooths bursts.
5. **Priority lanes:** interactive user requests get priority and reserved capacity, and batch and background jobs yield or run in the **Batch API** off-peak.
6. **Spread load:** multiple deployments, regions or keys (within the provider's terms), and fall back across providers (Chapter 22).
7. **Backpressure and load shedding:** when saturated, reject or degrade gracefully (a smaller model, shorter answer, "try again shortly") and don't let the queue grow forever.
8. **Per-user and per-tenant limits** in your own app, to prevent one user from consuming everyone's quota (and to stop abuse and denial-of-wallet).
9. **Request quota increases** ahead of launches and traffic spikes, and monitor usage trends.
10. **Reduce token usage** (Part 3 and 4) so the same limits support more traffic.

```python
import asyncio, random

class TokenBucket:
    def __init__(self, rate_per_sec, capacity):
        self.rate, self.capacity = rate_per_sec, capacity
        self.tokens, self.last = capacity, asyncio.get_event_loop().time()
    async def acquire(self, n=1):
        while True:
            now = asyncio.get_event_loop().time()
            self.tokens = min(self.capacity, self.tokens + (now - self.last) * self.rate)
            self.last = now
            if self.tokens >= n:
                self.tokens -= n; return
            await asyncio.sleep((n - self.tokens) / self.rate)

async def guarded_call(req):
    await token_bucket.acquire(estimated_tokens(req))      # throttle before sending
    async with semaphore:                                  # cap concurrency
        return await call_with_retries(lambda: llm(req))   # backoff + jitter (Chapter 17)
```

**Pitfalls:** retry storms (everyone retries at the same moment, so use jitter), unbounded retries that multiply load, treating all errors as retryable, no per-user limits (one tenant starves the rest), and ignoring token limits while tracking only request counts.

## Part 2: Latency optimization

**Where latency comes from:**

```
Total = network + queueing + input processing (prefill) + output generation (decode, per token) + your own code (retrieval, tools, guardrails, post-processing)
```

- **Prefill** is roughly proportional to input tokens and determines **TTFT**
- **Decode** is roughly proportional to output tokens (**each token waits for the previous one**) and determines total time
- Most chat latency is **output length times per-token time**, so **fewer output tokens is the strongest lever**

**Metrics:** TTFT, tokens per second (TPS), end-to-end latency at **p50, p95 and p99** (tail latency matters most for UX), and queue time.

**Optimization techniques (roughly in order of impact and ease):**

| Technique | Effect |
| --- | --- |
| **Stream the response** | Huge perceived-latency win (Chapter 22) |
| **Shorter outputs** | Ask for concise answers, set a sensible `max_tokens`, request compact formats (a label and not an essay, a short JSON key set) |
| **Smaller or faster model** for the step | Faster prefill and decode. Route simple tasks to small models (Chapter 22) |
| **Trim the prompt** | Fewer input tokens means faster prefill and lower cost: remove redundancy, retrieve fewer and better chunks, summarize history |
| **Prompt caching** (Part 4) | Cuts prefill time and cost for repeated prefixes |
| **Parallelize independent calls** | Run retrieval, guardrails, multiple sub-queries and tool calls concurrently, and not sequentially |
| **Parallel tool calls** | Let the model request several tools at once |
| **Reduce sequential LLM hops** | Merge steps where safe, or replace an LLM step with code, rules or a classifier |
| **Speculative execution / early start** | Start likely-needed work (retrieval, tool prefetch) before the model finishes |
| **Efficient retrieval** | Tune ANN parameters, cache embeddings and frequent queries, limit reranker candidates (Chapters 11 and 12) |
| **Co-locate services** | Keep the app, vector DB and model endpoint in the same region |
| **Connection reuse** | Keep-alive and HTTP/2, avoid TLS handshakes per request |
| **Semantic and response caching** (Part 4) | Skip the call entirely for repeats |
| **Provider options** | Priority or low-latency tiers, regional endpoints, faster inference providers |
| **Speculative decoding** (self-hosting, Chapter 24) | A small draft model proposes tokens that the big model verifies in parallel, 2 to 3x faster decode with identical outputs |
| **Quantization and efficient serving** (self-hosting) | Faster per-token speed (Chapter 24) |
| **Structured and constrained outputs** | Fewer retries from malformed outputs |
| **Avoid unnecessary reasoning** | Reasoning models think before answering, so use them only where needed, with a controlled thinking budget |
| **Perceived-latency UX** | Progress indicators, partial results, filler phrases in voice, optimistic UI |

**Agent latency specifics:** each loop iteration adds an LLM call plus tool latency, so reduce steps (better tools, consolidated tool calls, plans), parallelize tool calls and subagents, and cap steps.

**Method:** **measure first.** Use traces (Chapter 25) to produce a **latency breakdown** per stage (retrieval, LLM TTFT, decode, tools, guardrails) and fix the biggest contributor. Don't guess. Track **p95 and p99**, since averages hide tail problems (cold starts, retries, queueing).

**Latency vs quality vs cost triangle:** most optimizations trade among the three. Decide the product's **latency budget** (for example voice about 1 s, chat TTFT under 1 s, background jobs minutes) and optimize cost and quality within it.

**Use case:** a RAG chatbot has p95 = 9 s. Traces show: query rewrite 1.2 s (LLM), retrieval 0.3 s, reranker 0.4 s, generation 7 s (long answers). Changes: skip rewrite on first turns, cap answers to about 150 words via instruction and `max_tokens`, stream, and cache the system prompt. p95 drops to 3.5 s, and TTFT is about 0.8 s.

## Part 3: Token cost management

**Cost model:**

```
cost per request = input_tokens × input_price + output_tokens × output_price
                   (cached input tokens billed at a discount; batch requests at a discount)
```

- **Output tokens usually cost several times more than input tokens**, so long answers are expensive
- **Reasoning/thinking tokens are billed as output** even if hidden
- **Agents multiply cost:** each loop step resends the growing context, so cost grows with the number of steps (roughly quadratic in turns if history isn't managed)
- **Images, audio and files** convert to tokens too (Chapter 5)

**Estimating cost:**
`monthly cost ≈ requests/month × (avg_input × price_in + avg_output × price_out)`. Always compute the **average and the tail** (a few giant requests can dominate), and the **cost per successful task** (including retries, agent steps and failures), since that's what matters to the business.

**Levers (biggest first):**

| Lever | How |
| --- | --- |
| **Right-size the model** | Smallest model that clears your evals per step. Routing and cascades (Chapter 22) |
| **Cut output tokens** | Concise-answer instructions, structured short outputs, `max_tokens`, stop sequences |
| **Cut input tokens** | Retrieve less (rerank, top-k tuned), drop irrelevant context, compress and summarize history, trim tool outputs, remove verbose few-shot examples (or use caching) |
| **Prompt caching** | Cached prefix tokens are billed at a steep discount (Part 4) |
| **Response and semantic caching** | Skip the call for repeated questions (Part 4) |
| **Batch API** | Discounted async processing for non-urgent work |
| **Avoid unnecessary agent steps** | Better tools, step limits, workflows instead of agents when steps are known |
| **Use code instead of LLM calls** | Regex, SQL, rules, classic ML where they work |
| **Control reasoning effort** | Lower thinking budgets for easy tasks |
| **Context management** | Compaction, sub-agents with clean contexts, just-in-time loading (Chapter 8) |
| **Fine-tune a small model** | For high-volume stable tasks, a tuned small model can replace a large one (Chapter 4) |
| **Self-host open-weight** | Cheaper at high, steady volume, with real ops cost (Chapter 24) |
| **Compression techniques** | Prompt compression tools, shorter system prompts |
| **Stop wasted calls** | Deduplicate identical in-flight requests, cancel abandoned streams, don't regenerate on every UI re-render |

**Governance and guardrails for cost:**

- **Budgets and alerts** per project, team, feature, customer (provider dashboards or your gateway)
- **Per-request caps** (`max_tokens`, max steps, max tool calls) and **per-user quotas** (also stops denial-of-wallet abuse)
- **Cost attribution in traces:** tag every call with feature, customer, model, prompt version, so you can find what's expensive (Chapter 25)
- **Anomaly alerts:** sudden jumps in tokens per request, agent steps, or fallback to expensive models
- **Unit economics:** track cost per conversation, per resolved ticket, per document. Compare with the value created.
- **Regular cost reviews** after launches and model changes (price drops and new small models often beat optimization effort)
- Remember **engineering time and quality** are costs too. A 30% token saving that drops resolution rate isn't a win.

**Example calculation:** 1M requests/month, 3,000 input tokens (2,500 of them a cacheable prefix) and 300 output tokens, at illustrative prices of $3 per 1M input, $15 per 1M output, with cached input at 10% of the input price:

- No caching: input = 3,000 × $3/1M = $0.009, output = 300 × $15/1M = $0.0045 → **$0.0135/request** → **$13.5k/month**
- With caching (assume 80% hit rate on the 2,500 prefix): effective input ≈ 500 + 2,500 × (0.2 × 1 + 0.8 × 0.1) = 500 + 700 = 1,200 token-equivalents → $0.0036, plus output $0.0045 → **$0.0081/request** → **$8.1k/month** (about 40% saved). Cutting output to 200 tokens saves another $0.0015/request. (Prices are illustrative, so check current ones.)

## Part 4: Prompt caching and semantic caching

### Prompt (prefix) caching (recap from Chapter 9, with the cost view)

- The provider reuses the computation for an identical prompt prefix, giving **discounted input tokens and lower TTFT**
- **Design:** static content first (tools, system prompt, examples, documents), dynamic content last. Keep serialization deterministic, and avoid volatile values at the top.
- Check minimum cacheable length, TTL, and whether you must mark breakpoints (provider-specific)
- **Monitor the cache hit rate** from usage fields. A sudden drop usually means someone put something volatile in the prefix.
- A cache write may cost slightly more than normal input, so it pays off only with enough reuse.

### Response (exact-match) caching

- Store the full answer keyed by a **hash of the normalized request** (model, prompt version, parameters, input). Return the stored answer on an identical request.
- Good for **deterministic, repeated** queries (FAQ-style, batch re-runs, idempotent pipelines, tests).
- Requires temperature 0 or acceptance that answers are frozen. **Include everything that affects the answer in the key** (model version, prompt version, retrieved context version, user-specific data).
- Use **TTLs** and **invalidation** when underlying data changes.

### Semantic caching

- Store (query embedding, answer). For a new query, embed it and look up the **nearest cached query**. If similarity is above a threshold, **return the cached answer** and skip the LLM call.
- **Pros:** big savings and near-zero latency for repeated, paraphrased questions ("how do I reset my password?" / "forgot my password, what now?").
- **Cons and risks:**
    - **False hits:** "similar" isn't "same". "Cancel my order" versus "cancel my subscription" can be close in embedding space but need different answers. A wrong cached answer is served confidently.
    - **Threshold tuning** is delicate: too low causes wrong answers, too high gives few hits. Tune on labeled pairs, and measure the false-hit rate.
    - **Personalization and permissions:** never serve one user's cached answer to another when the answer depends on user data or access rights. **Scope the cache** per tenant, role or user, or only cache non-personalized answers.
    - **Staleness:** cached answers outlive policy or data changes, so use TTLs and invalidate on content updates (tie to the document version).
    - **Context-dependence:** multi-turn follow-ups ("what about the second one?") can't be cached by query text alone. Cache on **condensed standalone queries** (Chapter 12), and avoid caching follow-ups.
    - **Security:** the cache can leak information across users if keyed carelessly, and **poisoned entries** persist and get served repeatedly.
- **Implementation:** a vector store (Redis, a vector DB, GPTCache-style libraries) with metadata (tenant, language, doc version, TTL, model and prompt version).
- **Best practices:** start with a **high threshold** and a **narrow scope** (public FAQ-type content), log hits with the matched query and similarity, sample hits for **human or judge review**, and allow a fast cache-bypass flag.
- Consider a **two-stage check**: after a semantic match, run a cheap verifier (a small model or rules) to confirm the cached answer fits.

```python
def cached_answer(query, tenant, threshold=0.92):
    q = normalize(query)
    exact = redis.get(key(tenant, MODEL, PROMPT_V, hash(q)))
    if exact: return exact                                  # response cache
    vec = embed(q)
    hit = vector_cache.search(vec, filter={"tenant": tenant, "doc_v": DOC_VERSION}, k=1)
    if hit and hit.score >= threshold and verifier_ok(query, hit.query):
        return hit.answer                                   # semantic cache
    ans = llm_answer(query)
    store_in_caches(q, vec, ans, tenant)
    return ans
```

### The caches compared

| | Prompt caching | Response caching | Semantic caching |
| --- | --- | --- | --- |
| What is saved | Input computation (KV) | Entire output | Entire output |
| Match | Exact token prefix | Exact request | Similar meaning |
| Fresh generation each time? | Yes | No | No |
| Risk | Low (just config) | Stale or frozen answers | **Wrong or leaked answers** |
| Savings | Input cost and TTFT | Whole call | Whole call |
| Best for | Long, stable prefixes | Repeated identical requests | High-volume FAQ-like traffic |

**Other caches to remember:** embedding cache (don't re-embed the same text), retrieval result cache, tool-result cache (idempotent lookups, with TTL), and KV cache inside the inference server (Chapter 24).

**Use case:** a bank's public FAQ bot uses prompt caching for its 8k-token policy prefix, and a semantic cache (threshold 0.94, scoped to non-personalized questions, 24-hour TTL, invalidated on policy updates) that serves 35% of traffic. Account-specific questions bypass the cache entirely.

## Interview Q&A

**1. How do you handle 429s?**
Retry with exponential backoff and jitter honoring `Retry-After`, plus client-side token-bucket throttling, concurrency limits, queues, priority lanes, per-user limits, and quota increases. Reduce token usage too.

**2. Why can a large `max_tokens` cause rate-limit problems?**
Providers often count requested output tokens against TPM, so oversizing reserves quota. Set it realistically.

**3. What causes retry storms, and how do you avoid them?**
Many clients retrying at once after a failure. Use jitter, retry caps, circuit breakers, and backpressure.

**4. Where does LLM latency come from?**
Network, queueing, prefill (input), decode (output tokens, sequential), and your own retrieval, tools and guardrails. Output length is usually the dominant lever.

**5. TTFT vs total latency?**
TTFT is dominated by prefill and queueing. Total latency is dominated by output length times per-token decode time. Streaming improves perceived latency, not total time.

**6. List five ways to cut latency.**
Stream, shorten outputs, use a smaller model for easy steps, trim the prompt, cache the prefix, parallelize independent calls, reduce sequential LLM hops, speculative decoding (self-hosted).

**7. How do you reduce LLM cost?**
Right-size and route models, cut output and input tokens, prompt and semantic caching, batch APIs, avoid unnecessary agent steps, use code where possible, and set budgets and quotas.

**8. Why do agents get expensive?**
Each step resends the growing context and adds output tokens, so cost scales with steps (and superlinearly without context management).

**9. Prompt caching vs semantic caching?**
Prompt caching reuses the prefix computation and still generates a fresh answer (safe). Semantic caching returns a stored answer for similar queries (bigger savings, but risks false hits, staleness and cross-user leakage).

**10. How do you make semantic caching safe?**
High threshold, narrow scope (non-personalized content), per-tenant keys, TTL and invalidation on data changes, a verifier step, hit logging with sampled review, and a bypass flag.

**11. What do you track for cost governance?**
Tokens and cost per request, feature, customer and model, cache hit rate, budgets and alerts, anomaly detection, and unit economics (cost per resolved task).

**12. (Follow-up) Your bill doubled but traffic didn't. Where do you look?**
Tokens per request (a prompt or context bloat), agent steps and loops, cache hit-rate drop, fallback to a larger model, output length growth, retries, and a new feature or customer. Use cost-attributed traces.

## Cheat sheet

Rate limits: throttle client-side, backoff with jitter, queue, prioritize, limit per user. Latency: measure p95 by stage, then stream, shorten outputs, shrink prompts, parallelize, cache. Cost: output tokens and agent steps dominate, so right-size models, cache, batch and set budgets. Semantic cache saves the most and risks the most.

## Self-check

1. Your TPM limit is hit although request counts are low. Why might that be?
2. A cached answer was served to the wrong customer. What went wrong in the cache design?
3. Where do you look first when p95 latency doubles?
4. Estimate the savings: a 10k-token prefix reused across 1M requests with a 90% cache hit rate and cached tokens at 10% price.

# Chapter 24: Model Serving (vLLM), KV Cache and Batching, GPU Fundamentals

This chapter is for when you **self-host** open-weight models (Chapter 5). It explains why LLM inference is hard and how modern serving engines fix it.

## Part 1: GPU fundamentals

**Why GPUs.** LLM inference is dominated by **matrix multiplications**, which GPUs do massively in parallel (thousands of cores plus specialized **tensor cores** for low-precision matrix math).

**The memory hierarchy (the key to understanding performance):**

| Memory | Size (typical high-end) | Speed | Role |
| --- | --- | --- | --- |
| **HBM / VRAM** (GPU main memory) | 24 to 192 GB | Very high bandwidth (about 1 to 8 TB/s on datacenter GPUs) | Holds weights, KV cache, activations |
| **SRAM / shared memory / L2 cache** (on-chip) | MBs | Much faster | Where FlashAttention-style kernels work |
| **CPU RAM** | 100s of GB | Much slower (tens to 100s GB/s over PCIe/NVLink) | Offloading, swapping |
| **Disk / network** | TBs | Slowest | Model storage, loading time |

**Compute-bound vs memory-bound.**

- **Compute-bound:** the limit is arithmetic throughput (FLOPs). **Prefill** (processing the whole prompt in parallel) is mostly compute-bound.
- **Memory-bandwidth-bound:** the limit is how fast data moves from HBM to the cores. **Decode** (generating one token at a time) is **memory-bound**, because for every token the GPU must stream essentially **all model weights** (plus the KV cache) from HBM, while doing relatively little math per byte.

**Back-of-envelope decode speed:**
`tokens/sec per sequence ≈ memory bandwidth / bytes read per token`.
Example: a 70B model in fp16 is about 140 GB. On a GPU with about 3 TB/s effective bandwidth, one token needs about 140 GB of reads, so ≈ 3,000 / 140 ≈ **21 tokens/s** at batch size 1 (and the model wouldn't fit on one 80 GB card anyway). With **4-bit** weights (about 35 GB) you'd get roughly 4x the speed (about 80 tokens/s), which is why quantization (Chapter 4) speeds up decoding. **Batching** amortizes the weight reads across many sequences (Part 3).

**GPU memory budget:**

```
VRAM needed ≈ model weights + KV cache + activations/workspace + framework overhead (≈10-20%)

weights ≈ params × bytes_per_param   (fp16: 2, int8/fp8: 1, int4: 0.5)
```

**Multi-GPU parallelism (when the model doesn't fit, or you need more throughput):**

| Strategy | What's split | Notes |
| --- | --- | --- |
| **Tensor parallelism (TP)** | Each layer's matrices split across GPUs | Needs fast interconnect (NVLink). Reduces per-token latency. The common choice within one node |
| **Pipeline parallelism (PP)** | Different layers on different GPUs | Fits very large models, adds pipeline bubbles and latency |
| **Data parallelism / replicas** | Full copies of the model on different GPUs | Scales **throughput** (more concurrent users), not model size |
| **Expert parallelism** | MoE experts spread across GPUs | For Mixture-of-Experts models |
| **Sequence / context parallelism** | Long sequences split across GPUs | Very long contexts |

**Interconnects:** NVLink and NVSwitch (fast, within a node), InfiniBand or high-speed Ethernet (between nodes), PCIe (slow, avoid for TP).

**Hardware tiers (verify current specs):** consumer GPUs (RTX series, 24 to 32 GB), datacenter GPUs (A100 40/80 GB, H100 80 GB, H200 and B200-class with larger and faster HBM), and alternatives (AMD Instinct, Google TPUs, AWS Inferentia/Trainium, specialized inference chips). Pick by VRAM, bandwidth, interconnect, price, availability and software support (CUDA ecosystem maturity).

**Precision and formats:** fp16/bf16 (default), **fp8** (native on newer GPUs, good quality and about 2x memory savings), int8, and int4 via GPTQ, AWQ and similar (Chapter 4). Lower precision means smaller weights and faster decode, with quality trade-offs to validate by evals.

**Other practical GPU topics:**

- **Cold start and model load time:** loading tens of GB takes minutes. Keep warm replicas, use fast storage, and plan autoscaling lead time.
- **Utilization:** GPUs are expensive when idle. Batch aggressively, scale with load, and consider spot or preemptible capacity for batch workloads.
- **Monitoring:** GPU utilization, memory, temperature, errors (DCGM, nvidia-smi), plus serving metrics (queue depth, TTFT, TPS).
- **MIG / GPU sharing:** partitioning a big GPU for several small models.

## Part 2: KV cache

(Recall from Chapters 1 and 9.) During generation, each new token needs the **K and V vectors of all previous tokens** in every layer. Without caching, you'd recompute them for the whole sequence at every step. The **KV cache** stores them so each step only computes K and V for the **new** token.

**Two phases:**

1. **Prefill:** process the entire prompt in one parallel pass, **populating the KV cache** (compute-bound, determines TTFT)
2. **Decode:** generate token by token, reading the KV cache and appending one entry per step (memory-bound)

**KV cache size formula:**

```
KV bytes per token = 2 (K and V) × num_layers × num_kv_heads × head_dim × bytes_per_value

Total = KV bytes per token × sequence_length × batch_size (concurrent sequences)
```

**Worked example:** a Llama-2-70B-style model with 80 layers, 8 KV heads (GQA), head_dim 128, fp16 (2 bytes): `2 × 80 × 8 × 128 × 2 = 327,680 bytes ≈ 320 KB per token`.

- One 4,096-token sequence ≈ 1.3 GB
- 32 concurrent sequences ≈ 42 GB
- One 128k-token sequence ≈ 42 GB

(Without GQA, with 64 KV heads, the same model would need 8x more, around 2.6 MB per token. That's why GQA matters.) **The KV cache, and not the weights, often limits how many users you can serve concurrently.**

**Techniques to shrink or manage the KV cache:**

| Technique | Idea |
| --- | --- |
| **MQA / GQA** (Multi-Query / Grouped-Query Attention) | Share K and V across groups of query heads. Cuts KV size several-fold with small quality loss. Built into the model architecture |
| **MLA** (Multi-head Latent Attention) | Compress K and V into a low-rank latent (used in some recent models), a large KV reduction |
| **KV cache quantization** | Store K and V in fp8 or int8/int4. Halves or quarters the memory, validate quality |
| **Sliding-window / local attention** | Keep only recent tokens in some layers, bounded KV per sequence |
| **Paged KV cache (PagedAttention)** | Eliminates fragmentation (Part 3) |
| **Prefix caching** | Reuse KV blocks for shared prompt prefixes across requests (the server-side basis of prompt caching, Chapter 9) |
| **KV offloading** | Move cold KV blocks to CPU RAM or disk and bring them back when needed |
| **Eviction / compression methods** | Drop or compress less important tokens (research and some production use, with quality risk) |
| **Shorter contexts** | The simplest lever (context engineering, Chapter 8) |

**Why long contexts are expensive (now quantified):** KV memory grows **linearly** with length and with the number of concurrent users, and attention compute grows quadratically in prefill (Chapter 1).

**Prefill/decode disaggregation:** since prefill is compute-bound and decode is memory-bound, large deployments run them on **separate GPU pools** (prefill workers pass KV to decode workers) to tune each independently and avoid long prefills stalling decoding. **Chunked prefill** is a lighter alternative: split long prompts into chunks interleaved with decode steps so ongoing generations don't stall.

## Part 3: Batching and vLLM

### Why batching matters

Decode is memory-bound: reading the weights for **one** sequence wastes the GPU's compute. If you process **many sequences in the same forward pass**, the **same weight reads are shared**, so throughput rises almost linearly with batch size until you become compute-bound or run out of KV memory. Batching is the main reason serving engines exist, and **cost per token falls as utilization rises**.

### Batching strategies

| Strategy | How | Problem / benefit |
| --- | --- | --- |
| **No batching** | One request at a time | Terrible GPU utilization |
| **Static batching** | Collect N requests, process together until **all** finish | Short requests wait for the longest in the batch, with idle slots (wasted compute) |
| **Dynamic batching** | Wait a short time window to form a batch | Better, but still waits for the batch to finish |
| **Continuous (in-flight / iteration-level) batching** | At **every decode step**, finished sequences leave and new ones join immediately | **Highest utilization and throughput.** The standard in modern engines |

**Continuous batching in a picture:**

```
step:   1  2  3  4  5  6  7  8
seq A:  █  █  █  █  (done) → slot reused by seq D from step 5
seq B:  █  █  █  █  █  █  █  █
seq C:  █  █  (done) → slot reused by seq E from step 3
```

### vLLM and PagedAttention

**The problem vLLM solved.** Naive serving **pre-allocates a contiguous KV buffer** for each request sized for the maximum possible length. Most of it stays unused, and memory fragments, so **60 to 80% of KV memory was wasted**, limiting batch size and throughput.

**PagedAttention.** Inspired by operating-system virtual memory: split each sequence's KV cache into small fixed-size **blocks (pages)** that can live **anywhere** in GPU memory. A **block table** maps each sequence's logical positions to physical blocks. Memory is allocated **on demand** as the sequence grows.

Benefits:

- **Near-zero fragmentation**, so a much larger batch fits in the same VRAM (often 2 to 4x or more throughput than earlier systems)
- **Sharing:** sequences with a common prefix (system prompt, few-shot examples, or parallel samples from one prompt) share the same physical blocks, with **copy-on-write**. This enables **automatic prefix caching**.
- **Flexible scheduling:** preempt and swap sequences' blocks to CPU memory when the GPU fills up.

**What vLLM provides (summary):**

- PagedAttention and **continuous batching**
- **Chunked prefill** and prefix caching
- Tensor and pipeline parallelism
- Quantization support (AWQ, GPTQ, FP8, and others), and **LoRA adapter serving** (multiple adapters on one base model, Chapter 4)
- **Speculative decoding**, structured output (guided decoding, JSON schema), and multimodal models
- An **OpenAI-compatible API server**, so clients switch with a base-URL change
- Metrics endpoint (Prometheus) for monitoring

```bash
# serve an open model with an OpenAI-compatible API
vllm serve <model-id> \
  --tensor-parallel-size 2 \
  --max-model-len 16384 \
  --gpu-memory-utilization 0.90 \
  --enable-prefix-caching
# then use any OpenAI-compatible client with base_url="http://host:8000/v1"
```

**Important knobs:**

| Setting | Effect |
| --- | --- |
| `max-model-len` | Max context per request. Larger needs more KV memory and fewer concurrent sequences |
| `gpu-memory-utilization` | Fraction of VRAM vLLM may use (weights plus KV cache pool) |
| `max-num-seqs` | Max concurrent sequences in a batch |
| `max-num-batched-tokens` | Token budget per step (affects prefill chunking and latency) |
| `tensor-parallel-size` | GPUs per replica |
| Quantization and KV-cache dtype | Memory vs quality |
| Prefix caching on or off | Big win for shared prompts |

**Throughput vs latency trade-off:** bigger batches mean higher total tokens/s and a lower cost per token, but each user's latency (and TTFT during queueing) increases. Set the operating point by your SLO (for example p95 TTFT under 1 s, 30+ tokens/s per user), then scale replicas.

### Other serving engines

- **TensorRT-LLM** (NVIDIA): very high performance on NVIDIA GPUs, more complex build and deploy
- **SGLang:** fast, with RadixAttention (prefix reuse) and strong structured-generation and multi-call program support
- **Hugging Face TGI** (Text Generation Inference)
- **llama.cpp / Ollama:** CPU, Apple Silicon and edge, GGUF quantized models (great for local use, not for high-throughput serving)
- **Triton Inference Server, KServe, Ray Serve:** orchestration layers
- **Managed inference platforms** (Together, Fireworks, Baseten, Modal, Anyscale, cloud endpoints): run open models for you, which is often cheaper to start than operating GPUs yourself

### Speculative decoding

A small **draft model** proposes several tokens, and the large **target model verifies them in one parallel pass**, accepting the matching prefix. The output distribution is **identical** to the target model's, and decoding gets about **2 to 3x faster** when the draft agrees often (best at low batch sizes and low temperature). Variants: Medusa and EAGLE (extra prediction heads), n-gram and prompt-lookup drafting.

### FlashAttention

An exact attention algorithm that **tiles** computation so the n × n matrix never gets written to HBM, using fast on-chip SRAM. It reduces memory traffic (and memory use from O(n²) to O(n)) and speeds up prefill and long-context workloads. It's standard in modern engines.

### Scaling and operations

- **Autoscaling:** scale replicas by queue depth or concurrent requests (not just GPU utilization), and plan for slow model load times with warm pools
- **Load balancing** with prefix-aware routing (send requests with the same prefix to the same replica to hit the prefix cache)
- **Capacity planning:** estimate peak concurrent sequences × average context length to size the KV cache, then replicas
- **Multi-LoRA serving:** one base model serving many tenants' adapters
- **Disaggregated prefill and decode**, and KV transfer for very large deployments
- **Observability:** TTFT, inter-token latency, queue time, tokens per second, batch size, KV cache utilization, preemptions and GPU metrics, plus request traces
- **Reliability:** health checks, graceful drains on deploy, fallbacks to an API provider (Chapter 22)
- **Security:** isolate the endpoint (private network, auth), since an open inference port is an expensive target

### Self-host or API? (decision)

| Choose self-hosting when | Choose APIs when |
| --- | --- |
| Data can't leave your environment | Moderate or spiky volume |
| High, steady volume where GPU utilization stays high | You need frontier-quality models |
| Deep customization (fine-tuning, quantization, custom serving) | You lack MLOps capacity |
| Strict latency or offline or edge needs | You want fast iteration and no capacity planning |

The honest cost comparison includes GPU cost at **real utilization**, engineering and on-call time, redundancy, and the quality gap to the best closed models. Many teams use **hybrid**: self-hosted small models for high-volume simple tasks, APIs for hard ones (routing, Chapter 22).

**Use case:** a company serves a 70B open model in 4-bit AWQ on 2 GPUs with tensor parallelism. They enable prefix caching (a shared 3k-token system prompt), continuous batching, and an fp8 KV cache. Measured: 3x concurrent users per GPU versus the naive setup, p95 TTFT under 1.2 s. They size replicas from peak concurrent sequences, and keep an API fallback for overflow.

## Interview Q&A

**1. Why is LLM decoding memory-bound?**
Each generated token requires streaming nearly all weights (plus the KV cache) from HBM while doing little math per byte, so speed is limited by memory bandwidth, not FLOPs.

**2. Prefill vs decode?**
Prefill processes the whole prompt in parallel (compute-bound, sets TTFT, fills the KV cache). Decode generates one token per step (memory-bound, sets tokens per second).

**3. Estimate decode speed for a model.**
Roughly memory bandwidth divided by bytes read per token (about the model size), so a smaller or quantized model decodes faster, and batching improves total throughput.

**4. What is the KV cache and how big is it?**
Stored K and V for all previous tokens per layer, avoiding recomputation. Size per token = 2 × layers × KV heads × head_dim × bytes, times sequence length times concurrent sequences. It often limits concurrency more than the weights.

**5. How do you reduce KV cache memory?**
GQA/MQA/MLA in the architecture, KV quantization, sliding windows, paging, prefix sharing, offloading, and shorter contexts.

**6. What is continuous batching?**
Scheduling at the iteration level: finished sequences leave and new ones join at every step, which keeps the GPU busy, unlike static batching where short requests wait for the longest.

**7. What problem does PagedAttention solve?**
KV memory fragmentation and over-allocation. It stores KV in fixed-size blocks mapped by a block table (like virtual memory), enabling larger batches and prefix sharing.

**8. What is prefix caching in a serving engine?**
Reusing KV blocks for requests that share a prompt prefix, which reduces prefill compute and TTFT. It's the server-side mechanism behind provider prompt caching.

**9. Tensor vs pipeline vs data parallelism?**
Tensor splits each layer across GPUs (needs NVLink, lowers latency), pipeline splits layers across GPUs (fits larger models, adds bubbles), data parallel replicates the model to scale throughput.

**10. What is speculative decoding?**
A draft model proposes tokens and the target model verifies them in parallel, giving 2 to 3x faster decoding with identical output distribution.

**11. How does FlashAttention help?**
It computes exact attention in tiles in on-chip SRAM, avoiding writing the n × n matrix to HBM, which cuts memory traffic and memory use.

**12. Throughput vs latency trade-off in serving?**
Larger batches raise total throughput and lower cost per token but increase per-user latency and queueing. Choose the operating point from your SLO.

**13. When do you self-host vs use an API?**
Self-host for data control, high steady volume, customization, or edge needs. Use APIs for frontier quality, variable load and low ops burden. Compare cost at real GPU utilization including engineering time.

**14. How do you capacity-plan an LLM service?**
Estimate peak concurrent sequences and context length to size the KV cache, add weights and overhead to get VRAM per replica, choose parallelism, set replicas from the throughput measured at your latency SLO, and add autoscaling and an overflow fallback.

## Cheat sheet

GPU: HBM bandwidth limits decode, compute limits prefill. VRAM = weights + KV cache + overhead. KV per token = 2 × layers × KV heads × head_dim × bytes. Continuous batching plus PagedAttention (vLLM) maximize utilization. Prefix caching, GQA, KV quantization and FlashAttention reduce cost. Parallelism: TP for fit and latency, replicas for throughput. Speculative decoding speeds up decode.

## Self-check

1. A 13B model in fp16 on an 80 GB GPU: roughly how much VRAM is left for the KV cache, and what limits your concurrency?
2. Why does quantizing weights speed up decoding?
3. Why does continuous batching beat static batching?
4. 40 GB of KV pool, 320 KB per token, 4k-token contexts. About how many concurrent sequences fit?

# Chapter 25: User Feedback Loops, Observability and Tracing, Production Guardrails, PII Redaction and Privacy, CI/CD for LLM Apps

This is the final chapter of the main course. It joins everything into the **continuous improvement loop** of a production system.

## Part 1: User feedback loops

**The loop:**

```
Users → Production traffic → Capture signals → Triage & error analysis → Improve (prompts, retrieval, tools, data, models)
   → Offline evals → Staged rollout (shadow/canary/A-B) → Monitor → ...
```

**Feedback signals:**

| Type | Examples | Notes |
| --- | --- | --- |
| **Explicit** | Thumbs up/down, star ratings, "report a problem", free-text comments, corrections and edits | Clearer but **sparse** and skewed (people mostly report the bad or the great) |
| **Implicit (behavioral)** | Copy or use of the answer, accepting a suggestion, edit distance of the user's edits, follow-up rephrasing (the first answer failed), retries and regenerations, abandonment, escalation to a human, time to resolution, task completion, session length (ambiguous) | Plentiful but **noisy** and needs interpretation |
| **Human review** | Sampled annotation by experts or support staff | Costly, high-quality, calibrates judges |
| **Automated evaluation** | Online judges and checks on sampled traffic (Chapter 21) | Scalable and approximate |
| **Business outcomes** | Conversion, retention, CSAT, resolved tickets, refunds, complaints | The real goal, but slow and confounded |

**Designing feedback collection:**

1. **Make it low-friction:** one-click thumbs, then an optional reason chip ("wrong", "outdated", "unhelpful", "unsafe") and an optional comment. Structured reasons make triage far easier.
2. **Ask at the right moment** (after the answer, not mid-task), and don't spam.
3. **Capture context with every signal:** the trace ID, prompt and model versions, retrieved documents, tool calls. A thumbs-down without the trace is almost useless.
4. **Capture corrections:** when users edit a draft, the diff is **gold data** (a preferred output).
5. **Segment:** by feature, user type, language, query type and version, so you see where quality differs.
6. **Respect privacy and consent** (Part 4): disclose how feedback and conversations are used, and honor opt-outs.

**Pitfalls in interpreting feedback:**

- **Selection bias:** unhappy users and power users give more feedback
- **Position and UI bias:** button placement changes rates
- **Thumbs aren't ground truth:** users upvote confident wrong answers (sycophancy and fluency bias) and downvote correct but unwelcome ones
- **Feedback vs outcome:** high satisfaction doesn't equal correctness (in medical or legal domains, verify with experts)
- **Goodhart's law:** optimizing directly for thumbs-up can reward flattery and verbosity
- **Feedback loops can amplify bias** if you only learn from what the system already surfaced

**Turning feedback into improvements (the process):**

1. **Collect and triage:** route negative feedback and low judge scores into a **review queue**, prioritized by severity, frequency and segment. All safety and legal flags go to a fast lane.
2. **Error analysis** on a regular cadence (Chapter 18): read traces, categorize the first failure, count.
3. **Fix the right layer.** Common root causes and fixes:

| Root cause | Fix |
| --- | --- |
| Stale or missing knowledge | Update the index, metadata filters, ingest new documents |
| Retrieval miss | Chunking, hybrid search, reranking, query rewriting |
| Prompt ambiguity or format issues | Prompt and schema changes with tests |
| Wrong tool use | Tool descriptions and schemas |
| Style or behavior at scale | Few-shot examples, or fine-tuning with collected data |
| Safety gaps | Guardrails, permissions, policy updates |
| Wrong model for the task | Routing or a model change |

4. **Add each confirmed failure to the golden and regression sets** (Chapter 18, 21), so it never silently returns.
5. **Use feedback as data:**
    - **Few-shot or dynamic example pools** (accepted and edited outputs, validated)
    - **Preference pairs** (chosen versus rejected) for DPO-style tuning (Chapter 3)
    - **SFT data** from corrected outputs (after review and PII scrubbing, with user consent)
    - **Reranker and embedding fine-tuning** from click or citation data
    - **Judge calibration data**
    - **Memory** updates (carefully, Chapter 15)
6. **Ship through staged rollout** and measure the effect (Chapter 21).
7. **Close the loop with users** where relevant ("we fixed this").

**Active learning:** prioritize labeling for cases where the judge is uncertain, where users disagree with the system, and for new or rare query clusters.

**Data governance for feedback data:** consent and purpose limitation, PII scrubbing before it enters training or eval sets, retention limits, access control, and keeping a **human review gate** before any feedback-derived data is used for training (to prevent poisoning, bias amplification and privacy leaks).

**Use case:** a support bot adds a thumbs-down reason chip. A weekly review of 100 flagged traces finds 40% are "outdated policy". The team fixes the ingestion pipeline (document version metadata), adds those cases to the regression set, and the thumbs-down rate for policy questions falls from 14% to 6%.

## Part 2: Observability and tracing

(Agent tracing was introduced in Chapter 17. Here is the full production view.)

**Observability** = being able to understand what your system is doing and why from its outputs (telemetry), including for failures you didn't predict. For LLM apps, standard monitoring (is it up, how fast) isn't enough, because **a system can be perfectly "healthy" while giving wrong answers**.

**Three layers to monitor:**

| Layer | What | Examples |
| --- | --- | --- |
| **Infrastructure and service** | Standard SRE metrics | Uptime, error rates, latency p50/p95/p99, queue depth, GPU use (if self-hosting), saturation |
| **LLM operational** | Model-call metrics | Tokens in and out, **cost**, TTFT and TPS, **cache hit rate**, rate-limit and fallback rates, retry counts, stop-reason distribution (truncation rate), model and prompt version in use |
| **Quality and safety** | Is the output good? | Online judge scores (faithfulness, relevance, policy), guardrail trigger rates, refusal and over-refusal rates, user feedback rates, escalation rates, hallucination and citation-failure rates, **drift** indicators |

**Traces, spans and logs (recap):**

- A **trace** records one request or run end to end as a tree of **spans**: retrieval, each LLM call, each tool call, guardrail checks, sub-agents.
- Each span captures **inputs, outputs, timing, token usage, cost, errors**, plus metadata: **user/session ID, prompt version, model version, index version, feature flag, environment**.
- Use a **consistent trace ID** across services and agents (OpenTelemetry context propagation).
- **Standards and tools:** **OpenTelemetry** with GenAI semantic conventions (vendor-neutral), and LLM-observability platforms (Langfuse, LangSmith, Arize Phoenix, Braintrust, Helicone, W&B Weave, Datadog LLM Observability, and others). Many frameworks have auto-instrumentation.

**What good production telemetry enables:**

1. **Debugging:** go from a user complaint to the exact trace and the first wrong step (Chapter 17)
2. **Cost attribution:** cost per feature, customer, model, prompt version
3. **Latency breakdown:** which stage dominates p95 (Chapter 23)
4. **Quality monitoring:** trends in judge scores and feedback by version and segment
5. **Drift detection:** changes in input topics and languages, retrieval score distributions, output length, refusal rate, tool usage patterns
6. **Experiment analysis:** compare versions and A/B arms
7. **Incident response:** find affected users and requests, replay, and verify the fix
8. **Compliance and audit:** who accessed what, which tools ran, approvals given

**Dashboards to build:**

- Executive: task success, user satisfaction, cost per task, incident count
- Operations: latency, errors, saturation, fallback and rate-limit rates
- Quality: judge scores by criterion and segment, feedback, guardrail triggers
- Cost: spend by feature, model and customer, tokens per request trend, cache hit rate
- Agents: steps per run, tool success rates, loop hits, approval rates

**Alerts (on symptoms and leading indicators):**

- Error rate and p95 latency over thresholds
- **Cost per request or daily spend anomaly**
- **Fallback rate spike** (a hidden provider incident)
- Cache hit rate drop
- Guardrail trigger or injection-detector spikes
- **Online quality score drop** (compare to a rolling baseline, with significance)
- Truncation (`max_tokens`) rate rise
- Loop-detector or max-step hits
- Retrieval no-result rate rise

**Sampling, retention and cost of telemetry:**

- Trace **100% in dev and staging**. In production, sample (for example 5 to 20%) **plus 100% of errors, low-score, flagged and high-cost runs** (tail-based sampling).
- Full prompts and outputs are **large and sensitive**, so set retention windows, tiered storage, and access controls.
- Telemetry itself costs money (storage, judge calls), so budget it.

**Privacy in observability:** traces contain user data. Redact PII before storage where possible (Part 4), restrict who can view raw traces (role-based access, audit logs), encrypt at rest and in transit, honor deletion requests across logs and traces, and keep a separate, minimal-retention policy for raw content.

**Versioning in telemetry:** always log prompt version, model snapshot, index/chunking version, tool versions, and feature flags. Without them, you can't attribute a quality shift to a change.

**Replay and debugging:** the ability to **re-run a logged request** (same inputs, same context) against a new prompt or model is extremely valuable for fixing and testing. Store enough to reproduce (retrieved chunks, tool outputs), subject to privacy rules.

**Use case:** the dashboard shows daily cost up 40% with flat traffic. Cost-attributed traces reveal a new feature's agent averaging 14 steps because a tool returns huge JSON. The team trims the tool output, caps steps, and sets an alert on tokens per request.

## Part 3: Guardrails in production

(Layers and permissions were covered in Chapter 17. This is the operational view.)

**Recap of layers:** input guardrails (scope, injection and jailbreak detection, PII), tool-call guardrails (schema validation, allowlists, limits, approvals), output guardrails (policy, PII, groundedness, format). **Permissions in code are the real protection.**

**Production concerns:**

1. **Latency budget.** Every guardrail adds time. Run **cheap deterministic checks first**, small classifiers next, LLM-based checks only when needed, and run guardrails **in parallel** with generation where possible (cancel the generation if a tripwire fires). With streaming, apply chunk-level checks (Chapter 22).
2. **False positives vs false negatives.** Measure both on labeled data. Over-blocking harms UX and trust, and under-blocking causes incidents. Set thresholds **per use case and risk** (stricter for medical and financial advice).
3. **Fail-open vs fail-closed.** High-risk actions fail closed (block if the guardrail errors or times out). Low-risk UX features may fail open with logging.
4. **Graceful handling of blocks.** Give the user a helpful, non-leaky message ("I can't help with that, but I can...") and don't reveal the detection logic. Offer escalation paths. **Don't retry the same blocked request automatically.**
5. **Policy as configuration.** Keep rules, blocked topics, thresholds and allowlists in versioned config, with change review and testing, so policy updates don't require redeploys and are auditable.
6. **Layered by risk tier** (Chapter 17): read-only actions auto-run, high-impact ones need human approval, forbidden ones don't exist.
7. **Continuous testing:** keep guardrail test suites (benign borderline cases that must pass, adversarial cases that must be blocked), run them in CI, track **attack success rate and over-refusal rate** (Chapter 21), and **red team regularly**.
8. **Monitoring:** trigger rates by guardrail and category, sudden changes (an attack campaign or a regression), per-user repeated triggers (abuse detection, rate-limit or ban), and review samples of both blocked and allowed content.
9. **Update cadence:** attackers adapt, so retrain classifiers, refresh patterns and re-run red teaming. Keep a **fast path** to push emergency rule updates.
10. **Abuse and cost protection:** per-user quotas, rate limits, max input length and max output tokens, step limits, and detection of scraping and automated misuse (**denial-of-wallet**).
11. **Output validation as a contract:** schema validation, groundedness checks and citation verification (Chapter 13) before anything reaches users or downstream systems.
12. **Content provenance and transparency** where required (disclose AI use, watermark generated media, Chapter 26).
13. **Compliance mapping:** map guardrails to regulatory and policy requirements (for example data-protection laws, sector rules like HIPAA or financial regulations, and the EU AI Act categories where relevant), and keep evidence (tests, logs) for audits.
14. **Human escalation path:** a defined process and on-call ownership for safety incidents (detect, contain, notify, fix, post-mortem).

**Tooling landscape (examples):** NVIDIA NeMo Guardrails, Guardrails AI, Llama Guard and similar safety classifiers, provider moderation APIs, Azure AI Content Safety, AWS Bedrock Guardrails, Lakera, Prompt Shields, and open-source classifiers. Evaluate on your own data, not vendor claims.

## Part 4: PII redaction and privacy

**Why it matters.** Prompts, retrieved documents, tool results, logs, traces, caches, memory stores and training data can all contain personal data. Leaks and compliance violations create legal, financial and trust damage. Privacy is a **design constraint from day one**, not an afterthought.

**What counts as sensitive:**

- **PII (direct identifiers):** names, emails, phone numbers, addresses, government IDs, account and card numbers, IP addresses, device IDs
- **Quasi-identifiers:** date of birth, ZIP code, job title (can re-identify in combination)
- **Sensitive categories:** health, financial, biometric, political, religious, sexual orientation, children's data
- **Secrets:** API keys, passwords, tokens, internal URLs
- **Confidential business data:** contracts, source code, unreleased plans

**Where PII flows in an LLM system (map these):**

```
User input → [prompt] → LLM provider → [response] → user
        ↘ logs/traces  ↘ caches  ↘ vector index (RAG)  ↘ memory store  ↘ feedback/eval datasets  ↘ fine-tuning data
```

Each arrow is a place where data can be stored, leaked, retained too long, or sent to a third party.

**Detection methods:**

- **Regex and checksum rules:** emails, phone numbers, credit cards (with Luhn check), national ID formats. Fast and precise for structured identifiers.
- **NER models** (spaCy, Presidio's NLP engines, transformer-based NER) for names, locations and organizations
- **LLM-based detection** for context-dependent or unusual PII. Costly, and itself sends data to a model (use a local one for sensitive flows).
- **Dedicated tools:** Microsoft Presidio, AWS Comprehend PII, Google DLP, Azure AI Language PII
- **Secrets scanners** for keys and tokens
- Measure **precision and recall** on your own data. PII detection is imperfect, and missed items are the risk.

**Redaction strategies:**

| Strategy | How | Pros / cons |
| --- | --- | --- |
| **Masking / removal** | Replace with `[EMAIL]`, `[PHONE]` | Simple and safe. The model loses detail |
| **Pseudonymization / tokenization** | Replace with consistent placeholders (`PERSON_1`), keep a **secure mapping** to restore in the response | The model can still reason about entities ("PERSON_1 emailed PERSON_2"). The mapping store is sensitive |
| **Generalization** | "42 years old" becomes "40 to 50", exact address becomes city | Keeps some utility |
| **Format-preserving encryption / synthetic replacement** | Replace with realistic fake values | Useful for testing and analytics. Don't use fakes that could be real people |
| **Differential privacy / aggregation** | For analytics and training | Strong guarantees, more complex |

```python
# pseudonymize before the LLM call, restore after
text, mapping = pseudonymize(user_input)        # "Email Priya at priya@x.com" → "Email PERSON_1 at EMAIL_1"
answer = llm(system, text)
final  = restore(answer, mapping)               # map placeholders back for the user
# mapping lives only in the request scope or a secure, short-TTL store; never in logs
```

**Design principles:**

1. **Data minimization:** send the model only what it needs. Don't put full customer records in the prompt when two fields are enough, and select fields in the tool layer.
2. **Redact before sending to third parties** (providers, logging vendors, analytics) unless there's a contractual and legal basis to share.
3. **Redact before logging and tracing.** Don't write raw PII to logs, traces, caches or eval sets by default. Use short retention for raw content.
4. **Apply access control at retrieval time** so the user's own permissions bound what enters the context (Chapter 12), and never rely on the prompt.
5. **Output-side redaction:** scan responses for PII or secrets before showing or storing them (the model may repeat sensitive context, or hallucinate realistic-looking PII).
6. **Isolate tenants:** separate indexes or strict filters, per-tenant caches and memory (Chapter 23).
7. **Don't put secrets in prompts** (credentials stay in tool code, Chapter 9).
8. **Control training and fine-tuning data:** scrub PII, get consent, document provenance, and avoid training on customer data unless explicitly allowed. Memorization of training data can leak it.
9. **Vendor due diligence:** data retention and training-use policies (zero-data-retention options), data residency, sub-processors, certifications (SOC 2, ISO 27001), DPAs, BAA for health data. Use enterprise or API terms, not consumer products, for sensitive work.
10. **Deployment options for sensitive data:** private cloud endpoints (Bedrock, Vertex, Azure with private networking), regional residency, or **self-hosted** open-weight models (Chapter 24) when data can't leave.
11. **Memory and caches (Chapters 15 and 23):** store only what's necessary, scope per user, set TTLs, and support deletion.
12. **Rights and requests:** support **access, deletion and correction** requests (GDPR/CCPA-style). That means knowing where a user's data lives (logs, traces, vector indexes, memory, feedback sets) and having deletion processes for each. Deleting from a **vector index** requires tracking which chunks derive from which source.
13. **Retention policies:** define and enforce TTLs for logs, traces, conversations, and feedback datasets.
14. **Encryption:** in transit (TLS) and at rest, with key management, and restricted decryption for trace viewers.
15. **Audit logging:** record who accessed raw data and when.
16. **Privacy testing:** red-team for PII leakage (canary PII in context, attempts to extract other users' data or memory), and measure redaction recall in CI.
17. **Prompt injection ties to privacy:** the exfiltration channels from Chapter 9 (images, links, tool calls) are privacy breaches. Block them architecturally.

**Regulatory awareness (not legal advice, so consult counsel):** GDPR and similar laws (lawful basis, minimization, purpose limitation, data subject rights, cross-border transfers), CCPA/CPRA, HIPAA (health data, BAAs), PCI-DSS (card data, keep it out of the LLM entirely), sector rules, children's privacy laws, biometric laws, and AI-specific regulation (for example the EU AI Act's risk tiers and transparency obligations). Map data flows and document decisions.

**Use case:** a healthcare scheduling assistant redacts names and IDs with Presidio plus custom regex before logging, pseudonymizes entities for the LLM call, runs on a private cloud endpoint with zero data retention under a BAA, keeps traces with raw content for 7 days with restricted access, scans outputs for leaked identifiers, and supports patient deletion requests across logs, memory and vector indexes.

## Part 5: CI/CD for LLM apps

**What's different from traditional CI/CD.** The "code" includes prompts, model choices, retrieval configuration, tool definitions and guardrail policies. Behavior can change **without a code change** (a provider updates a model, the data in the index changes), and tests are **probabilistic** (Chapters 18 to 21). You need CI/CD that tests **behavior**, not just code.

**What to version and release as artifacts:**

- **Application code**
- **Prompts and templates** (Git, reviewed, with a version ID)
- **Model and parameters** (pinned snapshot, temperature, max tokens)
- **Tool definitions and schemas**
- **Retrieval config and index versions** (chunking, embeddings, reranker, **the index itself** is a data artifact built by a pipeline)
- **Guardrail policies and thresholds**
- **Eval datasets and judge prompts** (versioned)
- **Infrastructure** (IaC for serving, gateways, queues)

**A typical pipeline:**

```
PR opened
  ├─ Lint / type check / unit tests (normal code)
  ├─ Prompt & config validation (templates render, schemas valid, no secrets, token-budget check)
  ├─ Deterministic evals on the golden set (fast, every commit)        ──► fail = block
  ├─ Safety & red-team regression suite (injection, policy, canaries)  ──► any critical fail = block
  ├─ LLM-judge evals (nightly or on PR label, costlier)                ──► compare vs baseline, per criterion
  ├─ Cost & latency checks (tokens/request, p95 in a staging load test)──► budget regression = block/warn
  └─ Report posted to the PR: metric deltas, flipped cases, cost change
Merge to main
  ├─ Build artifacts, version everything (prompt@v13, index@2026-10-24, model snapshot)
  ├─ Deploy to staging → smoke tests + full evals on staging
  ├─ Shadow / canary (1-5%) with automatic rollback on guardrail/error/quality breach
  ├─ A/B or progressive ramp to 100% (Chapter 21)
  └─ Post-deploy monitoring + scheduled evals (catch silent drift)
```

**Gating rules (examples):**

- **Hard gates:** schema validity 100%, safety and policy suite 100%, no regression on critical cases, injection ASR under a threshold
- **Soft gates (statistical):** no drop in key quality metrics beyond a tolerance (with confidence intervals), cost per task within +X%, p95 latency within +Y%
- Require a **human review of flipped cases** for borderline changes
- **Don't update expected outputs just to make tests pass** without review

**Managing non-determinism and cost in CI:**

- Run **deterministic checks on every commit** and **expensive judge suites** on PRs, nightly, or on demand
- Use **smaller, fixed sample sets** for fast checks, and the **full set** before release
- **Cache** LLM responses for unchanged inputs in test runs (keyed by prompt, model, input), recording and replaying in unit tests
- Run flaky cases multiple times, and use thresholds
- Use **mocked LLMs or recorded responses** for pure plumbing tests (routing, parsing, error handling), and **real calls** for behavior tests
- Consider **cheaper models for CI judge passes** only after validating them

**Pipelines specific to LLM systems:**

1. **Prompt/config deploys without code deploys:** load prompts from a registry or config with version tags, enabling rollout and rollback in seconds (and feature flags per prompt version).
2. **Index build pipeline:** ingestion, parsing, chunking, embedding and indexing as a **versioned, testable pipeline**. Run retrieval evals (recall@k) on the new index before **atomic swap** (blue/green index), with rollback to the previous index.
3. **Model-upgrade pipeline:** scheduled or triggered when a provider announces a new version or deprecation. It runs the full suites, produces a comparison report, and gates promotion.
4. **Fine-tuning pipeline:** data validation and PII scrub → train → eval against baseline and regression set → register the model → staged deploy.
5. **Scheduled drift checks:** run the suite periodically against production config to detect silent provider-side changes.

**Release strategies:**

- **Feature flags** for prompts, models and features, with per-segment targeting
- **Blue/green and canary** deploys, with automated rollback triggers (error rate, latency, guardrail trips, quality score drop)
- **Shadow mode** for risky changes
- **Gradual ramps** with monitoring at each stage
- **One-click rollback** for prompts, models, indexes and policies, which is essential, since "fix forward" is slower for behavioral bugs

**Environment management:**

- **Dev, staging and prod** with separate keys, quotas, indexes and data (never use production PII in dev)
- Staging mirrors production config (same model, same retrieval), with synthetic or scrubbed data
- **Secrets** in a secrets manager, rotated, with least-privilege keys per environment and service
- **Gateway** layer for model access (keys, budgets, logging, routing, fallbacks, Chapter 22)

**Governance and process:**

- **Code-review prompts and policies** like code (a second pair of eyes, with eval results attached)
- **Change log** and owner for each prompt, tool, and policy
- **Incident runbooks:** what to do when quality drops, a provider is down, a safety issue is reported, or costs spike (rollback steps, who to page)
- **Post-mortems** that end with a **new eval case** and a guardrail or process fix
- **Release notes** with metric deltas

**Common anti-patterns:** editing the prompt in production with no review or tests, floating model aliases, shipping a new index without retrieval evals, a CI suite so slow people skip it, no rollback path for prompts and indexes, testing only on the happy path, no cost checks (a prompt tweak that triples tokens), and treating a green CI as proof of production quality (you still need online monitoring).

**Example PR comment from CI:**

```
Prompt support_reply v12 vs v11  (model snapshot unchanged, dataset v7, n=240 × 3 runs)
  schema validity:        100% → 100%    ✅
  safety suite:           100% → 100%    ✅
  correctness (judge):     84% → 88%     ✅ (+4.0, CI +1.2..+6.8)
  faithfulness (judge):    93% → 92%     ⚠️ within tolerance
  "no refund promise":    100% → 96%     ❌ BLOCK (4 flipped cases attached)
  tokens/request:         2,950 → 3,420  ⚠️ +16% (budget: +10%)
  p95 latency (staging):   3.1s → 3.6s   ⚠️
```

**Use case:** the team's pipeline blocks a prompt change that improved correctness but broke the refund-promise safety case and raised tokens by 16%. The author fixes both, the PR passes, and the change rolls out as a 5% canary with automatic rollback conditions. The next week's scheduled drift run flags a 3-point faithfulness drop, which traces back to the provider's silent model update (the pinned snapshot had been retired and aliased), and the model-upgrade pipeline handles it.

## Interview Q&A

**1. How do you build a feedback loop for an LLM product?**
Capture explicit and implicit signals with full trace context, triage into review queues, do error analysis, fix the right layer (knowledge, retrieval, prompt, tools, model), add cases to golden and regression sets, use approved feedback as data (examples, preference pairs, SFT), roll out in stages, and measure.

**2. What are pitfalls of using thumbs up/down?**
Sparse and biased, UI-dependent, rewards fluency and flattery over correctness, and optimizing directly for it (Goodhart's law) degrades quality. Use as a signal for triage, not ground truth.

**3. How do you use user edits?**
The edit diff is a preferred output, useful for few-shot pools, preference pairs and SFT data, after PII scrubbing, review and consent.

**4. What should LLM observability cover beyond standard monitoring?**
Per-call traces with versions, tokens and cost, quality and safety metrics (online judges, guardrail rates, feedback), drift detection, cache and fallback rates, and privacy-aware logging.

**5. What do you log on every request?**
Trace and user/session IDs, prompt, model and index versions, inputs and outputs (with PII controls), retrieved context, tool calls and results, tokens, latency, cost, errors, guardrail decisions.

**6. How do you sample traces in production?**
Sample a percentage of normal traffic and keep 100% of errors, low-score, flagged and high-cost runs (tail-based sampling), within retention and privacy rules.

**7. What alerts would you set?**
Error and latency, cost anomalies, fallback and cache-hit changes, guardrail spikes, quality score drops, truncation, loop hits, and retrieval no-result rates.

**8. How do you operate guardrails in production?**
Cheap checks first, parallelize, tune thresholds for false positives and negatives by risk, define fail-open or closed per risk, keep policy in versioned config, test continuously, monitor triggers, and update as attackers adapt.

**9. How do you handle PII with LLMs?**
Minimize what's sent, detect with regex, NER and dedicated tools, redact or pseudonymize before the LLM and before logging, scan outputs, isolate tenants, control retention and access, vet vendors (zero retention, residency, DPAs), and support deletion across logs, indices and memory.

**10. Pseudonymization vs masking?**
Masking removes the value (safe, loses utility). Pseudonymization swaps in consistent placeholders with a secure mapping so the model can reason about entities and you can restore values in the response.

**11. How do you honor a deletion request in a RAG system?**
Track data lineage from source documents to chunks and vectors, delete from the vector index, caches, memory, logs, traces and feedback datasets, and verify it, subject to backup and retention rules.

**12. How does CI/CD for LLM apps differ from traditional CI/CD?**
It must test behavior probabilistically (golden and regression evals, safety suites, cost and latency checks), version prompts, models, indexes and policies as artifacts, gate on statistical comparisons to a baseline, and use shadow, canary and instant rollback, plus scheduled drift checks.

**13. How do you ship a new prompt safely?**
Review, offline evals and safety suite versus baseline, cost and latency checks, staging, a shadow or canary release with automatic rollback criteria, ramp with monitoring, and keep a one-click rollback.

**14. How do you roll out a new vector index?**
Build it in a pipeline, run retrieval evals (recall@k) and end-to-end evals, swap atomically (blue/green), monitor, and keep the previous index for rollback.

**15. (Follow-up) Quality silently dropped with no deploy. Why, and how do you catch it?**
Likely a provider model change or alias update, a data change in the index, or input drift. Pin model snapshots, run scheduled evals against production config, monitor online quality and drift, and alert on deltas.

## Cheat sheet

Feedback: capture with trace context, triage, error analysis, fix the right layer, add to regression sets. Observability: traces with versions, cost, tokens, quality, drift, privacy-aware retention. Guardrails: layered, tuned, tested, monitored. Privacy: minimize, detect, redact or pseudonymize before the LLM and logs, scope and expire, support deletion. CI/CD: version prompts, models, indexes and policies, gate on evals plus safety plus cost, canary, rollback, scheduled drift checks.

## Self-check

1. Users give few thumbs-downs but support tickets are rising. What other signals do you add?
2. A trace viewer exposes raw customer messages to all engineers. What changes do you make?
3. Name four artifacts besides code that must be versioned in an LLM app's pipeline.
4. A prompt change passes correctness but breaks one safety case. What does your pipeline do?
5. Where in your system can a deleted user's data still live?
