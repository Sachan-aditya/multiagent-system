# Part 10: Document AI

Document AI turns scans, PDFs, forms and photos into structured data or clean text. Quality here limits everything downstream: if parsing mangles a table, RAG will retrieve garbage and no prompt can fix it (Chapter 10).

## The classic pipeline

1. **Ingest and classify:** accept the file, detect its type, and decide whether it is born-digital (has a text layer) or scanned.
2. **Pre-process images:** deskew, denoise, fix contrast, binarize, correct resolution (around 300 DPI is a common target for OCR).
3. **Layout analysis:** find regions and label them: title, paragraph, table, figure, header, footer. This is usually a CNN or transformer detector (object detection applied to pages).
4. **OCR:** two stages. **Text detection** finds where text lines are (EAST and DB-style detectors), then **text recognition** reads each line (CRNN from Part 7, or a transformer recognizer).
5. **Reading order:** put the text blocks in the order a human would read them (hard with multiple columns and sidebars).
6. **Table structure recognition:** rows, columns, merged cells, header cells. Tables are where most pipelines break.
7. **Information extraction:** pull fields (invoice number, date, total) or key-value pairs, using rules, a layout-aware model, or an LLM with a schema.
8. **Validate and post-process:** check formats and totals, normalize dates and currency, flag low-confidence fields for review.
9. **Output and index:** emit JSON or Markdown with page numbers and bounding boxes, then chunk and index for RAG with that metadata.

## Born-digital vs scanned

| | Born-digital PDF | Scanned PDF or photo |
| --- | --- | --- |
| Text source | Embedded text layer, read directly | OCR needed |
| Main risk | Reading order, columns, tables, repeated headers and footers | OCR errors, skew, blur, handwriting |
| Cost | Cheap and fast | Slower and costlier |
| Tip | Always try the text layer first, and OCR only pages with no text | Check the confidence and sample the output |

## Four approaches

| Approach | How it works | Pros | Cons |
| --- | --- | --- | --- |
| OCR + rules or templates | OCR, then regex and positions | Cheap, predictable for fixed forms | Breaks when the layout changes |
| OCR + layout-aware model | Models that take text, bounding boxes and the image together (LayoutLM-style) | Strong on forms and varied layouts, trainable on your documents | Needs labeled data |
| OCR-free end-to-end models | A model reads the page image and writes text or JSON directly (Donut-style) | Fewer stages, fewer error handoffs | Needs training data, can hallucinate |
| Vision-language model (VLM) | Send the page image and a schema to a multimodal LLM | Fast to build, handles messy layouts and charts | Cost per page, hallucinated numbers, harder to audit (Chapter 5) |

In practice, teams combine them: classical OCR or the text layer for plain text, a layout model for structure, a VLM for hard pages, and code to validate.

## Tools you will meet

Tesseract and PaddleOCR (open-source OCR), EasyOCR, cloud services (AWS Textract, Azure Document Intelligence, Google Document AI), open-source parsers (Docling, Unstructured, PyMuPDF, pdfplumber), and multimodal LLM APIs. Capabilities change quickly, so test them on your own documents before choosing.

```python
import pdfplumber
with pdfplumber.open("invoice.pdf") as pdf:
    page = pdf.pages[0]
    text = page.extract_text() or ""          # empty for scanned pages: that is your signal to OCR
    tables = page.extract_tables()            # list of tables, each a list of rows
    print(len(text), len(tables))
```

## Evaluation

| What | Metric |
| --- | --- |
| Text recognition | CER and WER (Part 7) |
| Layout detection | Precision and recall of regions (IoU threshold) |
| Table structure | Table-structure metrics such as TEDS, plus cell-level accuracy |
| Field extraction | Per-field exact match and F1, with normalization (dates, amounts) |
| End-to-end | Task success, human review rate, cost per page, latency |

Build a golden set of real pages, including the ugly ones (skewed, low resolution, stamps, handwriting, multi-page tables), and error-analyze them the way Chapter 18 describes. Report numbers per document type, since an average hides the weak ones.

## Common failure modes

- Repeated headers and footers pasted into the middle of paragraphs
- Columns read straight across, mixing two columns into nonsense
- Tables flattened into one line of text, so the row and column meaning is lost
- Digits misread (0 and O, 1 and l, 5 and S), which is dangerous for amounts and IDs
- Multi-page tables treated as separate tables
- Checkboxes, stamps, signatures and handwriting ignored or misread
- A VLM that "completes" a blurry number with a plausible one

## Practical rules

1. Keep **bounding boxes and page numbers** for every extracted value, so you can show the source and cite it (Chapter 13).
2. **Validate in code:** line items should sum to the total, dates should parse, and IDs should match their format.
3. Send low-confidence fields to human review and measure that rate.
4. Treat document text as **untrusted input**: a PDF can contain hidden instructions aimed at your LLM (Chapter 9).
5. For RAG, keep tables whole, convert them to Markdown or HTML, and attach the page and section as metadata (Chapter 10).
6. Redact PII before logging or sending pages to third parties (Chapter 25).

## Break it

| # | Change | What happens and why |
| --- | --- | --- |
| 1 | Run text extraction on a two-column PDF | Lines from both columns interleave. Reading order is a real problem |
| 2 | Run `extract_text()` on a scanned PDF | Empty string. Detect this and route the page to OCR |
| 3 | OCR the same page at 72 DPI and at 300 DPI | Error rate drops sharply at higher resolution |
| 4 | Rotate a scan by 5 degrees and OCR it | Accuracy drops. Deskewing matters |
| 5 | Send a table image to a VLM and ask for JSON, then check the totals | Totals sometimes do not add up. This is why you validate in code |
| 6 | Feed a multi-page table to a parser page by page | The table splits and the header row is missing on later pages |

<script type="text/markdown" id="md-foundations-11">
# Part 11: Interview Q&A and cheat sheet

Cover the answer, say it out loud, then compare. Each answer is the short version an interviewer wants to hear first.

## Training basics (Parts 1 and 2)

**1. Walk me through one training step.**
Forward pass to get predictions, compute the loss, backward pass to get gradients with the chain rule, optimizer step to update the weights, then reset the gradients.

**2. What does `loss.backward()` do?**
It walks the recorded computation graph in reverse, applying the chain rule, and stores the gradient of the loss with respect to each parameter in `.grad`.

**3. What happens if you forget `zero_grad()`?**
Gradients accumulate across steps, so updates are wrong and training becomes unstable.

**4. How do you choose a learning rate, and what do too-high and too-low look like?**
Start from a known default (for example 1e-3 for Adam) and tune on validation loss. Too high: loss oscillates or becomes `nan`. Too low: loss falls very slowly.

**5. Batch, epoch and iteration?**
A batch is the examples per update, an epoch is one pass over the training set, an iteration is one batch update.

**6. How do you detect and fix overfitting?**
Training loss falls while validation loss rises. Fix with more data or augmentation, weight decay, dropout, early stopping, or a smaller model.

**7. Why use a validation set and a separate test set?**
Validation guides choices like learning rate and model size. If you tune on the test set it stops being an honest estimate, so touch it once at the end.

**8. SGD vs Adam?**
SGD (with momentum) is simple and can generalize well but needs careful tuning. Adam adapts step sizes per parameter and works well by default, and AdamW is standard for transformers.

**9. BatchNorm vs LayerNorm?**
BatchNorm normalizes across the batch and suits CNNs with decent batch sizes. LayerNorm normalizes across features per example, so it does not depend on batch size, which is why transformers use it.

**10. Why is accuracy a bad metric on imbalanced data?**
A model that always predicts the majority class scores high. Use precision, recall, F1, the confusion matrix or ROC-AUC, chosen by the cost of each error type.

**11. A model that applies softmax and then uses `CrossEntropyLoss` trains poorly. Why?**
`CrossEntropyLoss` already applies log-softmax internally, so softmax happens twice and squashes the gradients.

## ANN and CNN (Parts 3 and 4)

**12. Why do we need non-linear activations?**
Without them, stacked linear layers collapse into one linear layer, so the network cannot learn non-linear functions such as XOR.

**13. Why did ReLU replace sigmoid in hidden layers?**
Sigmoid saturates, so gradients vanish in deep networks. ReLU does not saturate for positive inputs and is cheap. GELU and SiLU are smooth variants used in transformers.

**14. Why initialize weights randomly and not with zeros?**
With identical weights, every neuron in a layer gets the same gradient and stays identical, so the layer behaves like one neuron.

**15. Why is an MLP a poor fit for images?**
It ignores spatial structure and needs enormous numbers of parameters (millions for one layer on a 224x224 image).

**16. What are weight sharing and local connectivity in a CNN?**
The same small filter is reused at every position and each output looks at a small patch. That gives few parameters and translation equivariance.

**17. Compute the output size of a conv layer.**
`floor((W - K + 2P) / S) + 1`. For W=28, K=3, P=1, S=1 the output is 28.

**18. What does pooling do?**
It shrinks feature maps and gives some tolerance to small shifts. Max pooling keeps the strongest response in each window.

**19. What is a receptive field?**
The input region that affects one output unit. It grows with depth, pooling and stride.

**20. Why do ResNets use skip connections?**
Output = `x + F(x)` gives gradients a direct path, so very deep networks train. Transformers use the same idea.

## RNN, LSTM, GRU, CRNN (Parts 5 to 7)

**21. How does an RNN work?**
It applies the same cell at each step, `h_t = tanh(W_x x_t + W_h h_{t-1} + b)`, carrying a hidden state as memory.

**22. Why do plain RNNs fail on long sequences?**
Backpropagation through time multiplies many Jacobians. If their size is below 1, gradients vanish and early steps stop learning, and if it is above 1 they explode.

**23. How do you handle exploding gradients?**
Gradient clipping, by norm. It does not fix vanishing gradients.

**24. Explain the LSTM gates.**
The forget gate decides what to erase from the cell state, the input gate decides what new information to write, and the output gate decides what to expose as the hidden state.

**25. Why does an LSTM mitigate vanishing gradients?**
The cell state updates additively, `c_t = f * c_{t-1} + i * c~_t`. When the forget gate is near 1, gradients pass through it almost unchanged, like a skip connection.

**26. LSTM vs GRU?**
A GRU has two gates and no separate cell state, so it has fewer parameters and trains faster. Accuracy is often similar, so try both.

**27. When would you use a bidirectional RNN, and when not?**
When the whole input is available (tagging, OCR, speech recognition). Never for generation, because the backward direction sees future tokens.

**28. Why did transformers replace RNNs?**
RNNs are sequential, so they cannot parallelize across time, and they struggle with long-range dependencies. Self-attention connects any two tokens in one step and trains in parallel, at the cost of quadratic compute in sequence length.

**29. Explain CRNN and CTC.**
A CNN extracts a sequence of feature columns from a text-line image, a BiLSTM adds context, and a linear layer outputs per-step character probabilities plus a blank. CTC trains without alignment labels by summing over all paths that collapse to the target (merge repeats, remove blanks).

**30. Why does CTC need a blank symbol?**
It separates repeated characters (so "ll" is possible) and lets the model output "nothing" for steps that fall between characters.

**31. What is the seq2seq bottleneck, and how does attention fix it?**
The encoder squeezes the whole input into one vector. Attention lets the decoder look at all encoder states and weight them at each output step.

## Classic NLP and document AI (Parts 9 and 10)

**32. TF-IDF vs embeddings?**
TF-IDF matches exact words weighted by rarity, so it is strong for keywords and fails on synonyms. Embeddings capture meaning, so "money back" can match "refund", but they can miss exact IDs. Hybrid search uses both (Chapter 12).

**33. Static vs contextual embeddings?**
Static (word2vec) gives one vector per word. Contextual (BERT, transformers) gives a different vector per occurrence, so "bank" differs by sentence.

**34. BERT vs GPT?**
BERT is an encoder with bidirectional attention trained with masked language modeling, good for classification and embeddings. GPT is a causal decoder trained on next-token prediction, good for generation.

**35. How would you build a document-extraction pipeline?**
Use the text layer when present and OCR otherwise, run layout analysis, handle tables separately, extract fields with a layout-aware model or an LLM with a schema, validate in code (totals, formats), keep bounding boxes and pages, send low-confidence fields to review, and evaluate per document type.

**36. When would you use a VLM instead of classic OCR?**
For messy or varied layouts, charts and fast prototyping. Use classic OCR with validation when you need cheap, auditable, high-volume extraction. Always validate numbers in code, because VLMs can hallucinate them.

**37. How do you measure OCR and extraction quality?**
CER and WER for recognition, region precision and recall for layout, TEDS for tables, and per-field exact match or F1 after normalization, reported per document type.

## Cheat sheet

| Topic | One-line version |
| --- | --- |
| Training loop | Forward, loss, backward, step, zero_grad |
| Learning rate | Most important hyperparameter, too high diverges, too low crawls |
| Overfitting | Train loss down, validation loss up: regularize, augment, stop early |
| Activation | Non-linearity is what makes depth useful |
| CNN | Shared local filters: few parameters, translation equivariance |
| Conv output size | `floor((W - K + 2P) / S) + 1` |
| RNN | Same cell every step, hidden state as memory, vanishing gradients |
| LSTM | Gated additive cell state keeps gradients alive |
| GRU | Two gates, lighter, often equal |
| CRNN + CTC | CNN features, BiLSTM context, blank and collapse, no alignment labels |
| Attention | Look back at everything with learned weights |
| Transformer | Attention only: parallel training, quadratic cost |
| TF-IDF vs embeddings | Keywords vs meaning, combine them |
| Document AI | Layout, OCR, tables, extraction, validation in code |
</script>

<script type="text/markdown" id="md-ch-1">
# Chapter 1: Neural Networks, Transformers and Self-Attention

This chapter covers topics 1 to 3 of the LLM module. It has six parts, then interview Q&A, then a short self-check.

## Part 1: Neural network basics

**What it is.** A neural network is a function with millions or billions of adjustable numbers (**parameters**, or weights). You give it input, it gives an output, and training adjusts the weights so the output gets closer to the right answer.

**One neuron:** `output = activation(w1·x1 + w2·x2 + ... + b)`

- The **weights** decide how much each input matters.
- The **activation** (ReLU, GELU) adds non-linearity. Without it, stacking layers would collapse into one linear function and couldn't learn complex patterns.

**A layer** is many neurons side by side. A **deep network** stacks many layers. Early layers learn simple patterns and later layers learn abstract ones.

**How training works (the loop):**

1. **Forward pass:** input goes through the layers and produces a prediction.
2. **Loss:** a number measuring how wrong the prediction is. For LLMs this is cross-entropy on the next token.
3. **Backpropagation:** computes how much each weight contributed to the error (the gradient).
4. **Gradient descent:** nudges each weight slightly in the direction that reduces the loss.
5. Repeat billions of times.

**Use case:** spam classification, image recognition, and (with a transformer architecture) language models.

## Part 2: Why transformers replaced RNNs

Before 2017, text models were **RNNs/LSTMs**. They read one word at a time and carry a hidden state forward.

| Problem with RNNs | Effect |
| --- | --- |
| Sequential: step 5 waits for step 4 | Can't parallelize on GPUs, so training is slow |
| One hidden state carries everything | Early words get forgotten in long text |
| Long paths between distant words | Gradients vanish, so long-range dependencies are hard to learn |

The 2017 paper *"Attention Is All You Need"* removed recurrence. Every token looks directly at every other token in **one parallel step**. That made training on huge data practical, and it's the reason LLMs exist.

## Part 3: Self-attention, step by step

**Intuition:** the meaning of a word depends on its context. In *"The animal didn't cross the street because **it** was tired"*, attention lets "it" look back and put high weight on "animal".

**Step 1: Make Q, K, V.** Each token's embedding `x` is multiplied by three learned matrices:

- `Q = x·Wq` (query: what am I looking for?)
- `K = x·Wk` (key: what do I offer?)
- `V = x·Wv` (value: what info do I pass along?)

Think of a library search. The query is your search phrase, the keys are book titles, and the values are the book contents.

**Step 2: Score.** Dot product of the token's Q with every K gives a similarity score. Higher means more relevant.

**Step 3: Scale.** Divide by √d_k, where d_k is the key dimension.

**Step 4: Softmax.** Turns scores into weights that sum to 1.

**Step 5: Weighted sum.** Multiply the weights by the V vectors and add them up. This is the token's new, context-aware representation.

**The full formula:**

```latex
\text{Attention}(Q, K, V) = \text{softmax}\left(\frac{Q K^{T}}{\sqrt{d_k}}\right) V
```

**Why divide by √d_k?** If Q and K have d_k dimensions with roughly unit variance, their dot product has variance about d_k, so scores get large as dimensions grow. Large scores push softmax into saturation, where one weight is near 1 and the rest near 0, and the gradients become tiny. Dividing by √d_k keeps the variance near 1 and training stable.

**Tiny numeric feel.** Say "bank" scores [river: 4, money: 1, the: 0]. Softmax gives roughly [0.94, 0.05, 0.01], so the new "bank" vector is about 94% river's value vector.

## Part 4: Multi-head attention and positional encoding

**Multi-head attention.** Instead of one attention, run *h* of them in parallel (for example 8 or 32 heads), each with its own Wq, Wk, Wv on a smaller dimension (d_model / h). Then concatenate the results and pass them through an output matrix.

- Different heads learn different relationships (syntax, coreference, nearby words, long-range links).
- Total compute stays about the same as one big head.

**Positional encoding.** Attention treats the input as a *set*, so "dog bites man" and "man bites dog" would look identical. We inject order information:

- **Sinusoidal** (original paper): fixed sine/cosine patterns added to embeddings.
- **Learned** positions (GPT-2, BERT).
- **RoPE** (rotary, used by Llama and most modern LLMs): rotates Q and K by position-dependent angles, so attention naturally depends on relative distance and extends to longer contexts better.

## Part 5: The transformer block and architecture

One **block** repeats this pattern, and models stack dozens of blocks (GPT-3 has 96):

```
x → LayerNorm → Multi-Head Attention → + x   (residual)
  → LayerNorm → Feed-Forward Network  → + x   (residual)
```

- **Feed-forward network (FFN):** two linear layers with an activation, applied to each token independently. Attention *mixes information between tokens*, and the FFN *processes each token* (much of the model's stored knowledge lives here).
- **Residual connections** (`+ x`): let gradients flow through deep stacks and let each layer make small refinements.
- **LayerNorm:** stabilizes activation scales. Modern models normally apply it *before* each sublayer (pre-norm).

**Three architecture families:**

| Type | Attention | Examples | Best for |
| --- | --- | --- | --- |
| Encoder-only | Bidirectional (sees whole input) | BERT | Classification, embeddings, search |
| Decoder-only | **Causal** (sees only the past) | GPT, Llama, Claude | Text generation, chat |
| Encoder-decoder | Both | T5, original Transformer | Translation, summarization |

**Causal mask.** In a decoder, a token must not see future tokens, or it could cheat during training by reading the answer. Before softmax, future positions are set to −∞, so their weight becomes 0.

**How generation works.** The model predicts a probability over the vocabulary for the *next token*, picks one, appends it, and repeats. Every new token needs the K and V of all earlier tokens. That is exactly what the **KV cache** stores, and you'll see it again in LLMOps.

## Part 6: Cost, and the code

**Complexity.** Every token attends to every token, so for sequence length *n* the attention matrix is n × n:

- Compute is O(n² · d) and attention memory is O(n²).
- Doubling the context means about 4x the attention cost, which is why long contexts are expensive.
- Fixes: **FlashAttention** (same math, far less memory traffic by tiling on the GPU), sparse/sliding-window attention, and GQA/MQA (sharing K/V across heads to shrink the KV cache).

**Minimal self-attention in NumPy:**

```python
import numpy as np

def softmax(x):
    e = np.exp(x - x.max(axis=-1, keepdims=True))
    return e / e.sum(axis=-1, keepdims=True)

def self_attention(x, Wq, Wk, Wv, causal=True):
    Q, K, V = x @ Wq, x @ Wk, x @ Wv          # (n, d_k)
    scores = Q @ K.T / np.sqrt(K.shape[-1])    # (n, n)
    if causal:
        mask = np.triu(np.ones_like(scores), k=1)   # future positions
        scores = np.where(mask == 1, -1e9, scores)
    weights = softmax(scores)                  # rows sum to 1
    return weights @ V                         # (n, d_k)

n, d = 4, 8
x = np.random.randn(n, d)
Wq, Wk, Wv = (np.random.randn(d, d) for _ in range(3))
print(self_attention(x, Wq, Wk, Wv).shape)    # (4, 8)
```

## Interview Q&A

**1. Why did transformers replace RNNs?**
They process all tokens in parallel (fast training on GPUs), and every token has a direct path to every other token, which handles long-range dependencies much better. RNNs are sequential and compress history into one hidden state.

**2. What are Q, K and V, and why divide by √d_k?**
Q is what a token is looking for, K is what a token offers for matching, and V is the information it contributes. Q·K gives relevance, and softmax turns it into weights over the V vectors. Dividing by √d_k keeps dot-product variance near 1. Otherwise softmax saturates and gradients vanish.

**3. Why is attention O(n²), and why does it matter?**
Every token is scored against every other token, which gives an n × n matrix. Long contexts therefore cost quadratically more compute and memory. It's mitigated with FlashAttention, windowed attention and KV-cache optimizations.

**4. What does the causal mask do?**
It blocks each token from attending to later tokens, so training matches generation, where the future doesn't exist yet. It's implemented by adding −∞ to future positions before softmax.

**5. Why multi-head instead of single-head?**
Multiple heads let the model attend to different relationship types in different subspaces at once, at about the same total compute.

**6. Why do we need positional encoding?**
Self-attention is permutation-invariant. Without position information the model can't tell word order apart. Modern models use RoPE for relative position.

**7. Attention vs FFN: what does each do?**
Attention moves information *between* tokens. The FFN transforms each token's representation *independently* and holds much of the learned knowledge.

**8. Encoder-only vs decoder-only, and when would you pick each?**
Encoder-only (BERT) sees the full context both ways, so it suits understanding tasks like classification and embeddings. Decoder-only (GPT) is autoregressive, so it suits generation, and it has become the default for LLMs.

**9. Why residual connections and LayerNorm?**
Residuals let gradients flow through very deep stacks and ease optimization. LayerNorm keeps activations stable so training converges.

**10. (Follow-up) How does a KV cache relate to attention?**
During generation, K and V of past tokens never change, so caching them avoids recomputation. Each step computes Q, K, V only for the new token. The price is memory that grows with length and batch size.

## Cheat sheet

- Attention = `softmax(QKᵀ/√d_k)·V`
- Transformer block = attention + FFN, each with a residual and a norm
- Decoder-only plus a causal mask = GPT-style LLMs
- Cost is O(n²), which drives most long-context and serving optimizations

## Self-check

Try answering these without scrolling up:

1. What happens to attention weights if you remove the √d_k scaling?
2. Why can BERT see future tokens but GPT can't?
3. If context length goes from 4k to 32k, roughly how much does the attention matrix grow?
4. Where in a transformer block does information flow *between* tokens?
</script>

# Chapter 2: Tokens, Embeddings and Context Windows

This chapter covers topics 4 to 6 of the LLM module. It has parts, interview Q&A, a cheat sheet and a self-check.

## Part 1: Tokens and tokenization

**The problem.** Neural networks work on numbers, not text. We need a way to turn text into a sequence of integers and back.

**Three options, and why one won:**

| Approach | Example | Problem |
| --- | --- | --- |
| Character-level | `h, e, l, l, o` | Sequences get very long, so attention cost explodes |
| Word-level | `hello` | Huge vocabulary, and unknown words (typos, names, new slang) break it |
| **Subword** | `un`, `believ`, `able` | Balanced. Common words are 1 token, rare words split into pieces |

Every modern LLM uses **subword tokenization**. A token is a chunk of text, often a word, part of a word, or punctuation. Rough rule for English: **1 token ≈ 4 characters ≈ ¾ of a word**.

**How it works (BPE, Byte-Pair Encoding):**

1. Start with individual bytes or characters as the vocabulary.
2. Count the most frequent adjacent pair in the training corpus and merge it into a new token.
3. Repeat until the vocabulary reaches a target size (typically 32k to 200k).

Common variants: **BPE** (GPT, Llama), **WordPiece** (BERT), **SentencePiece/Unigram** (T5, Llama 1/2). Byte-level BPE can represent any text, so there's no "unknown token".

**Pipeline:** `text → tokenizer → token IDs → embedding layer → transformer → logits over vocabulary → next token ID → tokenizer decode → text`

**Why tokenization matters in practice:**

- **Cost and limits are in tokens**, not words. APIs bill per token and context limits are counted in tokens.
- **Non-English text and code often use more tokens** per word, so the same content costs more and fits less.
- **Odd model failures trace back to tokens.** Counting letters in a word ("how many r's in strawberry"), reversing strings, and exact arithmetic are hard because the model sees chunks, not characters.
- **Whitespace and formatting matter.** `" hello"` and `"hello"` can be different tokens.
- **Numbers split unpredictably** (for example `12345` might become `123` + `45`), which hurts arithmetic.
- **Different models use different tokenizers**, so token counts aren't comparable across providers.

```python
import tiktoken
enc = tiktoken.get_encoding("cl100k_base")
ids = enc.encode("Tokenization is fun!")
print(ids, len(ids))                  # list of ints, token count
print([enc.decode([i]) for i in ids]) # see the actual chunks
```

## Part 2: Embeddings

**The problem.** A token ID like `4821` is just an arbitrary label. The number 4821 has no meaning, and 4821 isn't "close" to 4822 in any useful way.

**The solution.** An **embedding** maps each token ID to a dense vector (for example 768, 4096 or 12288 floats). It's a lookup table: row *i* of a matrix is the vector for token *i*. The matrix is learned during training.

**The key property:** tokens used in similar contexts end up with **nearby vectors**. Meaning becomes geometry.

- `king` is near `queen`, `cat` is near `dog`.
- Directions can encode relations: the classic `king − man + woman ≈ queen`.

**Measuring closeness:**

- **Cosine similarity** = the angle between vectors (ignores magnitude). It's the standard for text.
- **Dot product** is similar, and equal to cosine when vectors are normalized.
- **Euclidean distance** is less common for text.

**Two kinds of embeddings, which people often mix up:**

| | Input token embeddings | Sentence/document embedding models |
| --- | --- | --- |
| What | The first layer of an LLM | Separate models (for example `text-embedding-3`, BGE, E5) |
| Context-aware? | No, one fixed vector per token at input | Yes, one vector for a whole sentence or passage |
| Output | Fed to the transformer | Used for search, clustering, RAG |
| Trained for | Next-token prediction | Making similar texts close (contrastive learning) |

Inside the transformer, each layer *updates* the token vectors with context (this is what attention does). By the last layer, the vector for "bank" differs depending on whether the sentence was about rivers or money. These are **contextual embeddings**.

**How it connects to Chapter 1:** the embedding vectors are the `x` that gets multiplied by Wq, Wk, Wv. Positional information is added to them before the first block. At the output, the final vector is projected back to vocabulary size to produce next-token probabilities. Many models **tie weights** between the input embedding matrix and this output projection to save parameters.

**Use cases.** Semantic search ("find docs about refunds" even when they say "money back"), recommendations, deduplication, clustering, classification, and the retrieval step in **RAG** (Module 3, where cosine similarity, vector DBs and HNSW build directly on this).

```python
import numpy as np

def cosine(a, b):
    return a @ b / (np.linalg.norm(a) * np.linalg.norm(b))

# with a real embedding model: cosine(embed("refund policy"), embed("money back")) is high
```

## Part 3: Context windows

**Definition.** The **context window** is the maximum number of tokens the model can handle in one request: **input and output combined**. Everything the model "knows" about your conversation lives here (system prompt, chat history, retrieved documents, tool results, and the answer it's generating).

**Key facts:**

- The model is **stateless**. It has no memory between calls. "Memory" in a chat app means the app resends the history each time.
- When history exceeds the window, something has to go: truncate the oldest messages, summarize them, or retrieve only what's relevant.
- Window sizes range from about 8k tokens (older models) to hundreds of thousands, and some models offer 1M or more.

**Why not just make it infinite? The costs:**

- **Attention is O(n²)** (Chapter 1), so compute grows fast.
- **KV cache memory grows linearly** with length, per user, so serving long contexts is expensive.
- **Latency:** longer prompts mean slower time-to-first-token.
- **Price:** you pay for every input token on every request.

**Quality problems with long contexts:**

- **"Lost in the middle":** models use information at the start and end of a prompt better than information buried in the middle.
- **Context rot:** accuracy tends to degrade as the prompt fills with irrelevant material, even below the stated limit.
- **Advertised window ≠ effective window.** A model may accept 1M tokens but reason reliably over far less. Test on your own task.

**Why models can handle longer context.** Position encoding like **RoPE** can be scaled (for example with YaRN or position interpolation) and models are further trained on long sequences. Efficiency techniques (FlashAttention, GQA, sliding-window attention) make it affordable.

**Design rules of thumb:**

1. Put only relevant material in context. More isn't better.
2. Put critical instructions and the question where they won't get lost (often both near the start and at the end).
3. For large knowledge bases, use **RAG** and don't stuff everything in.
4. Budget tokens: `system + history + retrieved + expected output ≤ window`. Reserve space for the output, because a long answer can be cut off if the prompt used the whole window.
5. For long conversations, summarize older turns and keep recent ones verbatim.

**Use case example.** A support bot with a 10-page policy doc: stuffing it into every request costs tokens each time and risks "lost in the middle". Chunking the doc and retrieving the 3 most relevant chunks (RAG) is cheaper and often more accurate.

## Interview Q&A

**1. What is a token, and why subword tokenization?**
A token is a unit of text (word, word piece, or punctuation) mapped to an integer ID. Subword splitting balances vocabulary size and sequence length: characters make sequences too long, whole words can't handle rare or unseen words. BPE builds the vocabulary by repeatedly merging frequent byte pairs.

**2. Why do LLMs struggle to count the letters in a word or do exact arithmetic?**
They see tokens, not characters, so a word may be one or two opaque chunks, and numbers split inconsistently. The model has to infer character-level structure indirectly. Tool use (a code interpreter) is the reliable fix.

**3. How does tokenization affect cost and multilingual use?**
Pricing and limits are per token. Languages and content types that tokenize poorly (many non-English languages, code, unusual formatting) use more tokens for the same meaning, so they cost more and consume more of the window.

**4. What is an embedding, and why is it useful?**
A dense learned vector representing a token or text, where semantic similarity becomes geometric closeness. It lets us do search and comparison by meaning instead of keywords.

**5. Why cosine similarity and not Euclidean distance?**
Cosine compares direction (meaning) and ignores vector length, which can vary for reasons unrelated to meaning. With normalized vectors, cosine and dot product are equivalent, so it's also cheap to compute.

**6. Input token embeddings vs sentence embedding models?**
Input embeddings are the first layer of an LLM, one fixed vector per token, trained for next-token prediction. Sentence embedding models are separate, usually encoder-based, trained contrastively to output one context-aware vector per text for retrieval and clustering.

**7. What is a context window, and what counts against it?**
The maximum tokens per request, covering input plus output. System prompt, history, retrieved documents, tool outputs and the generated answer all count.

**8. The model is stateless. How does a chatbot "remember"?**
The application resends the conversation history (or a summary, or retrieved memories) with every request. Anything not in the context doesn't exist for the model.

**9. Why not just use the largest context window for everything?**
Cost (you pay per token, every call), latency, quadratic attention compute, KV cache memory, and quality loss (lost in the middle, context rot). Retrieval plus a focused prompt is usually cheaper and more accurate.

**10. What does "lost in the middle" mean and how do you mitigate it?**
Models recall information at the beginning and end of long prompts better than in the middle. Mitigate by retrieving fewer, better chunks, reranking so the best come first or last, repeating key instructions at the end, and compacting the context.

**11. (Follow-up) How would you estimate the cost of an LLM feature?**
`tokens_in × price_in + tokens_out × price_out`, multiplied by request volume. Count the system prompt, history and retrieved chunks in tokens_in, which is usually the dominant term. Prompt caching and shorter context cut it down.

## Cheat sheet

- Text → tokens (subwords, BPE) → IDs → embedding vectors → transformer → next-token probabilities
- ~1 token ≈ ¾ word, and everything is billed and limited in tokens
- Embedding = meaning as a vector, compared with cosine similarity
- Context window = input + output tokens, stateless, bigger isn't automatically better
- Long context costs: O(n²) compute, KV cache memory, latency, price, and quality degradation

## Self-check

1. Why can't a character-level tokenizer scale to long documents?
2. Why does the same sentence in Hindi often cost more tokens than in English?
3. You have a 128k window, a 6k system prompt, and want up to 2k tokens of output. How many tokens can history plus retrieved docs use at most?
4. When would you pick a sentence embedding model over an LLM's input embeddings?
5. A chatbot "forgets" what the user said 40 turns ago. Name two ways to fix it.

# Chapter 3: Pretraining, SFT and RLHF/Preference Tuning

This chapter covers topics 7 to 9 of the LLM module. It explains how a pile of random weights becomes a helpful assistant. LoRA/PEFT and quantization (topics 10 and 11) get their own chapter next, because they build on this one.

**The big picture first:**

```
Random weights
   │  Stage 1: Pretraining  (trillions of tokens, predict next token)
   ▼
Base model         → knows language and facts, but just continues text
   │  Stage 2: SFT  (thousands to millions of instruction → answer examples)
   ▼
Instruction model  → follows instructions, answers in a helpful format
   │  Stage 3: RLHF / preference tuning  (human or AI preferences)
   ▼
Aligned assistant  → helpful, harmless, matches human taste
```

## Part 1: Pretraining

**Objective.** Predict the next token. Given "The capital of France is", the model should give high probability to " Paris". The loss is **cross-entropy** between the predicted distribution and the actual next token. It's self-supervised: the labels come from the text itself, so no human labeling is needed. That is why it scales to the whole internet.

**What it learns, as a side effect of predicting the next token well:** grammar, facts, reasoning patterns, code syntax, multiple languages. To predict well, the model has to build internal representations of the world.

**Data:**

- Web crawls, books, code, papers, Wikipedia, and curated or synthetic data
- Scale: trillions of tokens
- **Data quality matters enormously.** Pipelines do deduplication, quality filtering, toxicity and PII filtering, and language balancing. A smaller model on better data often beats a bigger model on messy data.

**Compute and scale:**

- Thousands of GPUs running for weeks or months, costing millions of dollars
- **Scaling laws:** loss falls predictably as you increase parameters, data and compute
- **Chinchilla finding:** for a fixed compute budget, many models were undertrained, and parameters and data should scale together (roughly 20 tokens per parameter). In practice, labs now often **overtrain smaller models** (far more tokens than Chinchilla-optimal) because a small model is cheaper to serve forever.

**Output: the base model.** It is a powerful autocomplete engine. Ask it "What is the capital of France?" and it may continue with "What is the capital of Germany?..." (a quiz-style list), because that's what such text looks like online. It doesn't know it should answer you.

**Use case:** you rarely pretrain yourself (it's far too expensive). You choose a base or instruct model and adapt it. Teams pretrain only with huge budgets or very specialized data needs.

## Part 2: Supervised Fine-Tuning (SFT)

**Goal.** Teach the base model the *format of being an assistant*: given an instruction, produce a good response.

**Data.** Pairs of `(prompt, ideal response)`, often wrapped in a chat template:

```
<system> You are a helpful assistant.
<user> Summarize this email in 2 lines: ...
<assistant> The sender asks for... [ideal answer]
```

Sources: human-written demonstrations, curated datasets, and increasingly synthetic data generated by stronger models.

**Training.** The same next-token loss as pretraining, but:

- Far less data (thousands to millions of examples versus trillions of tokens)
- Loss is usually computed **only on the response tokens**, not the prompt (loss masking)
- Smaller learning rate, 1 to 3 epochs

**Key insight (the "LIMA" idea):** SFT mostly teaches *style and format*, not new knowledge. Knowledge comes from pretraining. Quality beats quantity: a small set of excellent examples can do a lot.

**Limits of SFT:**

- It only imitates the demonstrations. It can't tell the model that one good answer is *better* than another good answer.
- Writing ideal answers is expensive, and for many tasks it's easier to *judge* answers than to *write* them. That motivates the next stage.
- Over-training on narrow data can cause **catastrophic forgetting** (losing general abilities) and encourage hallucination if the model is taught facts it never learned.

**Use case:** teaching a model a company's tone, a strict output format, or a domain task (for example SQL generation in your schema style). In practice, you'd try prompting and RAG first, and fine-tune only when those fall short.

## Part 3: RLHF and preference tuning

**The problem SFT can't solve.** "Good" is often a matter of degree and taste: helpfulness, honesty, safety, tone. It's easier for humans to say "answer A is better than answer B" than to write the perfect answer. Preference tuning uses those comparisons.

### Classic RLHF (Reinforcement Learning from Human Feedback)

**Step 1: Collect preferences.** For a prompt, sample several responses from the SFT model. Humans rank them or pick the best, producing `(prompt, chosen, rejected)` data.

**Step 2: Train a reward model (RM).** A model (often initialized from the SFT model) that takes a prompt and response and outputs a scalar score. It's trained so `score(chosen) > score(rejected)`. It's a learned stand-in for human judgment.

**Step 3: Optimize the policy with RL.** The LLM generates a response, the reward model scores it, and an RL algorithm (usually **PPO**) updates the LLM to get higher scores. A critical addition is a **KL penalty**:

```latex
\text{objective} = \text{reward}(\text{response}) - \beta \cdot \mathrm{KL}(\text{policy} \,\|\, \text{reference SFT model})
```

The KL term keeps the model from drifting too far from the SFT model. Without it, the model learns to **reward hack**: exploiting weaknesses in the reward model (for example very long, flattering or weirdly formatted answers) rather than becoming genuinely better.

**Why it's hard:** it needs four models in memory (policy, reference, reward model, value model for PPO), RL training is unstable, and it's expensive.

### Simpler alternatives

| Method | Idea | Pros / cons |
| --- | --- | --- |
| **DPO** (Direct Preference Optimization) | Skip the reward model and RL. Directly train on `(chosen, rejected)` pairs with a loss that raises the likelihood of chosen relative to rejected, anchored to a reference model | Simple, stable, cheap, and widely used. Offline (fixed data), so may be less effective than online RL for pushing limits |
| **RLAIF / Constitutional AI** | An AI model, guided by written principles, produces the preference labels instead of humans | Scales cheaply, and the principles make values explicit. Quality depends on the judge model |
| **RLVR** (RL with Verifiable Rewards) / **GRPO** | Reward comes from an automatic check (a math answer is right, code passes tests). GRPO drops the value model by comparing a group of sampled answers | Key technique behind **reasoning models** (topic 14). Only works where correctness is checkable |

**What preference tuning achieves:**

- Helpfulness and a conversational, well-structured style
- Refusing harmful requests, and being honest about uncertainty
- Better overall "feel", which is why chat models feel so different from base models

**Known side effects (the "alignment tax" and quirks):**

- **Sycophancy:** agreeing with the user to win approval
- **Verbosity bias:** longer answers often win preference votes
- **Reduced output diversity** and sometimes slightly worse calibration
- **Reward hacking** when the reward signal is imperfect

## Part 4: How the stages compare

| | Pretraining | SFT | RLHF / DPO |
| --- | --- | --- | --- |
| Data | Trillions of raw tokens | 1k to 1M curated examples | Preference pairs or reward signal |
| Signal | Next token | Imitate the ideal answer | Prefer better over worse |
| Cost | Millions of dollars | Low to moderate | Moderate |
| Teaches | Knowledge, language, reasoning | Format, instruction following | Quality, safety, taste |
| Output | Base model | Instruct model | Aligned assistant |

**Where to use which in a real project:**

1. **Prompting first** (cheapest, fastest to iterate)
2. **RAG** for missing or changing knowledge
3. **SFT** for consistent style, format or a narrow task
4. **Preference tuning** when you have comparison data and need to improve quality on subjective criteria

Fine-tuning is poor at adding *fresh facts* (RAG is better) and good at changing *behavior*.

## Interview Q&A

**1. What does pretraining optimize, and why does it produce such capable models?**
Next-token prediction with cross-entropy loss over trillions of tokens. To predict well, the model has to internalize grammar, facts and reasoning patterns. It's self-supervised, so it scales without human labels.

**2. Why can't you chat with a base model directly?**
It's trained to continue text, not to follow instructions. Given a question, it may produce more questions, because that's what appears in web text. SFT and preference tuning teach assistant behavior.

**3. What is SFT and what does it actually teach?**
Training on `(prompt, ideal response)` pairs with the same next-token loss, usually masking the prompt tokens. It mostly teaches format, style and instruction following, not new knowledge, which comes from pretraining.

**4. Explain RLHF end to end.**
Collect human preference comparisons between responses, train a reward model to predict them, then use RL (PPO) to optimize the policy to maximize reward, with a KL penalty to a reference model to prevent drift and reward hacking.

**5. What is the KL penalty for?**
It keeps the policy close to the reference (SFT) model. Without it, the model exploits quirks of the reward model and produces degenerate but high-scoring outputs, and it can lose general capability.

**6. What is reward hacking? Give an example.**
The policy finds outputs that score high on the learned reward model without being truly better, for example verbose, flattering or oddly formatted answers because the reward model had a bias toward length.

**7. DPO vs RLHF with PPO?**
DPO optimizes directly on preference pairs with a classification-style loss and no reward model or RL loop, so it's simpler, more stable and cheaper. PPO-based RLHF is online (samples fresh responses and rewards them), which can push quality further but is complex, unstable and memory-hungry.

**8. What is RLAIF / Constitutional AI?**
Using an AI judge, guided by written principles, to produce the preference labels instead of humans. It scales cheaply and makes the values explicit, with quality depending on the judge.

**9. SFT vs RAG vs prompting: how do you decide?**
Start with prompting. Use RAG when the model lacks knowledge or the knowledge changes. Fine-tune (SFT) when you need consistent behavior, tone, format or a narrow skill that prompting can't reliably achieve. Fine-tuning is poor at injecting facts.

**10. What are the Chinchilla scaling laws, and how do labs use them today?**
For a given compute budget there's an optimal balance of parameters and training tokens (roughly 20 tokens per parameter). Many labs now overtrain smaller models beyond that point, since inference cost over the model's lifetime matters more than training cost.

**11. What are the downsides of preference tuning?**
Sycophancy, verbosity bias, reduced diversity, possible calibration loss, and reward hacking when the signal is imperfect.

**12. (Follow-up) How do reasoning models fit in?**
They're trained with RL on verifiable rewards (math, code), using algorithms like GRPO, to produce long chains of thought. We'll cover that in topic 14.

## Cheat sheet

- **Pretraining** gives knowledge (next-token, trillions of tokens, huge cost)
- **SFT** gives format and instruction following (small curated data, same loss on responses)
- **RLHF** gives quality and safety (preferences → reward model → PPO with KL penalty)
- **DPO** is preference tuning without a reward model or RL
- **RLVR/GRPO** uses verifiable rewards and powers reasoning models
- Order of tools: prompt → RAG → SFT → preference tuning

## Self-check

1. Why is the loss computed only on response tokens during SFT?
2. What would happen to an RLHF-trained model if you removed the KL penalty?
3. You want your support bot to always answer in a strict JSON schema and your brand tone. Prompting, RAG or SFT, and why?
4. Why is it easier for humans to produce preference data than demonstration data?
5. Your company policy changes weekly. Should you fine-tune the model on it? Why or why not?
</script>

# Chapter 4: LoRA, PEFT and Quantization

This chapter covers topics 10 and 11 of the LLM module. Chapter 3 showed how models are trained. This chapter shows how to **adapt** them cheaply (PEFT/LoRA) and **shrink** them to run on affordable hardware (quantization). Both are essential for real-world work, and QLoRA combines them.

## Part 1: The problem with full fine-tuning

Full fine-tuning updates **every weight**. For a 7B-parameter model in mixed-precision training with Adam, you must hold in GPU memory:

- Weights (fp16): 2 bytes/param
- Gradients (fp16): 2 bytes/param
- Optimizer state (fp32 master weights + two Adam moments): about 12 bytes/param

That is roughly **16 bytes/param, about 112 GB for 7B**, before activations. A 70B model needs over 1 TB. You'd also store a full copy of the model per task.

**PEFT (Parameter-Efficient Fine-Tuning)** solves this: freeze the base model and train only a tiny number of extra parameters.

## Part 2: PEFT methods

| Method | Idea |
| --- | --- |
| **LoRA** | Add small trainable low-rank matrices alongside frozen weights (the dominant method) |
| **Adapters** | Insert small trainable bottleneck layers between transformer layers (adds some inference latency) |
| **Prefix / prompt tuning** | Learn "virtual token" vectors prepended to the input or to each layer's keys and values |
| **IA³** | Learn small vectors that rescale activations |

LoRA won because it adds **no inference latency** (it can be merged into the weights) and is simple and effective.

## Part 3: LoRA in depth

**Core idea.** When fine-tuning, the *change* in a weight matrix, ΔW, is empirically low-rank. It doesn't need as many degrees of freedom as the full matrix. So instead of learning a full ΔW (d × k), learn two thin matrices:

```latex
W' = W + \Delta W = W + \frac{\alpha}{r} B A
```

```
W : d × k   (frozen, original)
B : d × r   (trainable)
A : r × k   (trainable)
r : the rank, small (4, 8, 16, 64)
```

**The parameter savings.** For a 4096 × 4096 matrix:

- Full: 4096 × 4096 = **16.8M** parameters
- LoRA with r = 8: 8 × (4096 + 4096) = **65k** parameters, about 0.4%

Across a whole model, LoRA typically trains **well under 1% of the parameters**.

**Initialization.** A is random (Gaussian), **B is zero**. So ΔW = 0 at the start and the model begins exactly as the pretrained model, then gradually learns the change.

**Hyperparameters:**

- **r (rank):** capacity of the adaptation. Higher means more expressive but more parameters. 8 to 64 is common.
- **alpha (α):** scaling factor. The update is multiplied by α/r. A common default is α = 2r or α = r.
- **target modules:** which layers get LoRA. Originally the attention q and v projections, but applying it to **all linear layers** (q, k, v, o, and the MLP) usually gives better quality.
- **dropout:** light regularization on the LoRA path (for example 0.05).
- **learning rate:** usually higher than for full fine-tuning (around 1e-4 to 2e-4).

**Why this is so useful:**

1. **Memory:** gradients and optimizer states exist only for the tiny adapter, so a 7B model can be fine-tuned on a single consumer or mid-range GPU.
2. **Small artifacts:** an adapter is megabytes (not gigabytes), so you can store one per customer or task.
3. **Swappable:** serve one base model and **hot-swap adapters** per request (multi-tenant serving, supported by vLLM and others).
4. **Zero inference overhead:** after training, you can **merge** `W + BA` into the weights, so the deployed model is the same size and speed as the original.
5. **Less forgetting:** the base weights stay frozen, so general ability is better preserved.

**Limitations:**

- It can underperform full fine-tuning on tasks needing large behavioral shifts or a lot of new knowledge.
- Like all fine-tuning, it's poor at injecting fresh facts (use RAG for that).

```python
from peft import LoraConfig, get_peft_model

config = LoraConfig(
    r=16,
    lora_alpha=32,
    target_modules=["q_proj", "k_proj", "v_proj", "o_proj"],
    lora_dropout=0.05,
    task_type="CAUSAL_LM",
)
model = get_peft_model(base_model, config)
model.print_trainable_parameters()   # typically well under 1% trainable
```

**Use case:** one company wants its legal-document assistant to follow a house style, and each client wants a slightly different tone. Train one small LoRA adapter per client on the same base model and swap them at serving time.

## Part 4: Quantization

**Definition.** Storing and computing with numbers in **lower precision** (fewer bits) to reduce memory and speed up inference.

**Number formats:**

| Format | Bytes/param | 7B model size | Notes |
| --- | --- | --- | --- |
| fp32 | 4 | 28 GB | Full precision, rarely used for LLM inference |
| fp16 / bf16 | 2 | 14 GB | Standard for training and serving |
| int8 / fp8 | 1 | 7 GB | Little quality loss |
| int4 | 0.5 | 3.5 GB | Moderate loss, great memory savings |

**bf16 vs fp16:** both use 16 bits. bf16 has the **same exponent range as fp32** (less overflow and instability in training) but fewer mantissa bits (less precision). fp16 has more precision but a narrow range. bf16 is the usual choice for training on modern GPUs.

**How basic quantization works (symmetric int8):**

```
scale = max(|x|) / 127
q     = round(x / scale)        # stored as int8
x̂     = q × scale               # dequantized approximation
```

The difference between x and x̂ is the **quantization error**. Variants:

- **Asymmetric** adds a zero-point so ranges that aren't centered on 0 are used efficiently.
- **Granularity:** one scale per tensor is cheap but inaccurate. **Per-channel** is better. **Per-group** (for example one scale per 128 weights) is standard for 4-bit LLM weights, balancing accuracy against overhead.

**Why quantization makes inference faster.** LLM decoding is **memory-bandwidth-bound**: to generate each token, the GPU has to read essentially all the weights from memory, and compute isn't the bottleneck. Smaller weights mean fewer bytes to move, so faster tokens per second. It also means a bigger model fits on a given GPU, and leaves more room for the **KV cache** (which you'll meet again in LLMOps).

**Two approaches:**

| | PTQ (Post-Training Quantization) | QAT (Quantization-Aware Training) |
| --- | --- | --- |
| When | After training, using a small calibration set | During training, simulating quantization |
| Cost | Cheap and quick | Expensive |
| Quality at low bits | Good at 8-bit and 4-bit, degrades at 3 or 2 bits | Better at very low bits |
| Usage | The common choice for LLMs | Used when quality at low bits is critical |

**The outlier problem.** In large transformers, a few activation channels have huge values. A naive scale stretched to cover them wastes precision on everything else. Fixes: **LLM.int8()** (handle outlier dimensions in higher precision), **SmoothQuant** (shift difficulty from activations into weights), and weight-only quantization (keep activations in 16-bit).

**Popular methods and formats:**

- **GPTQ:** PTQ that quantizes layer by layer using second-order information to minimize error. Popular for 4-bit GPU inference.
- **AWQ (Activation-aware Weight Quantization):** protects the small fraction of weights most important to activations. Fast and accurate for 4-bit.
- **bitsandbytes:** library for 8-bit and 4-bit (NF4) loading in Hugging Face, and the basis of QLoRA.
- **GGUF (llama.cpp):** file format and quantization levels (Q4_K_M, Q5_K_M, Q8_0) for running on CPUs, laptops and phones.
- **FP8:** supported natively on newer GPUs (for example H100), used for both training and serving with good quality.

**Quality trade-off (rule of thumb):**

- 8-bit: near-lossless
- 4-bit: small, often acceptable loss, and the sweet spot for local and cost-sensitive serving
- 3-bit and below: noticeable degradation, especially on reasoning, math and small models
- **Larger models tolerate quantization better** than small ones, so a 4-bit 70B model generally beats an fp16 13B model.

**Always evaluate on your own task** after quantizing. Benchmarks can hide regressions in specific behaviors (long context, code, non-English).

**Memory estimate rule of thumb:** `weights ≈ params × bytes/param`. Add the KV cache, activations and overhead on top. A 70B model in 4-bit is about 35 GB for weights, so it fits on one 48 GB or 80 GB GPU, while fp16 needs 140 GB.

**Use case:** you want to run a 13B model locally on a laptop. In fp16 it needs 26 GB, which won't fit. A 4-bit GGUF version is about 7 to 8 GB, which does.

## Part 5: QLoRA, combining both

**QLoRA** = quantize the frozen base model to **4-bit**, then train **LoRA adapters** on top in higher precision (bf16).

Its key ingredients:

1. **NF4 (4-bit NormalFloat):** a 4-bit data type designed for weights that follow a roughly normal distribution, giving less error than plain int4.
2. **Double quantization:** also quantize the quantization constants to save more memory.
3. **Paged optimizers:** handle memory spikes by paging optimizer states to CPU memory.

Gradients flow *through* the dequantized 4-bit weights into the LoRA matrices. The result is that you can fine-tune very large models (for example 33B to 65B) on a **single GPU**, with quality close to 16-bit LoRA.

```python
from transformers import BitsAndBytesConfig
import torch

bnb = BitsAndBytesConfig(
    load_in_4bit=True,
    bnb_4bit_quant_type="nf4",
    bnb_4bit_use_double_quant=True,
    bnb_4bit_compute_dtype=torch.bfloat16,
)
# load the base model with quantization_config=bnb, then apply LoRA with peft
```

**Typical workflow:** QLoRA fine-tune on a single GPU, merge or keep the adapter, then deploy (optionally quantizing the merged model again with AWQ/GPTQ for serving).

## Interview Q&A

**1. What is PEFT and why do we need it?**
Parameter-Efficient Fine-Tuning trains a small number of added parameters while freezing the base model. Full fine-tuning needs weights, gradients and optimizer states for every parameter (about 16 bytes/param), which is too expensive, and it produces a full model copy per task.

**2. Explain LoRA.**
Freeze the weight W and learn a low-rank update ΔW = BA, where B is d×r and A is r×k with small r. The forward pass uses W + (α/r)·BA. It trains under 1% of the parameters, and the update can be merged into W after training.

**3. Why is LoRA's update low-rank?**
Empirically, the weight change needed to adapt a pretrained model to a task has low intrinsic dimension, so a low-rank matrix captures most of it.

**4. Why is B initialized to zero?**
So ΔW starts at exactly 0 and training begins from the pretrained model's behavior. A is random so gradients can flow and B can learn from the start.

**5. How do you choose r and alpha, and which modules to target?**
r sets the capacity (8 to 64 is typical, higher for harder tasks or more data). α scales the update (often α = r or 2r). Targeting all linear layers usually works better than only q and v. Tune on a validation set.

**6. Does LoRA add inference latency?**
No, if you merge the adapter into the base weights. If you keep adapters separate (for multi-tenant swapping), there is a small extra computation.

**7. When would you pick LoRA over full fine-tuning, and when not?**
LoRA when memory or cost is limited, you need many task-specific variants, or you want to limit forgetting. Full fine-tuning when you need large behavioral changes or have lots of data and compute, since LoRA can lag in those cases.

**8. What is quantization, and why does it speed up inference?**
Representing weights (and sometimes activations) in fewer bits. LLM decoding is memory-bandwidth-bound, so reading fewer bytes per token increases throughput. It also reduces the memory footprint.

**9. PTQ vs QAT?**
PTQ quantizes a trained model using a small calibration dataset, which is cheap and works well down to 4-bit. QAT simulates quantization during training so the model adapts, which gives better quality at very low bit widths but costs far more.

**10. What are activation outliers, and why are they a problem?**
A few channels have very large values, so a single scale wastes precision on the rest. Solutions include mixed-precision handling of outliers (LLM.int8), SmoothQuant, and weight-only quantization.

**11. GPTQ vs AWQ vs GGUF?**
GPTQ and AWQ are PTQ methods for GPU inference (GPTQ minimizes layer-wise error with second-order info, AWQ protects the weights most important to activations). GGUF is a file format and quantization family for llama.cpp, targeting CPU and edge deployment.

**12. Explain QLoRA.**
The frozen base model is quantized to 4-bit NF4 (with double quantization and paged optimizers), and LoRA adapters are trained in bf16 on top. It allows fine-tuning very large models on one GPU with quality close to 16-bit LoRA.

**13. How much memory does a 70B model need in fp16 vs 4-bit?**
About 140 GB (70B × 2 bytes) in fp16 and about 35 GB (70B × 0.5 bytes) in 4-bit for weights, plus KV cache and overhead.

**14. (Follow-up) Quantization makes the model smaller. Could it hurt anything?**
Yes. It can degrade reasoning, math, long-context and multilingual quality, especially for small models and at 3-bit or lower. Always re-run your own evals.

## Cheat sheet

- **Full FT** ≈ 16 bytes/param, **LoRA** trains <1% of params
- **LoRA:** `W' = W + (α/r)·BA`, B starts at zero, merge for zero latency
- **Adapters are swappable**, so one base model can serve many tasks
- **Quantization:** fewer bits per weight, so less memory and faster decoding
- 7B: fp16 14 GB, int8 7 GB, int4 3.5 GB
- **PTQ** (GPTQ, AWQ, GGUF, bitsandbytes) is the common choice, while **QAT** is for extreme low bits
- **QLoRA** = 4-bit NF4 base + LoRA adapters

## Self-check

1. A 4096 × 11008 MLP weight gets LoRA with r = 16. How many trainable parameters does that add?
2. Why is B zero-initialized and not A?
3. Roughly how much memory do the weights of a 13B model need in fp16, int8 and int4?
4. Why does quantizing weights speed up token generation even though the GPU's compute doesn't change?
5. You need to fine-tune a 34B model but have one 48 GB GPU. What's your approach?
</script>
