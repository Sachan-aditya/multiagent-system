# Chapter 5: Sampling, Hallucinations, Reasoning, Multimodal and Open vs Closed Models

This chapter covers topics 12 to 16 and finishes the LLM module. It has five parts, then interview Q&A, a cheat sheet and a self-check.

## Part 1: Temperature and Top-p (sampling)

**Where it fits.** At each step the model outputs a score (**logit**) for every token in the vocabulary. Softmax turns the logits into probabilities. **Sampling** is how you pick the next token from them. Different choices give very different behavior.

**Greedy decoding.** Always pick the highest-probability token. It's deterministic but can be repetitive and dull, and it can get stuck in loops.

### Temperature

Logits are divided by T before softmax:

```latex
p_i = \text{softmax}\left(\frac{\text{logit}_i}{T}\right)
```

| Temperature | Effect |
| --- | --- |
| T → 0 | Distribution gets sharper, approaching greedy (focused, repeatable) |
| T = 1 | The model's raw distribution |
| T > 1 | Distribution flattens, so output is more random and creative, and can become incoherent |

A tiny numeric feel: logits give probabilities [0.6, 0.3, 0.1] at T=1. At T=0.5 they sharpen to roughly [0.78, 0.20, 0.02]. At T=2 they flatten to roughly [0.46, 0.33, 0.21].

### Top-k and Top-p (nucleus sampling)

Temperature reshapes the whole distribution, including the long tail of nonsense tokens. Truncation methods cut the tail:

- **Top-k:** keep only the k most likely tokens, renormalize, then sample. The problem is that k is fixed, which is too many when the model is confident and too few when it's uncertain.
- **Top-p (nucleus):** keep the smallest set of tokens whose cumulative probability ≥ p (for example 0.9), then sample from it. The set size adapts: tiny when the model is confident, larger when it's unsure.
- **Min-p** (newer): keep tokens whose probability is at least a fraction of the top token's probability.

Other controls: **frequency/presence penalties** (discourage repetition), **max tokens**, **stop sequences**, **seed** (best-effort reproducibility), and **logit bias**.

### Practical settings

| Task | Setting |
| --- | --- |
| Extraction, classification, JSON, code, factual QA | Temperature 0 to 0.3 |
| General chat | About 0.7 |
| Brainstorming, creative writing | 0.8 to 1.2 |

Rules: change **one of temperature or top-p**, not both at once. Temperature 0 isn't a guarantee of identical outputs (GPU floating-point non-determinism, batching, and provider differences can still cause variation). Some reasoning models fix or restrict sampling parameters.

**Use case:** a data-extraction pipeline uses temperature 0 for consistency, and a marketing-slogan generator samples several candidates at temperature 1.

```python
import numpy as np

def sample(logits, T=1.0, top_p=0.9):
    p = np.exp((logits - logits.max()) / T)
    p /= p.sum()
    idx = np.argsort(p)[::-1]                    # sort high → low
    keep = np.searchsorted(np.cumsum(p[idx]), top_p) + 1
    idx = idx[:keep]
    q = p[idx] / p[idx].sum()
    return np.random.choice(idx, p=q)
```

## Part 2: Hallucinations

**Definition.** The model produces fluent, confident text that is **false or unsupported**: invented facts, fake citations, wrong numbers, nonexistent API functions.

**Why they happen:**

1. **The objective is plausibility, not truth.** Next-token prediction rewards likely-sounding text. The model has no built-in "I don't know" mechanism unless it's trained for it.
2. **Gaps and long-tail knowledge.** Rare facts are seen few times, so the model fills in plausible details.
3. **Training incentives.** Benchmarks and preference data often reward a confident answer over an honest "I'm not sure". Sycophancy (Chapter 3) also pushes the model to go along with false premises.
4. **Stale knowledge.** Training data has a cutoff date.
5. **Decoding randomness.** High temperature raises the chance of low-probability, wrong tokens.
6. **Bad context.** Contradictory or irrelevant retrieved text can mislead the model.
7. **Exposure bias.** Early errors in a generation get conditioned on and compounded.

**Types:**

- **Intrinsic:** contradicts the provided source (summary says something the document doesn't).
- **Extrinsic:** adds claims not in the source and not verifiable.
- **Factual vs faithfulness** errors: wrong about the world, versus unfaithful to the given context.

**Mitigation, in order of impact:**

| Technique | How it helps |
| --- | --- |
| **RAG / grounding** | Give the model the facts and tell it to answer only from them |
| **Citations and quote extraction** | Require sources, and verify that the quotes exist in the context |
| **Allow "I don't know"** | Explicitly permit abstaining, and instruct it to say when the context lacks the answer |
| **Tool use** | Calculators, code execution, databases and search instead of recalling from memory |
| **Lower temperature** | Reduces random drift |
| **Self-verification / second pass** | Ask the model (or another) to check claims against the source |
| **Self-consistency** | Sample several answers and check agreement |
| **Structured outputs and validation** | Enforce schemas, validate against a database or regex |
| **Better models, fine-tuning on honesty** | Train for calibration and abstention |
| **Human review** for high-stakes domains | Medical, legal and financial |

Important: **you can reduce hallucinations but not eliminate them**. Design the system to *detect and contain* them (grounding, validation, evals, user-visible citations), and don't assume they're gone. How to measure them is covered in the Evals module (faithfulness and groundedness).

**Use case:** a legal research assistant must not invent case citations. Use retrieval from a verified case database, require citations with IDs, verify every citation exists programmatically, and have the model say "no relevant case found" when retrieval returns nothing.

## Part 3: Reasoning models

**The idea.** For hard problems (math, code, multi-step logic), a model does better if it *thinks before answering*. Chain-of-thought (CoT) showed that writing out intermediate steps improves accuracy. **Reasoning models** are trained to do this automatically, producing a long internal **chain of thought** before the final answer.

**How they differ from standard LLMs:**

| | Standard LLM | Reasoning model |
| --- | --- | --- |
| Behavior | Answers directly (maybe with a prompted CoT) | Generates a long thinking trace first |
| Training | Pretrain + SFT + preference tuning | Adds large-scale **RL with verifiable rewards** (math answers, unit tests) |
| Compute | Spent mostly at training time | Also spent at **inference time** |
| Latency and cost | Fast, cheap | Slower and more expensive (thinking tokens are billed) |
| Strength | General tasks, speed | Math, coding, planning, multi-step problems |

**Key concepts:**

- **Test-time compute scaling.** Accuracy improves as the model is allowed to think longer. This is a second scaling axis beyond model size.
- **RL with verifiable rewards (RLVR, GRPO).** The model is rewarded when its final answer is checkable and correct. Over training, behaviors like step-by-step reasoning, checking its own work and backtracking **emerge**.
- **Thinking budget.** Many APIs let you control how much the model may think (low, medium or high effort, or a token budget).
- **Related inference-time techniques:** self-consistency (majority vote over samples), best-of-N with a verifier, tree search, and process reward models (scoring each step, not just the final answer).
- **Distillation.** Reasoning traces from a strong model can be used to teach smaller models to reason.

**When to use a reasoning model:**

- Yes: complex math, algorithm design, debugging, multi-step planning, difficult analysis, agentic tasks needing careful decisions.
- No: simple lookup, classification, rewriting, chat, or latency-sensitive tasks. They add cost and delay for little benefit, and they can **overthink** easy questions.

**Prompting differences:** keep prompts clear and high-level, state the goal and constraints, and avoid micro-managing the steps or telling it to "think step by step" (it already does). Don't rely on seeing the raw reasoning trace, because it may be hidden or summarized and isn't always a faithful explanation of how the answer was reached.

**Use case:** a code-review agent uses a fast model for style checks and routes tricky concurrency bugs to a reasoning model with a high thinking budget.

## Part 4: Multimodal models

**Definition.** Models that handle more than text: **images, audio, video, documents**, as input and sometimes output.

**How vision input typically works:**

1. A **vision encoder** (usually a ViT, Vision Transformer, or CLIP-style encoder) splits the image into patches and turns them into vectors.
2. A **projector / adapter** maps those vectors into the LLM's embedding space.
3. The image becomes a sequence of **"image tokens"** placed in the context alongside text tokens, and the transformer attends over everything together.

Training aligns the image and text representations, then fine-tunes on instruction data with images. **CLIP** is the classic idea: contrastive training so an image and its caption land close together in the same embedding space.

**Audio:** speech is encoded (Whisper-style) into tokens, either via transcription or natively. Native speech models can respond in audio with low latency and preserve tone and emotion. **Video** is handled as sampled frames plus audio.

**Output side:** some models generate images (diffusion models or autoregressive image tokens) and audio (speech synthesis). Text-to-image diffusion is a different architecture family from LLMs, often combined with an LLM through the prompt.

**Practical points:**

- **Images cost tokens.** A high-resolution image can consume hundreds to thousands of tokens, so count them in your context budget and cost.
- **Common failure modes:** reading small text, counting objects, spatial relationships, charts with dense data, and hallucinating details not in the image.
- **Documents:** for PDFs, compare OCR-then-text, layout-aware parsing, and sending page images to a vision model. Tables and charts often work better with vision input.
- **Privacy and safety:** images can contain PII, faces and hidden **prompt-injection text**, so treat them as untrusted input.

**Use cases:** invoice and receipt extraction, UI screenshot understanding and testing, medical or industrial image triage (with human oversight), accessibility (describing images), voice assistants, and chart or diagram question answering.

## Part 5: Open-weight vs closed models

**Definitions:**

- **Closed (proprietary) models:** accessed only through a vendor's API (for example Claude, GPT, Gemini). You don't get the weights.
- **Open-weight models:** the trained weights are downloadable (for example Llama, Mistral, Qwen, DeepSeek, Gemma), so you can self-host and fine-tune them.

**"Open-weight" is not the same as "open-source".** Usually the weights are released (under a license that may carry restrictions such as usage limits or attribution), but the training data and training code often aren't. Always **read the license** before commercial use.

| | Closed (API) | Open-weight (self-host or hosted) |
| --- | --- | --- |
| Quality at the frontier | Typically strongest | Often close, and gap varies by task |
| Setup | Instant, a few lines of code | Needs infrastructure, GPUs and MLOps |
| Cost model | Pay per token, no fixed cost | Fixed GPU cost, cheap at high steady volume |
| Data privacy | Data goes to the vendor (check contracts and retention terms) | Data can stay in your environment |
| Customization | Prompting, limited fine-tuning options | Full control: fine-tuning, quantization, custom serving |
| Control and stability | Vendor can update or deprecate models | You pin the exact version forever |
| Latency control | Limited | Full control over hardware and serving stack |
| Compliance | Vendor certifications help | You own the compliance burden |
| Safety features | Provider guardrails included | You build and maintain them |

**How to decide:**

- **Start with closed APIs** for prototyping and low-to-medium volume. It's the fastest way to learn what works.
- **Move to open-weight** when you have strict data residency or privacy needs, very high and predictable volume (self-hosting becomes cheaper), a need for deep customization, offline or on-device deployment, or a risk you can't accept from vendor dependency.
- **Hybrid is common:** a frontier closed model for hard queries and a small fine-tuned open model for high-volume simple ones (this is **model routing**, which you'll cover in LLMOps).
- **Always compare on your own evals**, not on public leaderboards alone.

**Hidden costs of self-hosting:** GPU capacity planning, serving stack (vLLM and similar), monitoring, upgrades, on-call, security patching, and utilization risk (idle GPUs still cost money).

**Use case:** a bank with strict data-residency rules self-hosts a quantized open-weight model with a LoRA adapter for internal document search, while a startup prototyping a chatbot uses a closed API and ships in a day.

## Interview Q&A

**1. What does temperature do?**
It divides the logits before softmax. Low temperature sharpens the distribution (more deterministic), high temperature flattens it (more random and diverse). Temperature 0 approximates greedy decoding.

**2. Top-p vs top-k?**
Top-k keeps a fixed number of top tokens. Top-p keeps the smallest set whose cumulative probability reaches p, so the set size adapts to how confident the model is. Top-p is generally more robust.

**3. What settings would you use for JSON extraction vs creative writing?**
Extraction: temperature 0 to 0.3 plus schema validation. Creative: roughly 0.8 to 1.2 with top-p around 0.9 to 0.95. Tune one knob at a time.

**4. Does temperature 0 guarantee identical outputs?**
No. Floating-point non-determinism on GPUs, batching, and provider differences can still produce variation. Seeds help but aren't guaranteed.

**5. Why do LLMs hallucinate?**
They're trained to produce plausible next tokens, not to verify truth. Knowledge gaps, long-tail facts, training incentives that reward confident answers, stale data, sampling randomness and bad context all contribute.

**6. How would you reduce hallucinations in a production system?**
Ground answers in retrieved documents (RAG), require citations and verify them, allow "I don't know", use tools for calculations and lookups, lower temperature, validate outputs against structured data, and measure with faithfulness evals. Accept that you can reduce but not eliminate them.

**7. Intrinsic vs extrinsic hallucination?**
Intrinsic contradicts the provided source. Extrinsic adds information that isn't in the source and can't be verified from it.

**8. What is a reasoning model and how is it trained?**
A model that produces a long chain of thought before answering. It's trained, after standard pretraining and SFT, with reinforcement learning on verifiable rewards (checkable math, code tests), so reasoning behaviors like checking and backtracking emerge.

**9. What is test-time compute scaling?**
Improving accuracy by spending more compute at inference (longer thinking, multiple samples, search with a verifier) instead of only making the model bigger.

**10. When should you not use a reasoning model?**
For simple or latency-sensitive tasks (classification, rewriting, FAQ chat), where they add cost and delay and may overthink, with no accuracy benefit.

**11. How does a vision-language model process an image?**
A vision encoder (ViT or CLIP-style) converts image patches to vectors, a projector maps them into the LLM's embedding space, and they're consumed as image tokens alongside text in the transformer.

**12. What are typical failure modes of multimodal models?**
Misreading small or dense text, counting, spatial reasoning, complex charts, and hallucinating details. Images also consume many tokens and can carry hidden prompt injections.

**13. Open-weight vs closed: how do you choose?**
Prototype on closed APIs for speed and top quality. Choose open-weight for data privacy and residency, high steady volume, deep customization, offline use, or avoiding vendor lock-in, accepting the infrastructure and MLOps burden. Decide using your own evals and total cost.

**14. Is "open-weight" the same as "open-source"?**
No. Weights are downloadable, but the training data and code are often not released, and licenses can restrict use. Check the license.

**15. (Follow-up) Design a cost-efficient system that needs both high quality and low cost.**
Use model routing: a small, cheap (possibly self-hosted and fine-tuned) model handles easy and high-volume requests, and escalates hard ones to a frontier or reasoning model. Add caching, and measure quality with evals to set the routing threshold.

## Cheat sheet

- **Temperature** reshapes the distribution, and **top-p** truncates the tail. Low for factual tasks, higher for creative ones. Change one knob at a time.
- **Hallucinations** come from plausibility-based training. Mitigate with RAG, citations, tools, abstention, validation and evals. Reduce, never eliminate.
- **Reasoning models** are trained with RL on verifiable rewards and think at inference time. Great for hard tasks, but slower and costlier, so don't use them for simple ones.
- **Multimodal** = encoder + projector → image tokens in the LLM context. Images cost tokens and can hide injections.
- **Open-weight vs closed** is a trade-off between control and privacy on one side, and convenience and peak quality on the other. Hybrid routing is common.

## Self-check

1. If a model's top token has probability 0.9, what do top-p = 0.9 and top-k = 50 do differently?
2. Your RAG bot still invents facts occasionally. List three changes you'd make.
3. Your product answers simple FAQs and occasionally solves hard math. How would you use reasoning and non-reasoning models?
4. Why can an image consume as many tokens as a long paragraph?
5. A client has a strict "no data leaves our network" rule. Which model option do you pick, and what extra work does that create?

You have now finished Module 1 (LLMs).

# Chapter 6: Prompt Anatomy and Core Techniques

This is the first chapter of Module 2 (Prompt Engineering). It covers topics 1 to 5: system vs user prompts, zero-shot, few-shot, role prompting, and instructions and constraints. The next chapters cover structure (XML, JSON, templates), reasoning techniques (CoT, chaining, self-consistency), and production concerns (context engineering, caching, injection defense, versioning).

## Part 0: What prompt engineering is

A prompt is the entire input the model sees. Since the model is stateless (Chapter 2), **the prompt is your only lever** besides fine-tuning and tool design. Prompt engineering means designing that input so the model reliably produces the output you want, and *measuring* whether it does.

Think of it as writing a spec for a very capable but literal new colleague who has zero context about your situation. Whatever you don't say, they will guess.

**The mindset shift:** a prompt that works on 3 examples proves nothing. A production prompt is tested against a set of cases (this connects to the Evals module).

## Part 1: System vs user prompts

Chat APIs take a list of messages with **roles**:

| Role | Who writes it | Purpose |
| --- | --- | --- |
| **system** | The developer | Persistent rules: identity, behavior, format, constraints, tools |
| **user** | The end user (or your app on their behalf) | The actual request or data for this turn |
| **assistant** | The model (or you, to prefill or provide examples) | Previous replies, few-shot examples |

```python
messages = [
    {"role": "system", "content": "You are a support assistant for Acme. Answer only from the provided policy. Be concise."},
    {"role": "user", "content": "Can I return an item after 40 days?"},
]
```

**What belongs in the system prompt:**

- Who the model is and the task it does
- Tone and audience
- Output format
- Hard rules and refusals (what not to do)
- How to handle uncertainty ("say you don't know")
- Tool descriptions and when to use them

**What belongs in the user turn:** the changing, per-request content: the question, the document to process, retrieved chunks.

**Why the split matters:**

1. **Priority.** Models are trained to give the system prompt higher authority than user text, which makes it your main defense against users overriding behavior (see prompt injection in a later chapter). This is a tendency, **not a security guarantee**.
2. **Caching.** The stable system prompt sits at the start of every request, so it can be cached (a later chapter).
3. **Organization.** Rules stay separate from data, which is easier to version and test.

**Pitfalls:**

- Putting secrets (API keys, private business logic) in the system prompt. Users can often extract it. Never rely on prompt secrecy.
- A huge, contradictory system prompt. Rules at the end can conflict with rules at the start, and the model resolves it unpredictably.
- Treating system-prompt rules as enforcement. Critical constraints (permissions, data access) must be enforced in **code**, not only in text.

Some APIs have no separate system role, or reasoning models treat it differently (for example a "developer" message). The principle is the same: stable instructions first, variable input after.

**Use case:** a bank chatbot's system prompt fixes the persona, the compliance disclaimers and the refusal rules. The user turn contains the customer's question and the retrieved account FAQ chunks.

## Part 2: Zero-shot prompting

**Definition.** Give the instruction and the input with **no examples**. The model relies on what it learned in pretraining and instruction tuning.

```
Classify the sentiment of this review as positive, negative or neutral.
Review: "The battery died after two days."
Sentiment:
```

**When it works well:** common, well-defined tasks (summarizing, translating, simple classification, extraction), and strong modern models.

**When it falls short:**

- Unusual output formats or labeling conventions
- Subtle, domain-specific judgments ("what counts as a P1 ticket *at our company*")
- Tasks where the model's interpretation of the instruction differs from yours

**Always start here.** Write the clearest zero-shot prompt you can, test it, and only add complexity (examples, reasoning steps) where it fails. Extra machinery you don't need costs tokens and makes prompts harder to maintain.

**How to write a strong zero-shot prompt:**

1. Say exactly what the task is, in plain, specific words
2. Define the labels or the output format
3. State the audience or purpose (it changes the right answer)
4. Say how to handle edge cases ("if the review is mixed, answer neutral")

Weak: `Summarize this.`
Strong: `Summarize the support ticket below in 2 sentences for an engineer who hasn't seen it. State the user's problem and what they already tried. Do not include greetings or the customer's name.`

## Part 3: Few-shot prompting

**Definition.** Include **examples** of input and desired output inside the prompt. The model learns the pattern **in context**, with no weight updates (this is *in-context learning*).

```
Classify each ticket's priority.

Ticket: "Site is down for all users" → P1
Ticket: "Typo on the pricing page" → P4
Ticket: "Checkout fails for some users on Safari" → P2

Ticket: "Password reset email arrives 10 minutes late" →
```

**When it shines:**

- A specific **output format** or style you can't easily describe
- **Custom label definitions** and borderline cases
- Tone matching (write like our brand)
- Tasks where showing is easier than telling

**Best practices:**

- **Quality over quantity.** Typically 3 to 5 good examples. More examples cost tokens and give diminishing returns.
- **Diversity.** Cover different cases, including edge cases and at least one "none/other/unclear" case. All-similar examples make the model overfit to the pattern.
- **Label balance.** If 4 of 5 examples are "positive", the model drifts toward predicting positive. Balance, and consider randomizing order.
- **Consistent format.** Every example must use exactly the same structure, because the model copies the format, including mistakes.
- **Representative of real inputs.** Use realistic data, not toy examples.
- **Order matters.** Models can be biased toward the **last** example (recency). Test different orders.
- **Clearly separate examples** from the real input (delimiters, covered in the next chapter).
- **Keep the instruction too.** Examples complement the instruction and don't replace it.

**Pitfalls:**

- The model **copies surface features** of the examples (length, phrasing, even wrong answers). Check that examples are correct.
- Examples can **anchor the content**, so every output starts looking like your example. Vary them.
- Few-shot costs input tokens on every call. Use **prompt caching** to offset this.

**Dynamic few-shot (selected examples).** Store a pool of labeled examples and, per request, retrieve the most similar ones using embeddings (Chapter 2) and insert them. It's often much more accurate than static examples, and it's essentially **RAG for examples**.

**Many-shot.** With long context windows, you can include dozens or hundreds of examples, which can approach fine-tuning quality for some tasks. It's expensive, so combine it with caching.

**Few-shot vs fine-tuning:** few-shot is instant to change and needs no training, but costs tokens per call. Fine-tuning (Chapter 3 and 4) bakes behavior into the weights, which is cheaper per call at high volume but slower to iterate on.

**Use case:** classifying customer emails into your company's own 12 categories. Zero-shot confuses "billing dispute" with "refund request". Adding 2 examples per confusing category fixes it.

## Part 4: Role prompting

**Definition.** Assign the model a persona or perspective: "You are a senior database engineer reviewing a pull request."

**What it does well:**

- Sets **tone, vocabulary and level of detail** (a pediatrician vs a researcher explaining the same topic)
- Focuses the model on a **perspective** (security reviewer, skeptical editor, interview coach)
- Helps with **style consistency** in generated text

**What it does *not* do:**

- It does **not** add knowledge or skill. "You are a world-class mathematician" won't make the model better at math. Studies show that generic expert personas give small or inconsistent accuracy gains on factual and reasoning tasks.
- It doesn't replace clear instructions.

**Better than a vague role: a specific role with context and a goal.**

Weak: `You are an expert.`
Strong: `You are a code reviewer for a Python backend team. You prioritize correctness and security over style. For each issue, give the line, the risk, and a fix.`

**Useful patterns:**

- **Audience framing:** "Explain to a new hire who knows SQL but not distributed systems."
- **Adversarial roles:** a "devil's advocate" or "red-team reviewer" to critique a plan.
- **Multi-role review:** run the same draft through separate prompts as editor, fact-checker and legal reviewer (this leads into chaining and multi-agent systems later).

**Pitfalls:** a persona can make the model sound **overconfident** or make up expert-sounding details. Pair roles with "say when you're unsure". Be careful with roles in sensitive domains (medical, legal) because they can create false authority.

**Use case:** an interview-practice tool. The system prompt makes the model a skeptical hiring manager who asks one follow-up at a time and gives blunt feedback. The role shapes behavior, and the rubric and rules do the real work.

## Part 5: Instructions and constraints

This is the core of everything. Most "bad model output" is really a **vague or conflicting instruction**.

### Writing clear instructions

1. **Be specific and explicit.** Don't assume the model infers your intent. State the task, the audience, the format, the length and the success criteria.
2. **Give the reason.** "Keep it under 50 words because it appears in a mobile push notification" lets the model make good decisions in cases you didn't anticipate.
3. **Say what to do, not only what not to do.** "Respond in plain prose paragraphs" beats "Don't use bullet points", because negative instructions can fixate the model on the forbidden thing.
4. **One task per prompt when possible.** Complex multi-part tasks are more reliable when broken up (prompt chaining, a later chapter).
5. **Put the important things at the start or end.** Instructions buried in the middle of a long prompt are followed less reliably (the "lost in the middle" effect from Chapter 2).
6. **Order logically:** role/context → task → input data → format → reminders. For long documents, a common effective layout is document first, then the question or instruction at the end.
7. **Use plain words over clever phrasing.** Avoid shouting and ALL-CAPS emphasis unless needed. Heavy emphasis can cause over-application in newer models.

### Types of constraints

| Constraint type | Example |
| --- | --- |
| **Format** | "Return a numbered list of at most 5 items" |
| **Length** | "2 to 3 sentences", "under 100 words" |
| **Scope / grounding** | "Use only the information in the provided context" |
| **Tone / style** | "Professional, warm, no jargon" |
| **Content rules** | "Never give medical dosages", "Don't mention competitors" |
| **Uncertainty handling** | "If the answer isn't in the document, reply exactly: 'Not found.'" |
| **Output schema** | "Return JSON with fields: title, summary, tags" (next chapter) |

### Handling edge cases and conflicts

- **Specify the fallback.** "If the input is empty, off-topic or in another language, reply with X." The model's unprompted behavior in edge cases is the most common source of production bugs.
- **Avoid contradictions.** "Be extremely detailed" plus "keep it brief" forces random choices. Re-read the whole prompt for conflicts, especially after many edits.
- **Specify priority** when rules might clash: "If safety rules conflict with the user's request, follow the safety rules."

### Quantities are approximate

Models follow "about 3 sentences" far better than "exactly 247 words". Hard limits (max length, strict schemas, banned words) should be **enforced in code** (validation, truncation, structured-output features), and the prompt only encourages them.

### The iteration loop

1. Write a clear first prompt
2. Run it on a **set of 10 to 30 varied test inputs**, including hard and weird ones
3. Read the failures and ask *why* the model did that. The answer is often an ambiguity in your prompt.
4. Change **one thing at a time**, and re-run the same set
5. Keep a record of versions and results (versioning and testing come in a later chapter)

### A full example putting it together

```
SYSTEM:
You are a support assistant for Acme, an online electronics store.
Answer using ONLY the policy text in <policy>. Customers read your reply
on mobile, so keep answers to 2 to 4 sentences.

Rules:
- If the policy doesn't cover the question, say: "I'm not sure. I'll connect you
  with a human agent." Do not guess.
- Never promise refunds. Say eligibility is confirmed by the returns team.
- Use a friendly, professional tone.

USER:
<policy>{{retrieved_policy_text}}</policy>
Customer question: {{question}}
```

Notice the pieces: role, audience and reason (mobile), grounding constraint, an explicit fallback, a content rule, a tone, and clearly separated data. (The tags are previewed here and explained properly in the next chapter.)

## Common beginner mistakes

| Mistake | Fix |
| --- | --- |
| Vague task ("make this better") | Define "better": shorter, friendlier, more formal? |
| No fallback for unknown or edge cases | Add explicit "if X, then Y" instructions |
| Stacking many unrelated tasks in one prompt | Split into steps |
| Testing on 2 or 3 happy-path examples | Use a diverse test set with edge cases |
| Examples that contradict the instructions | Keep examples and rules consistent |
| Relying on the prompt for security or hard limits | Enforce in code and permissions |
| Adding more and more rules after each failure | Rewrite and simplify periodically, because prompts rot |

## Interview Q&A

**1. What's the difference between the system and user prompt, and why does it matter?**
The system prompt carries the developer's persistent rules (role, format, constraints) and the user message carries the request and data for that turn. Models weight system instructions more heavily, and the split enables caching and cleaner versioning. It's a tendency, not a security boundary, so critical rules must be enforced in code.

**2. Zero-shot vs few-shot: when do you use each?**
Start zero-shot with a precise instruction. Add few-shot examples when the output format, labels or style are hard to describe, or when zero-shot makes consistent mistakes on edge cases.

**3. What makes good few-shot examples?**
Diverse, representative, correct, consistently formatted, label-balanced, with edge cases included. Usually 3 to 5. Be aware of recency bias in ordering, and verify the examples have no mistakes the model will copy.

**4. What is dynamic few-shot?**
Retrieving the most similar labeled examples for each input (using embeddings) and inserting them in the prompt. It's like RAG for examples, and it usually beats a fixed example set.

**5. Does "You are an expert X" actually improve answers?**
It mostly affects tone, vocabulary and perspective. It adds no real knowledge and gives small or inconsistent accuracy gains on reasoning tasks. A specific role with context and goals is helpful. A generic "expert" persona isn't a substitute for clear instructions.

**6. Why prefer "do X" over "don't do Y"?**
Positive instructions give the model a concrete target, and negations can focus attention on the unwanted behavior. Pair it with a stated reason and, where needed, an explicit fallback.

**7. How do you handle edge cases in prompts?**
Define the fallback explicitly ("if the context lacks the answer, reply exactly X"), cover empty, off-topic and adversarial inputs, and test them in your evaluation set.

**8. Your prompt works in demos but fails in production. What do you do?**
Build a test set from real traffic (including failures), identify failure patterns, check for ambiguity or conflicting instructions, change one variable at a time, and measure. Add code-side validation for hard constraints.

**9. Where would you place a long document and the question in the prompt?**
Document first, and instructions or the question at the end, wrapped in clear delimiters. Content at the start and end of a long prompt gets the most reliable attention.

**10. Can you rely on a system prompt to keep something secret or enforce permissions?**
No. Users can often extract or override prompts. Secrets stay out of prompts, and permissions and limits are enforced in application code.

**11. (Follow-up) Few-shot or fine-tuning for a classification task with 20 categories and 10k labeled examples?**
Try dynamic few-shot with retrieved examples first (fast, no training). If volume is high and per-call token cost or latency matters, or accuracy plateaus, fine-tune a smaller model. Decide with evals on a held-out set.

## Cheat sheet

- **System** = stable rules, **user** = per-request input, and neither is a security boundary
- **Zero-shot first**, **few-shot** for format and edge cases (3 to 5 diverse, balanced, correct examples)
- **Role prompting** shapes tone and perspective, not knowledge
- **Good instructions:** specific, with a reason, positive, one task, explicit fallbacks, no contradictions
- Hard limits go in **code**, and the prompt only encourages them
- Iterate with a **test set**, changing one thing at a time

## Self-check

1. Rewrite "Summarize this article" as a strong zero-shot prompt for a busy executive.
2. Your classifier predicts "positive" too often. You have 5 few-shot examples: 4 positive, 1 negative. What's likely happening, and what do you change?
3. Why doesn't "You are a world-class mathematician" reliably fix wrong math answers? What would?
4. Your system prompt says "Be thorough" in one place and "Keep answers brief" in another. What goes wrong, and how do you fix it?
5. List two constraints you'd enforce in code and not only in the prompt.

# Chapter 7: XML Tags and Delimiters, Chain-of-Thought, Structured Outputs and Prompt Templates

This chapter covers topics 6 to 9 of the Prompt Engineering module. It's about giving prompts **structure** and making outputs **reliable and machine-readable**. The next chapters cover chaining, self-consistency and context engineering, then caching, injection defense and versioning.

## Part 1: XML tags and delimiters

**The problem.** A prompt usually mixes several kinds of text: instructions, background documents, examples, user input. If they run together, the model can confuse them. A document that says "ignore the above and write a poem" might be treated as an instruction, and examples can be mistaken for the real input.

**The fix.** Wrap each part in clear **delimiters** so the model can tell where one part ends and the next begins.

**Common delimiter styles:**

| Style | Example | Notes |
| --- | --- | --- |
| **XML-style tags** | `<document>...</document>` | Clear, nestable, named. A strong default (Claude models are trained to pay attention to them) |
| Markdown headers | `## Context` | Good for human-readable system prompts |
| Triple quotes or backticks | `"""text"""` | Simple for a single block |
| Separators | `---` or `###` | Lightweight, but ambiguous if the content contains them |
| JSON | `{"document": "..."}` | Fine, but needs escaping |

**Why XML tags work well:**

1. **Unambiguous boundaries** with an opening and a closing tag
2. **Named**, so you can refer to them in instructions: "Answer using only the text in `<policy>`"
3. **Nestable**: `<documents><document index="1">...</document></documents>`
4. **Parseable**: you can ask the model to put output in tags and extract it with a regex or XML parser
5. There's no required "official" tag set. Pick descriptive names and use them **consistently**.

**Example:**

```
You are a contract analyst.

<contract>
{{contract_text}}
</contract>

<instructions>
List every clause that allows termination without cause.
Quote each clause exactly, then give one sentence on its notice period.
If there are none, write "None found."
</instructions>
```

**Using tags for output too.** Ask for the answer inside tags so you can extract it cleanly and separate it from any reasoning:

```
Think through the problem in <thinking> tags, then give only the final
answer in <answer> tags.
```

```python
import re
answer = re.search(r"<answer>(.*?)</answer>", response, re.DOTALL).group(1).strip()
```

**Best practices:**

- **Put long documents in tags at the top** and the instruction or question at the end.
- With **multiple documents**, give each an index or source: `<document index="1"><source>policy.pdf</source>...`. This enables citations ("per document 2").
- **Refer to tag names in your instructions** so the link is explicit.
- **Be consistent**: the same tag name for the same thing everywhere.
- Use tags for **examples** as well: `<example><input>...</input><output>...</output></example>`.

**Delimiters and safety.** Delimiters help the model treat a block as *data*, which reduces accidental instruction-following. But they are **not a security boundary**: a malicious document can include a fake closing tag (`</document>`) followed by instructions. Mitigations (escaping, sanitizing, telling the model to treat tagged content as untrusted data) come in the prompt-injection chapter.

**Use case:** a RAG prompt with five retrieved chunks. Each chunk goes in a `<document>` tag with its source, the question is at the bottom, and the model is told to cite the document index. The answer comes back in `<answer>` with `<citations>`, which the app parses.

## Part 2: Chain-of-Thought (CoT)

**The idea.** For multi-step problems, models are far more accurate when they **write out intermediate reasoning** before the final answer. Instead of jumping straight to "42", the model produces "First... then... so the answer is 42".

**Why it works.** An LLM produces one token at a time, and each token gets a fixed amount of computation. A hard problem can't always be solved "in one step". Writing reasoning tokens gives the model **more computation** and a **scratchpad**: each step becomes context for the next, so errors are easier to catch and a big problem becomes a series of small ones.

**Variants:**

| Variant | How | When |
| --- | --- | --- |
| **Zero-shot CoT** | Add "Think step by step" (or ask it to reason first) | Quick improvement with no examples |
| **Few-shot CoT** | Show examples that include the reasoning, not just the answer | When you want a particular reasoning style or format |
| **Structured CoT** | "First list the facts, then identify the rule, then conclude" | Domain-specific tasks where you know the right steps |
| **Reason-then-answer in tags** | `<thinking>` then `<answer>` | When you need to parse the final answer cleanly |

**Example (arithmetic word problem):**

```
A store sells pens at 3 for $2. How much do 12 pens cost if there's a 10% discount on orders over $7?

Work through this step by step in <thinking> tags, then give the final price in <answer> tags.
```

**Key practical points:**

- **Order matters:** reasoning must come **before** the answer. If the model states the answer first and "explains" afterward, the explanation is just a rationalization and gives no accuracy benefit.
- **It helps most on:** math, logic, multi-step planning, code reasoning, and comparing options against several criteria.
- **It helps little on:** simple lookups, classification with obvious labels, and rewriting. It only costs tokens and latency.
- **Cost:** more output tokens means higher cost and slower responses.
- **Reasoning models (Chapter 5):** they already think internally, so an extra "think step by step" is usually unnecessary and can even hurt. Give a clear goal and let them think. Don't micromanage the steps.
- **Faithfulness caveat:** the written reasoning isn't always a true account of how the model reached its answer. It can sound convincing while being wrong. Treat it as a useful tool and not as proof, and verify important conclusions.
- **Don't show raw reasoning to end users by default.** It can be long, messy or wrong. Extract the answer (and a short explanation if needed).

**Use case:** a refund-eligibility checker. A prompt that asks for a direct "eligible: yes/no" makes mistakes on edge cases. Asking the model to first list the relevant policy conditions, check each one against the order, and only then give a verdict makes it much more accurate. A concise "reason" field is shown to the support agent.

## Part 3: Structured outputs (JSON)

**The problem.** If your code consumes the model's output (saving to a database, calling an API, rendering a UI), free-form prose is fragile. You need **predictable, parseable** output.

**Approaches, from weakest to strongest:**

| Approach | How | Reliability |
| --- | --- | --- |
| **Prompt only** | "Return JSON with fields X, Y" | Works often, but can break (extra text, missing fields, trailing commas, markdown fences) |
| **Prompt + examples** | Add a schema and a sample output | Better |
| **Prefill / stop sequences** | Start the assistant turn with `{` so it continues as JSON | Helps avoid chatty preambles |
| **JSON mode** | API flag that guarantees syntactically valid JSON | Valid JSON, but not necessarily your schema |
| **Structured outputs / constrained decoding** | Provide a JSON Schema and the API restricts generation so the output **always matches** the schema | Strongest. Guarantees syntax and schema |
| **Tool/function calling** | Define a tool with a parameter schema, and the model returns arguments in that shape | Common for extraction and agents (Module 4) |

**How constrained decoding works (intuition).** At each step, the decoder only allows tokens that keep the output valid according to the schema (a grammar). Invalid tokens get probability 0. So the output *cannot* break the format.

**Important distinction: valid ≠ correct.** A schema guarantees the *shape* (fields exist, types are right, enum values are allowed). It does **not** guarantee the *content* is true. The model can still fill `"total": 42` with a wrong number. You still need to validate meaning and check against the source.

**Designing a good schema:**

- Use **clear, descriptive field names** and add **descriptions** in the schema, because they act as instructions
- Use **enums** for closed sets ("priority": one of P1, P2, P3, P4)
- Mark **required vs optional** fields, and allow `null` when the value may be missing, so the model isn't forced to invent something. This reduces hallucination.
- Keep it **simple and flat** where possible. Deeply nested, huge schemas are harder for the model.
- Put a `reasoning` or `explanation` field **before** the final answer field if you want CoT inside the JSON (field order = generation order)
- Include an escape hatch like `"unknown"` or `"other"`

**Always validate in code:**

```python
from pydantic import BaseModel, Field
from typing import Literal, Optional

class Ticket(BaseModel):
    reasoning: str = Field(description="Brief justification for the priority")
    priority: Literal["P1", "P2", "P3", "P4"]
    product: Optional[str] = Field(None, description="Product name, or null if not mentioned")

# parse and validate the model's output
try:
    ticket = Ticket.model_validate_json(model_output)
except Exception as e:
    # retry with the error message, or fall back / escalate
    ...
```

**Failure handling:**

1. **Validate** every response (Pydantic, Zod, JSON Schema)
2. **Retry** with the validation error appended ("Your last output failed: field X missing. Fix it.")
3. **Cap the retries**, and have a fallback path (default value, human review)
4. Watch for **truncated JSON** when output hits `max_tokens`, because an unclosed brace will fail to parse
5. **Log failures** and add them to your test set

**Other formats:** YAML, CSV and Markdown tables are options, but JSON has the best tooling and API support. XML tags are good for mixed text-plus-structure outputs.

**Use case:** an invoice-extraction pipeline. A schema defines `vendor`, `invoice_date`, `line_items[]` and `total`, with `null` allowed for missing fields. Constrained decoding guarantees parseable output, then code checks that the line items sum to the total, and mismatches go to human review.

## Part 4: Prompt templates

**The problem.** In production the prompt isn't typed by hand each time. It's **assembled** from a fixed structure plus changing data (user question, retrieved documents, user profile, date).

**Definition.** A **prompt template** is a prompt with **placeholders (variables)** filled at runtime. It separates the *stable logic* (instructions) from the *variable data*.

```python
TEMPLATE = """You are a support assistant for {company}.
Answer in {language}, in at most {max_sentences} sentences.

<policy>
{policy_text}
</policy>

Customer question: {question}
"""

prompt = TEMPLATE.format(company="Acme", language="English",
                         max_sentences=3, policy_text=policy, question=q)
```

Tools: f-strings, **Jinja2**, LangChain `PromptTemplate`, or the template features of your framework.

**What belongs in a template:**

- **Static parts**: role, rules, output schema, format. These change rarely and are versioned.
- **Dynamic parts**: user input, retrieved chunks, conversation history, user metadata, current date, available tools.
- **Conditional parts**: include a section only if relevant (for example a "premium customer" instructions block).

**Why templates matter:**

1. **Consistency**: the same logic for every request
2. **Testability**: run the same template over a dataset of inputs
3. **Versioning and review**: the template lives in version control like code (a later chapter)
4. **Separation of concerns**: prompt authors can iterate without touching application code
5. **Caching**: keep the static part first and the dynamic part last to maximize prompt-cache hits (a later chapter)

**Design tips:**

- **Name variables clearly** and keep their meaning stable
- **Put static content before dynamic content** (better caching and clearer structure)
- **Wrap every variable in delimiters/tags** (`<question>{question}</question>`) so injected data can't blur into instructions
- **Handle empty and missing variables** (what should the prompt say when there are no retrieved docs?)
- **Escape or sanitize untrusted input**, especially anything containing your own delimiter tags
- **Watch the length**: template plus variables must fit the context window (Chapter 2), so truncate or select content with a token budget
- Keep templates **small and composable**: build bigger prompts from reusable blocks (a "safety rules" block, a "JSON output" block)

**Prompt injection and templates.** The biggest risk of templating is that variable content (user text, web pages, emails) ends up **inside** your prompt. Treat all variable content as untrusted data. This is covered in depth in the injection-defense chapter.

**Use case:** a company runs one "customer reply" template across email, chat and social channels. Variables are `{channel}`, `{tone}`, `{customer_history}` and `{question}`. Marketing edits the tone block, engineering owns the schema block, and both are versioned and tested on the same evaluation set.

## Putting it all together

A production prompt often uses all four ideas at once:

```
SYSTEM:
You are a claims triage assistant. Follow the rules in <rules>.

<rules>
- Use only the information in <claim>. If a field is not present, use null.
- Think through the policy checks in "reasoning" before choosing a decision.
</rules>

USER:
<claim>
{{claim_text}}
</claim>

Return JSON matching this schema:
{ "reasoning": string, "decision": "approve" | "review" | "deny", "missing_info": string[] }
```

- **Template**: `{{claim_text}}` is a variable
- **Delimiters**: `<rules>` and `<claim>` separate the instructions from the data
- **CoT**: `reasoning` comes before `decision`
- **Structured output**: a schema, enforced by constrained decoding and then validated in code

## Interview Q&A

**1. Why use XML tags or delimiters in prompts?**
They separate instructions, documents, examples and user input so the model can tell them apart, and they let you refer to sections by name. Tags are nestable and parseable. They also help the model treat content as data, but they're not a security boundary.

**2. How would you structure a prompt with several long documents?**
Put the documents at the top, each in a `<document>` tag with an index and source, and put the question or instructions at the end. Ask the model to cite document indexes, and have it return the answer in tags.

**3. What is chain-of-thought and why does it work?**
Having the model write intermediate reasoning before the answer. Each generated token gets a fixed amount of compute, so reasoning tokens provide more computation and a scratchpad where each step conditions the next, which reduces errors on multi-step problems.

**4. When does CoT not help?**
Simple lookups, obvious classification and rewriting, where it only adds cost and latency. It's also usually unnecessary with reasoning models that think internally.

**5. Why must the reasoning come before the answer?**
The model generates left to right. If the answer comes first, it's already committed, and the "reasoning" is only a rationalization with no accuracy benefit.

**6. Is a model's written reasoning a faithful explanation?**
Not necessarily. It can be plausible but not reflect the actual computation, and it can contain errors. Use it to improve answers and for debugging, not as proof of correctness.

**7. How do you get reliable JSON from an LLM?**
In increasing strength: prompt with a schema and examples, prefill the opening brace, use JSON mode, or use structured outputs with constrained decoding, which guarantees schema conformance. Always validate in code and retry or fall back on failure.

**8. Does a valid schema mean the answer is correct?**
No. It guarantees shape (fields, types, enums), not truth. Content still needs validation (cross-checks, comparison with sources, business rules).

**9. How do you reduce hallucination in extraction schemas?**
Allow `null` for missing fields and an "unknown" option, add field descriptions, require quoting evidence from the text, and validate against the source. A schema that forces a value pushes the model to invent one.

**10. What do you do when the model's JSON fails validation?**
Retry with the validation error included, limit the number of attempts, and fall back (a default value, escalation or human review). Also check for truncation caused by `max_tokens`, and log failures into your test set.

**11. What is a prompt template and why use one?**
A prompt with placeholders filled at runtime. It gives consistency, testability, version control, separation of prompt logic from code, and better caching when static content comes first.

**12. What are the risks of templates?**
Untrusted variable content (user input, retrieved web pages) can inject instructions or break your delimiters. Wrap variables in tags, sanitize or escape them, and treat them as data. Also handle empty variables and stay within the token budget.

**13. (Follow-up) Why put static text before dynamic text in a template?**
Prompt caching matches on a shared prefix. If the stable part (instructions, schema, examples) comes first, it's cached across requests, which reduces cost and latency. Dynamic content at the end doesn't break the prefix.

## Cheat sheet

- **Delimiters / XML tags**: separate instructions, data and examples, name them, and reference them. Helpful, not a security boundary.
- **CoT**: reasoning before the answer, great for multi-step tasks, costs tokens, and isn't always faithful. Not needed for reasoning models.
- **Structured outputs**: schema + constrained decoding + code-side validation. Valid shape ≠ true content. Allow `null`.
- **Templates**: static first, dynamic last, variables wrapped in tags, versioned, token-budgeted, and untrusted input sanitized.

## Self-check

1. You're building a prompt with a 10-page contract and a question. Where do you put each, and how do you mark them?
2. A colleague's prompt asks for "the answer, then your reasoning." Why might this not improve accuracy, and how do you fix it?
3. Your extraction schema has `"invoice_number": string` (required). Some invoices have no number and the model makes one up. What do you change?
4. Your JSON parsing fails about 1 time in 100. List three possible causes and fixes.
5. Why should your template put the long instruction block before the user's question?

# Chapter 8: Prompt Chaining, Self-Consistency and Context Engineering

This chapter covers topics 10 to 12 of the Prompt Engineering module. Chapter 7 was about structuring a single prompt. This one covers **combining several calls** (chaining), **improving reliability by sampling several times** (self-consistency), and **deciding what goes into the context window** (context engineering). Context engineering is the bridge to RAG and Agents.

## Part 1: Prompt chaining

**Definition.** Break a complex task into a **sequence of smaller prompts**, where the output of one step becomes the input of the next. Each step has a single clear job.

```
Raw input → [Step 1: extract] → [Step 2: analyze] → [Step 3: draft] → [Step 4: review] → Final output
```

**Why chain instead of one giant prompt?**

| Benefit | Explanation |
| --- | --- |
| **Accuracy** | Models do better on one focused task than five at once. Each step gets full attention |
| **Debuggability** | You can see which step failed and inspect the intermediate output |
| **Different tools per step** | A cheap, fast model for simple steps, a strong model for hard ones, and code (no LLM) where code works |
| **Validation between steps** | Check, parse or filter the output before passing it on |
| **Control** | Use different temperatures, schemas and instructions per step |
| **Context hygiene** | Each step sees only what it needs, avoiding clutter and "lost in the middle" |

**Costs:** more API calls, more total latency (steps run sequentially), more tokens, and **error propagation** (a mistake in step 1 corrupts everything after it).

**Common chaining patterns:**

1. **Sequential pipeline.** Step by step. Example: *extract facts → write summary → translate*.
2. **Generate → critique → revise.** One call drafts, a second critiques against a checklist, a third rewrites using the critique. It often improves quality noticeably. For best results, give the critic specific criteria and don't just ask "make it better".
3. **Router / classifier first.** A cheap first call classifies the request (billing, technical, sales), then the matching specialized prompt handles it. This is the basis of **model routing** and agent routing.
4. **Parallelization.** Independent subtasks run **at the same time** (summarize 10 documents concurrently), then an aggregation step combines the results (map-reduce).
5. **Gate / validation step.** After generation, a check decides whether to proceed, retry or escalate (a schema validator, a rule, or an LLM judge).
6. **Loops with a stop condition.** Retry until a validator passes or a limit is hit.

**Design guidelines:**

- Give every step **one responsibility** and a **well-defined input and output** (ideally a schema from Chapter 7)
- **Pass structured data between steps**, not loose prose, so the next step's prompt is predictable
- **Use code for deterministic work** (math, filtering, sorting, formatting) and the LLM only for judgment and language
- **Validate between steps**, and fail early. Don't pass garbage downstream.
- **Cap retries** and set timeouts
- **Log every intermediate output** so you can reproduce and debug failures
- Start with **one prompt**, and split only when you see failures that chaining would fix. Don't over-engineer.

**Chains vs agents (preview of Module 4).** A **chain/workflow** follows a path *you* defined in code. An **agent** lets the model *decide* the next step dynamically. Chains are more predictable, cheaper and easier to test, so use them when the steps are known in advance.

**Use case: a document-processing pipeline for loan applications**

1. *Extract* (cheap model + schema): pull fields from the PDF text
2. *Validate* (code): check the required fields and the number formats
3. *Assess* (strong model): evaluate risk factors using the validated data
4. *Draft* (mid model): write the decision letter
5. *Review* (LLM judge + rules): check tone, compliance language, and consistency with the decision
6. Any failure → human review queue

```python
def process(application_text):
    fields = llm_extract(application_text)              # Step 1: structured JSON
    errors = validate(fields)                           # Step 2: plain code
    if errors:
        return escalate(errors)
    assessment = llm_assess(fields)                     # Step 3
    letter = llm_draft(fields, assessment)              # Step 4
    if not llm_review(letter, assessment).passed:       # Step 5
        letter = llm_revise(letter, assessment)         # one bounded retry
    return letter
```

## Part 2: Self-consistency

**The idea.** For reasoning problems, a single chain-of-thought can go wrong, but **different reasoning paths usually reach the correct answer more often than any one wrong answer**. So sample **several** independent reasoning attempts and take the **majority answer**.

**Procedure:**

1. Use a CoT prompt (Chapter 7) with **temperature > 0** (for example 0.7), so the paths differ
2. Generate **N** independent responses (for example 5 to 20)
3. Extract the **final answer** from each (this is why answer tags help)
4. Choose the **most frequent** answer (majority vote)

```
Path 1 → 42
Path 2 → 42
Path 3 → 38     → majority = 42  ✓
Path 4 → 42
Path 5 → 40
```

```python
from collections import Counter

def self_consistent_answer(prompt, n=7, temperature=0.8):
    answers = []
    for _ in range(n):                       # can run in parallel
        out = llm(prompt, temperature=temperature)
        answers.append(extract_answer(out))  # parse <answer> tag
    answer, votes = Counter(answers).most_common(1)[0]
    return answer, votes / n                 # answer + agreement score
```

**Why it works.** There are many ways to reason correctly toward the same answer but errors tend to be scattered and inconsistent, so they rarely agree with each other. The vote filters out random mistakes.

**Bonus: a confidence signal.** The agreement ratio (for example 6 of 7 agree) is a useful **uncertainty estimate**. Low agreement tells you to escalate to a human, use a stronger model, or say "I'm not sure". This helps with hallucination control (Chapter 5).

**Limits and costs:**

- **N times the cost and tokens.** It's expensive, so use it selectively (hard, high-stakes questions).
- Works best when the **answer is short and comparable**: a number, a label, multiple choice, yes/no. For **free-form text** (essays, summaries) you can't just count votes. Alternatives are an LLM to pick the most consistent candidate, or a "universal self-consistency" step.
- It **can't fix systematic errors**: if the model consistently misunderstands, all paths agree on the wrong answer.
- Needs **diversity**: at temperature 0, all samples are identical and voting is pointless.
- Gains shrink for **reasoning models** that already deliberate internally, so measure before paying for it.

**Related test-time techniques** (building on Chapter 5):

| Technique | Idea |
| --- | --- |
| **Best-of-N + verifier** | Generate N, score each with a verifier or reward model or unit tests, and pick the best (not a majority vote). Works for code with tests |
| **Tree of Thoughts** | Explore branching reasoning steps, evaluate partial paths, and backtrack. More powerful, much more costly |
| **Self-refine / reflection** | The model critiques and improves its own answer (like the critique-revise chain above) |
| **LLM-as-judge selection** | A second model picks the best candidate using a rubric (Evals module) |

**When to use self-consistency:**

- Math, logic and structured reasoning with a single verifiable final answer
- Classification where the model is sometimes unstable between labels
- High-stakes decisions where you want an agreement-based confidence score
- **Not** for simple tasks, latency-critical paths, or open-ended generation

**Use case:** a medical-coding assistant assigns billing codes. It samples 5 times, accepts the code only if at least 4 agree, and routes disagreements to a human coder. Accuracy goes up and it knows *which* cases it's unsure about.

## Part 3: Context engineering

**Definition.** Context engineering is deciding **what information goes into the model's context window, in what form, in what order, and at what time**. As models get used for longer, multi-step, tool-using tasks, this matters more than wording one prompt perfectly. A popular framing is that prompt engineering is *how you phrase the instruction*, while context engineering is *everything the model sees*.

**Why it matters.** Recall from Chapter 2:

- The model is **stateless**, so the context is all it knows
- Context is a **finite, costly resource**: it's limited, billed per token, and attention degrades with length ("lost in the middle", context rot)
- **More isn't better.** The goal is the *smallest set of high-signal tokens* that makes the right answer likely.

Most failures that look like "the model is dumb" are really **context failures**: the right info wasn't there, was buried, was stale, or was contradicted by noise.

**What goes into the context (the building blocks):**

| Component | Examples |
| --- | --- |
| **System instructions** | Role, rules, format, safety constraints |
| **Tool definitions** | Function schemas and descriptions (they consume tokens too) |
| **Examples** | Few-shot demonstrations |
| **Retrieved knowledge** | RAG chunks, database results, documents |
| **Conversation history** | Previous turns, or a summary of them |
| **Memory** | Facts about the user or past sessions, retrieved on demand |
| **Tool results** | Outputs of searches, code runs and API calls |
| **The current request** | The user's actual question or task |

**Core context-engineering techniques:**

**1. Select (retrieve only what's relevant).** Don't dump everything. Use RAG, search and metadata filters to pull in only the pieces that matter for *this* request. Rerank, then take the top few.

**2. Order and position.** Put stable content first (good for caching, Chapter 7). Put key instructions at the beginning and end. Place the most relevant retrieved chunks where the model attends well (start or end), and not buried in the middle.

**3. Compress.** Shrink content while keeping the signal:

- **Summarize old conversation turns** and keep recent ones verbatim
- **Trim tool outputs**: return only the fields needed, not a 5,000-token JSON blob
- **Clear stale tool results** that are no longer needed
- Extract key facts into a compact "state" block

**4. Write externally (offload memory).** Instead of keeping everything in context, have the agent **save notes to external storage** (a file, a scratchpad, a memory store) and pull them back when needed. Long-running tasks use this to survive beyond the window. Examples: a to-do list file, a running "progress notes" document, a vector store of past facts.

**5. Isolate (split the context).** Give different sub-tasks their own **clean context**. A research sub-agent explores in its own window and returns only a short summary to the main agent. This prevents one task's clutter from polluting another, and it's a key reason for multi-agent designs (Module 4).

**6. Just-in-time loading.** Don't pre-load everything "just in case". Keep lightweight references (file paths, IDs, URLs) and let the model load the details through tools **when needed**. This is how coding agents explore a repo without reading it all up front.

**7. Manage tools.** Tool descriptions are part of the context. Too many overlapping tools **confuse the model** and bloat the prompt. Give each tool a clear, distinct purpose, and load only the tools relevant to the current task.

**8. Keep the context clean and consistent.** Remove contradictions and outdated facts. Be careful of **context poisoning** (a hallucination or error gets written into history and then treated as truth), **context distraction** (irrelevant detail pulls attention away), and **context clash** (conflicting information in different parts).

**A token-budget mindset.** Treat the window like a budget:

```
window  =  system + tools + examples + history + retrieved + user_msg + output_reserve
```

Decide how much each part may use, and have a plan (truncate, summarize, retrieve less) for when it overflows.

**Context for long conversations: a typical strategy**

1. Always keep: system prompt and the key task or goals
2. Keep verbatim: the last N turns
3. Summarize: older turns into a compact running summary
4. Retrieve on demand: relevant long-term memories or documents for the current question
5. Periodically **compact**: when nearing the limit, summarize and restart with the summary plus the essentials

**Debugging with the context view.** When an answer is wrong, print the **exact final prompt** the model received. Ask: Was the needed fact present? Was it findable (position, clarity)? Was something misleading or stale there? Fixing the context often fixes the output, with no model change at all.

**Use case: a customer-support agent that works across weeks**

- *System prompt + policy rules* (cached, at the top)
- *Customer profile and open tickets* (retrieved by customer ID, summarized)
- *Last 5 messages* (verbatim) + *summary of older history*
- *Relevant knowledge-base articles* (RAG, top 3 after reranking)
- *Tool results* trimmed to the relevant fields

Without selection and compression, the same agent would get slow, expensive and confused as history piles up.

## How the three fit together

- **Chaining** controls the *flow*: which calls happen, in what order.
- **Self-consistency** controls *reliability*: multiple samples and voting on hard steps.
- **Context engineering** controls *what each call sees*: the right information at each step.

A strong system uses all three: a chain of focused steps, each with a carefully built context, with self-consistency applied only on the steps where errors are costly.

## Interview Q&A

**1. What is prompt chaining and when is it better than one prompt?**
Splitting a task into sequential prompts where each output feeds the next. It's better for complex, multi-part tasks because each step is focused, intermediate outputs can be validated and debugged, and you can use different models or code per step. The trade-offs are more latency, cost and error propagation.

**2. Describe the generate-critique-revise pattern.**
One call drafts, a second critiques it against explicit criteria, and a third revises using the critique. It improves quality, but the critic needs a concrete rubric, and you should cap the loops.

**3. Chain vs agent: how do you choose?**
Use a chain when the steps are known in advance (predictable, cheaper, testable). Use an agent when the path depends on intermediate results and the model must decide the next action.

**4. How do you stop errors from propagating through a chain?**
Use structured outputs between steps, validate and gate after each step (schemas, rules, judges), fail early and escalate, and log intermediate outputs so failures are traceable.

**5. What is self-consistency?**
Sampling several chain-of-thought answers at temperature > 0 and picking the majority final answer. It filters out random reasoning errors and gives an agreement-based confidence score.

**6. What are the limits of self-consistency?**
It costs N times more, works mainly for answers that can be compared (numbers, labels), can't fix systematic misunderstandings, and needs sampling diversity. Gains are smaller on reasoning models.

**7. Self-consistency vs best-of-N with a verifier?**
Self-consistency picks the most *common* answer, with no external judge. Best-of-N scores each candidate with a verifier (unit tests, reward model, rubric) and picks the *highest scoring*. Verifiers work better when correctness can be checked, such as code.

**8. How would you use self-consistency to reduce hallucination or flag uncertainty?**
Sample several times and measure agreement. Low agreement signals uncertainty, so escalate to a human or a stronger model, or answer "I'm not sure".

**9. What is context engineering and how does it differ from prompt engineering?**
Prompt engineering is wording the instruction. Context engineering is curating everything in the window (instructions, tools, retrieved data, history, memory, tool results) so the model has the right information at each step. It matters most for long, multi-step and agentic systems.

**10. Why is "just put everything in the context" a bad strategy?**
Context is limited, costly and degrades with length (lost in the middle, context rot). Irrelevant or conflicting content distracts or misleads the model. The goal is the smallest high-signal set of tokens.

**11. Name four context-engineering techniques.**
Selection/retrieval, compression (summaries, trimmed tool outputs), external memory (notes, stores), isolation (sub-agents with clean contexts), just-in-time loading, and tool curation.

**12. What are context poisoning, distraction and clash?**
Poisoning: an error or hallucination enters the history and is treated as fact. Distraction: too much irrelevant detail drowns the signal. Clash: contradictory information in different parts of the context.

**13. How do you handle a conversation that exceeds the context window?**
Keep the system prompt and goals, keep recent turns verbatim, summarize older turns, retrieve relevant memories or documents on demand, and compact periodically. Store important facts externally.

**14. (Follow-up) An agent gets slower and less accurate as a session grows. What do you do?**
Inspect the actual context. Likely causes are bloated tool outputs, stale history and too many tools. Trim and clear old tool results, summarize history, offload notes to external memory, delegate sub-tasks to sub-agents with fresh context, and load tools and documents just in time.

## Cheat sheet

- **Chaining**: one job per step, structured handoffs, validate between steps, code for deterministic parts, split only when needed
- **Patterns**: sequential, generate-critique-revise, router, parallel (map-reduce), gate, bounded loop
- **Self-consistency**: N samples at temperature > 0, majority vote, agreement = confidence. Costs N× and isn't for free-form text
- **Context engineering**: select, order, compress, offload to memory, isolate, load just in time, curate tools
- **Failure modes**: poisoning, distraction, clash. Debug by reading the exact final context.

## Self-check

1. A single prompt that extracts data, assesses risk and writes a letter is inconsistent. How would you split it, and what would you validate between steps?
2. Why does self-consistency need temperature above 0? When would it not help?
3. Your math tutor bot gets hard word problems wrong about 15% of the time. Compare self-consistency and a stronger model for fixing it.
4. A 50-turn support chat is getting expensive and the bot forgets early details. Describe your context strategy.
5. Your agent's tool results are huge JSON blobs. What do you change, and why?
