# Chapter 20: Human Evaluation, Pairwise Comparisons, Faithfulness and Groundedness, and Retrieval Metrics (Recall@K)

This chapter covers where humans fit in evaluation, how to compare two systems directly, how to measure hallucination in RAG, and the metrics for retrieval quality.

## Part 1: Human evaluation

**Role.** Humans are the **ground truth** that automated evals are calibrated against. They're slow, expensive and not infinitely scalable, so use them where they add the most value.

**When humans are essential:**

- **Calibrating and validating LLM judges** (Chapter 19)
- **Defining quality** at the start (rubric development, error analysis)
- **Subjective, high-stakes or domain-specific** judgments (medical, legal, brand voice, creativity)
- **Final launch checks** and periodic audits of production quality
- **Spotting what metrics miss**: new failure modes, issues of taste, cultural nuance
- **Safety review** and red-team analysis

**Who evaluates:**

| Evaluator | Strengths | Weaknesses |
| --- | --- | --- |
| **Domain experts** | Catch subtle correctness errors | Expensive, scarce |
| **Trained annotators** | Consistent with good guidelines, scalable | Need training and QA, limited domain depth |
| **Crowd workers** | Cheap, fast, large scale | Variable quality, needs strong quality control |
| **End users** | Real preferences, real context | Feedback is sparse, biased and noisy (thumbs up and down) |
| **Developers / product team** | Fast iteration, context-rich | Biased toward their own system, "dogfooding" blind spots |

**Setting it up well:**

1. **Clear rubric and guidelines** with examples of borderline cases (Chapter 19)
2. **Training and calibration rounds:** annotators label the same items, you discuss disagreements, then refine the guidelines
3. **Simple tasks:** binary or small-scale judgments, with one criterion per question. Annotator fatigue grows with complexity.
4. **Annotation interface** that shows the input, output, context and metadata, and records a short rationale
5. **Randomize** the order and hide which system produced which output (**blind evaluation**)
6. **Multiple annotators per item** (2 to 3), with adjudication for disagreements
7. **Quality control:** insert **gold items** with known answers to detect careless annotators, and monitor each annotator's agreement
8. **Sample sensibly:** stratify by tags, difficulty, and segments, and oversample failure-prone areas
9. **Pay and treat annotators fairly**, and protect them from harmful content with appropriate safeguards (for toxic or distressing material)
10. Handle **privacy** (anonymize and restrict access to user data)

**Measuring annotator agreement:**

- **Percent agreement:** simple but inflated by chance
- **Cohen's kappa** (two raters) and **Fleiss' kappa / Krippendorff's alpha** (several raters): correct for chance agreement. As a rough guide, below about 0.4 means weak agreement (fix the rubric), 0.6 to 0.8 is substantial, and above 0.8 is strong.
- Low agreement usually means the **task or guidelines are ambiguous**, which is a useful finding in itself. Don't just average noisy labels.

**Types of human feedback:**

- **Absolute ratings** (pass or fail, or a 1 to 3 scale): good for tracking over time
- **Pairwise preferences** (A versus B): more reliable for subjective qualities (next part)
- **Error annotation:** tagging failure types and spans (a hallucinated sentence, a wrong number), which feeds error analysis
- **Corrections / edits:** the human rewrites the answer, which creates gold references and training data
- **Free-text notes:** the richest signal for discovering new issues

**Implicit and online human signals:**

- Thumbs up and down, ratings (sparse, skewed toward extremes)
- **Behavioral signals:** copying the answer, acceptance rate of suggestions, edits made, retries or rephrasings, abandonment, escalation to a human, follow-up questions, time to resolution
- These are **noisy and biased** (people don't give feedback uniformly), so use them as **signals to sample from** and for A/B tests (Chapter 21), not as pure ground truth

**Cost control:** use automated checks to filter, then have humans review **uncertain, disputed or high-impact cases**, a **stratified sample** (for example 50 to 100 per release), and judge-vs-human disagreements. Active-learning style sampling (items where the judge is least confident) gives more information per label.

**Limits and biases:** annotators also have biases (length, style, fluency over correctness), fatigue, anchoring on the first example, and domain gaps. Humans can be fooled by confident but wrong answers, so **fact-checking tasks need references or experts**.

**Use case:** before launching a medical-information assistant, two clinicians blind-review 150 stratified answers using a 5-item rubric. Kappa is 0.78 after one calibration round. Their labels become the reference for validating an LLM judge, which then runs on production samples, with 5% of runs going back to clinicians each week.

## Part 2: Pairwise comparisons

**Definition.** Instead of scoring an output in isolation, show an evaluator **two outputs (A and B) for the same input** and ask **which is better** (or tie). The evaluator can be a human or an LLM judge.

**Why pairwise:**

- **Easier and more reliable than absolute scoring** for subjective qualities. People struggle to say "this is a 7 out of 10" but easily say "this one is better".
- **Directly answers the decision question:** "should we ship the new version?"
- Reduces **scale calibration problems** (different raters use scales differently)
- Good for **comparing models, prompts, or system versions**, and for building **preference data** for tuning (DPO and RLHF, Chapter 3)

**Setting it up:**

1. Take a set of **representative inputs**
2. Generate outputs from system A (baseline) and system B (candidate)
3. **Randomize which output is shown first**, and hide system identities
4. Ask a **specific question** ("Which answer is more accurate and better follows the policy?"), not just "which is better?"
5. Allow **ties** (and "both bad")
6. Collect from several raters (or run a judge in both orders), then aggregate

**Analysis:**

- **Win rate:** fraction of comparisons B beats A (count ties as half or report separately). A 50% win rate means no difference.
- **Statistical significance:** with n comparisons, win-rate uncertainty is about ±1/√n at the extremes, so for a 95% interval on a 50% win rate, roughly ±1.96·√(0.25/n). With 100 comparisons that is about ±10 points, so **you need a few hundred comparisons to detect small gains**. Use a binomial or sign test or a bootstrap confidence interval.
- **Slice by tags** (does B win on short questions but lose on long ones?)

```python
import math

def win_rate_ci(wins, losses, ties=0, z=1.96):
    n = wins + losses + ties
    p = (wins + 0.5 * ties) / n
    half = z * math.sqrt(p * (1 - p) / n)
    return p, (p - half, p + half)
```

**Ranking many systems: Elo and Bradley-Terry.** With many models or versions, pairwise outcomes can be fitted with **Bradley-Terry** (or Elo-style ratings) to produce a ranking with uncertainty. Public arenas use this idea with human votes. For your own use, a head-to-head against the current production version is usually the most useful comparison.

**LLM judges for pairwise comparison** (see biases in Chapter 19):

- **Position bias is strong**, so **evaluate both orders** (A,B and B,A). Count a win only if the judge is consistent, otherwise count a tie.
- **Verbosity bias:** longer answers win. Instruct the judge to ignore length, or control for it with length-matched comparisons or a length penalty.
- **Self-preference:** use a different family of models as the judge.
- Provide the **rubric** and, where relevant, **reference answers or context**.
- Ask for **reasoning before the verdict**, and parse structured output.
- **Validate against human preferences** on a sample (agreement rate, as in Chapter 19).

**Limitations:**

- **Relative only:** it tells you B beats A, not whether either is good enough. Pair it with absolute rubric checks and thresholds.
- **Doesn't diagnose why**, so add reasons or criterion-level comparisons
- **Cost scales with the number of pairs** and comparisons among many systems
- **Intransitivity** can occur (A beats B, B beats C, C beats A) with mixed criteria
- Humans and judges can prefer **style over substance**
- **Distribution matters:** win rates on your eval set may not hold on production traffic

**When to use pairwise versus absolute:**

| Situation | Prefer |
| --- | --- |
| Deciding between two versions or models | Pairwise |
| Subjective qualities (tone, style, helpfulness, summaries) | Pairwise |
| Tracking quality over time against a fixed bar | Absolute rubric scores |
| Hard requirements (format, safety, correctness) | Deterministic checks and absolute criteria |
| Building preference data for DPO or RLHF | Pairwise |

**Use case:** a team tests a new summarization prompt against the current one on 300 inputs. A validated judge, run in both orders, gives B a 61% win rate (CI 55 to 67%), and a length-controlled analysis shows it's not only longer. Humans spot-check 50 pairs and agree 84% of the time. They ship B as a 10% canary.

## Part 3: Faithfulness and groundedness

**Definitions** (often used interchangeably, with slightly different emphasis):

- **Faithfulness:** whether the answer's claims are **supported by the provided source context** (the retrieved chunks or the document). It measures *consistency with the given context*, not with the real world.
- **Groundedness:** whether the answer is **anchored in evidence**: every claim traceable to a source. It's the broader idea and includes citation support.
- **Factuality / correctness** is different: whether the statement is **true in the real world**.

**Why the distinction matters.** An answer can be **faithful but wrong** (the context was outdated or wrong), and **unfaithful but true** (the model added a true fact from its own memory that isn't in your sources). In RAG, you usually *want* the answer to be faithful to your documents, because those are your source of truth, so unsupported additions, even true ones, are failures for auditability and policy reasons.

**This is the hallucination metric for RAG** (Chapter 5 and Chapter 13).

**Types of unfaithfulness:**

- **Contradiction:** the answer says the opposite of the context
- **Fabrication / unsupported claim:** adds facts not in the context
- **Overgeneralization or distortion:** slightly changes numbers, scope, conditions ("up to 30 days" becomes "30 days")
- **Merging errors:** combines two chunks into a false statement
- **Citation errors:** cites a source that doesn't support the claim

### How to measure

**1. Claim decomposition + verification (the standard approach):**

1. **Split the answer into atomic claims** (an LLM extracts them: "Electronics can be returned within 30 days", "Original packaging is required")
2. For each claim, **check whether the context supports it**: supported, contradicted, or not found. This is a **natural language inference (NLI)** or entailment task, performed by an LLM judge or an NLI model.
3. **Faithfulness score = supported claims / total claims.**

```
Answer: "You can return electronics within 30 days if they're in original packaging."
Claims:
 1. Electronics can be returned within 30 days.       → supported (policy sec 3)
 2. They must be in original packaging.               → supported (policy sec 3)
Faithfulness = 2/2 = 1.0
```

**2. Whole-answer judge:** a single binary verdict ("is every claim supported?"). It's simpler and less granular, and is useful as a strict **pass or fail** gate.

**3. NLI models / specialized classifiers** (for example entailment models, hallucination-detection models): cheaper and faster than LLM judges at scale, and they must be validated on your domain.

**4. Citation-level checks (deterministic, Chapter 13):** cited IDs exist, quotes appear verbatim, and (with a judge) the cited passage supports the claim. Report **citation precision** (fraction of citations that support their claim) and **citation recall** (fraction of claims that have a supporting citation).

**5. Sampling consistency (SelfCheck-style):** sample multiple answers and check whether claims are consistent across them. Inconsistent claims are likely hallucinated. Costly, and useful when there's no context to check against.

**Related RAG metrics (the "RAG triad"):**

| Metric | Question | Needs |
| --- | --- | --- |
| **Context relevance / precision** | Is the retrieved context relevant to the question? | Question and context |
| **Faithfulness / groundedness** | Is the answer supported by the context? | Context and answer |
| **Answer relevance** | Does the answer address the question? | Question and answer |

Using the three together shows *which stage* failed: bad context relevance means retrieval, low faithfulness means generation, low answer relevance means the model went off-task.

**Practical guidance:**

- **Use strict criteria and define "supported"** carefully: does a paraphrase count? Does a reasonable inference count? (Decide and document in the rubric.)
- **Give the judge only the retrieved context** that the model saw (not extra documents), or you'll measure the wrong thing
- **Handle abstentions:** "I don't have that information" is faithful (nothing unsupported was claimed). Measure **abstention correctness** separately: did it abstain when the answer was truly absent (good), and did it abstain when the answer *was* present (bad, a retrieval or generation failure)?
- **Validate the judge** against human labels, **on your domain**, particularly on subtle cases (numbers, negations, conditions)
- **Report per-claim and per-answer** rates, since a single unsupported sentence in a long answer can matter a lot in regulated domains
- **Use a threshold:** for example, fail any answer with an unsupported claim in safety-critical settings
- **Pair with correctness evals**, because faithful-to-wrong-context is still wrong
- **Mitigation loop:** low faithfulness leads to better prompts (quote-then-answer, "only use the context"), lower temperature, better retrieval, smaller and cleaner context, claim-level verification before responding, or abstention

**Use case:** a legal research assistant's answers are decomposed into claims, and each claim is checked against the retrieved case text. Any answer with an unsupported claim is blocked or flagged, and the claim-level results show hallucinations mostly arise when the retrieval step returns near-duplicates of different case versions, so the fix is in retrieval.

## Part 4: Retrieval metrics (Recall@K and friends)

(The basics appeared in Chapter 13. Here is the detailed treatment.)

**Why evaluate retrieval separately:** the generator can't use what isn't retrieved. If recall is low, no prompt will fix the answers.

**Setup:** for each test query, you need **relevance labels**: which documents or chunks truly contain the answer (binary, or graded 0 to 3). Sources: expert labels, click and citation logs, or synthetic queries generated from known chunks (validate them).

### Core metrics

Let *k* be the number of retrieved results considered, and *R* the set of relevant items for a query.

| Metric | Definition | Interpretation |
| --- | --- | --- |
| **Recall@k** | `\|retrieved@k ∩ R\| / \|R\|` | What fraction of the relevant items did we find in the top k? **The most important for RAG** |
| **Precision@k** | `\|retrieved@k ∩ R\| / k` | What fraction of the top k is relevant? (noise level) |
| **Hit rate@k (Success@k)** | 1 if at least one relevant item is in the top k | Did we get *something* useful? Great when only one chunk is needed |
| **MRR** | Mean of `1 / rank of first relevant item` | How high is the first relevant hit? |
| **MAP** | Mean over queries of average precision | Rewards ranking all relevant items early |
| **nDCG@k** | Discounted cumulative gain normalized by the ideal ranking | Handles **graded relevance** and position (higher is better) |
| **F1@k** | Harmonic mean of precision and recall | A single balance number (less common for RAG) |

**Worked example:** a query has 2 relevant chunks (C3, C9). Retrieved top 5: [C1, C3, C7, C9, C2].

- Recall@5 = 2/2 = **1.0**. Recall@3 = 1/2 = **0.5** (only C3 in the top 3).
- Precision@5 = 2/5 = **0.4**.
- MRR = 1/2 = **0.5** (first relevant at rank 2).
- Hit@1 = 0.

**nDCG intuition:** `DCG@k = Σ rel_i / log2(i + 1)`, so relevant results at lower ranks count less. Divide by the DCG of the perfect ordering to get a score from 0 to 1.

```python
import math

def recall_at_k(retrieved, relevant, k):
    return len(set(retrieved[:k]) & set(relevant)) / len(relevant)

def precision_at_k(retrieved, relevant, k):
    return len(set(retrieved[:k]) & set(relevant)) / k

def mrr(retrieved, relevant):
    for i, d in enumerate(retrieved, 1):
        if d in relevant:
            return 1 / i
    return 0.0

def ndcg_at_k(retrieved, rel_grades, k):          # rel_grades: {doc_id: grade}
    dcg  = sum(rel_grades.get(d, 0) / math.log2(i + 1) for i, d in enumerate(retrieved[:k], 1))
    ideal = sorted(rel_grades.values(), reverse=True)[:k]
    idcg = sum(g / math.log2(i + 1) for i, g in enumerate(ideal, 1))
    return dcg / idcg if idcg else 0.0
```

### Choosing and using metrics for RAG

- **First-stage retrieval (candidate generation):** optimize **Recall@k with a larger k** (for example Recall@50 or @100). You want the right chunk *somewhere* in the candidates, because a reranker can fix the ordering later.
- **After reranking / what goes to the LLM:** look at **precision, MRR and nDCG at the final k** (for example 5). You want the best chunks first and little noise.
- **Single-answer questions:** **Hit rate@k and MRR**. **Multi-fact or multi-hop questions:** **Recall@k** over all required chunks.
- **Choose k to match your prompt budget:** if you send 5 chunks to the LLM, Recall@5 is the number that matters most for end-to-end quality.
- **Recall vs precision trade-off:** increasing k raises recall but lowers precision and adds noise and cost. Plot the curve.
- Always slice by **query type** (exact-ID versus paraphrase versus multi-hop), since averages hide weaknesses (for example hybrid search improves exact-ID queries).

**Caveats:**

- **Incomplete labels:** often several chunks could answer the question and you labeled only one, which **underestimates** real performance. Mitigate with document-level relevance, several acceptable chunks, or an LLM-judged "context recall" (whether the retrieved context contains the information needed for the reference answer).
- **Chunking changes the unit:** if you re-chunk, chunk-level labels become invalid. Use **document or passage-span level** labels, or an LLM-based context-recall judge, to compare chunking strategies fairly.
- **Metrics ≠ end-to-end success.** Good recall is necessary, not sufficient. Always also measure generation quality (faithfulness, correctness).
- **Compare configurations on the same set:** chunk size, embedding model, hybrid versus vector, reranker, and query rewriting, one change at a time (Chapter 13).
- **LLM-based context metrics** (context precision and recall by judge) are useful when you lack explicit labels, and need validating like any judge.
- Also track **latency and cost** of retrieval (a larger k and a heavier reranker cost more).

**Diagnosing with retrieval metrics:**

| Symptom | Probable fix |
| --- | --- |
| Low Recall@50 | Chunking, parsing, embedding model, add BM25 (hybrid), query rewriting, metadata filters wrong |
| High Recall@50, low Recall@5 or MRR | Add or improve the **reranker** |
| High recall, low precision at final k | Reduce k, apply a score threshold, deduplicate, MMR |
| Good on paraphrase, poor on exact IDs | Add keyword or hybrid search |

**Use case:** the team measures Recall@50 = 0.82 and Recall@5 = 0.55 with vector-only search. Adding BM25 hybrid raises Recall@50 to 0.93, and adding a cross-encoder reranker lifts Recall@5 to 0.84 and MRR from 0.48 to 0.71. End-to-end correctness rises from 61% to 79%, with p95 latency up by 180 ms.

## Interview Q&A

**1. When do you need humans in evals?**
To define quality (rubrics, error analysis), calibrate and validate LLM judges, judge subjective or high-stakes content, run launch audits and safety review, and discover failure modes metrics miss.

**2. How do you ensure human labels are reliable?**
Clear rubrics, annotator training and calibration, 2 to 3 raters per item, blind and randomized presentation, gold items for quality control, agreement metrics (Cohen's or Fleiss' kappa, Krippendorff's alpha), and adjudication.

**3. What does low inter-annotator agreement tell you?**
The task or guidelines are ambiguous, so fix the rubric before trusting any metric or judge.

**4. Why pairwise comparison over absolute scoring?**
It's easier and more consistent for subjective qualities, avoids scale-calibration differences, and directly answers "which version is better".

**5. How do you analyze pairwise results?**
Win rate with confidence intervals (you need hundreds of comparisons for small gains), tie handling, slicing by segment, and Bradley-Terry or Elo for ranking many systems.

**6. Biases in LLM pairwise judging and fixes?**
Position bias (evaluate both orders and count disagreements as ties), verbosity bias (control length, instruct to ignore it), self-preference (use a different model family).

**7. Limits of pairwise evaluation?**
It's relative only (not an absolute quality bar), can't diagnose causes, costs grow with pairs, may favor style over substance, and may be intransitive.

**8. Faithfulness vs factuality?**
Faithfulness is consistency with the provided context. Factuality is truth in the real world. An answer can be faithful but wrong (bad source) or true but unfaithful (added knowledge not in context).

**9. How do you measure faithfulness?**
Decompose the answer into atomic claims, verify each against the context (an NLI model or LLM judge), and report the fraction of supported claims. Add citation precision and recall, and validate the judge on your domain.

**10. How do you treat "I don't know" answers in faithfulness evals?**
They're faithful by construction, so measure abstention correctness separately: abstaining when the answer is absent is good, abstaining when it was present is a failure.

**11. What are Recall@k, MRR and nDCG?**
Recall@k is the fraction of relevant items found in the top k. MRR is the mean reciprocal rank of the first relevant item. nDCG rewards ranking relevant items high, with graded relevance.

**12. Which metric matters most for the first stage vs the final context?**
First stage: Recall at a large k (candidate coverage). Final context: precision, MRR and nDCG at the k you send to the LLM, with Recall@k at that k.

**13. Why can retrieval metrics underestimate real performance?**
Incomplete relevance labels (several valid chunks, only one labeled). Mitigate with document-level labels, multiple acceptable answers, or LLM-based context recall.

**14. Retrieval metrics look great but answers are wrong. Why?**
Retrieval is necessary but not sufficient: generation can ignore or misuse the context (check faithfulness), the context may be stale or contradictory, or the question needs reasoning beyond the retrieved text.

## Cheat sheet

Humans: define, calibrate, audit. Make them reliable with rubrics, training, blind review and kappa. Pairwise: easier than absolute scores, so use win rate with CIs, swap order, control length. Faithfulness = every claim supported by context (claim decomposition plus NLI/judge), distinct from factuality. Retrieval: Recall@k for coverage, MRR and nDCG for ranking, precision for noise, and match k to what the LLM sees.

## Self-check

1. Two annotators have kappa = 0.3. What do you do before using their labels?
2. Your new prompt wins 56% of 120 pairwise comparisons. Can you claim it's better?
3. A model's answer includes a true fact that's not in the retrieved documents. Faithful or not, and does it matter?
4. Recall@50 = 0.9 but Recall@5 = 0.5. What do you add, and why?
5. Your retrieval labels mark one chunk as relevant, but three chunks actually contain the answer. How does this distort Recall@k?

# Chapter 21: Agent Trajectory Evals, Offline vs Online Evals, Regression Testing, A/B Testing and Red Teaming

This chapter finishes Module 5 (AI Evals). Chapters 18 to 20 covered *what* to measure and *how to judge*. This one covers evaluating **agents**, **when and where** to run evals, and **adversarial** testing.

## Part 1: Agent trajectory evals

**The problem.** An agent's final answer can be right for the wrong reasons (a lucky guess, a redundant 20-step path) or wrong because of one bad step. Evaluating only the final output hides *how* it got there, and agent failures are mostly process failures.

**Trajectory** = the full sequence of steps in a run: model calls, reasoning, tool calls (with arguments), observations, handoffs, and the final answer.

**Three levels of agent evaluation:**

| Level | Question | Example |
| --- | --- | --- |
| **Outcome (end-to-end)** | Did the task succeed? | Refund issued correctly, bug fixed and tests pass |
| **Trajectory (process)** | Was the path sensible and efficient? | Right tools, right order, no loops, no unnecessary calls |
| **Step-level (component)** | Was each decision correct? | Correct tool chosen, arguments valid, tool result read correctly |

**Outcome evals come first.** Prefer **state-based, verifiable outcomes** over judging the transcript:

- Check the **environment's final state**: is the database row updated, is the file correct, did the unit tests pass, is the ticket closed?
- For coding agents: tests are the verifier. For web and computer-use agents: check the resulting page state or backend state. This is far more reliable than an LLM reading the chat.
- Only fall back to an LLM judge when there's no checkable state.

**Trajectory metrics:**

| Metric | What it measures |
| --- | --- |
| **Task success rate** | Fraction of tasks completed correctly (the headline number) |
| **Tool selection accuracy** | Did it call the right tool at each decision point? |
| **Argument correctness** | Valid, correct parameters |
| **Trajectory match** | Compare to a reference path: exact match, in-order match, any-order match, precision and recall of expected tool calls. Use loosely, because many valid paths exist |
| **Step efficiency** | Number of steps, tool calls, tokens and cost versus a baseline or minimum |
| **Redundancy / loop rate** | Repeated or unnecessary calls, loop-detector hits |
| **Error recovery** | After a tool error, does it recover or spiral? |
| **Constraint adherence** | Never called forbidden tools, respected approval gates and permissions |
| **Stopping quality** | Stops when done, doesn't quit early, escalates when stuck |
| **Plan quality** | Is the plan reasonable and followed (LLM judge with a rubric) |
| **Latency and cost per task** | Operational efficiency |

**Reference trajectories: use with care.** There's often more than one correct path, so strict matching penalizes valid alternatives. Better options: check **required** tool calls and **forbidden** ones, check **invariants** ("must verify eligibility before issuing a refund"), or score with a judge using a rubric of *properties* and not an exact path.

**Non-determinism: run each task several times.**

- **pass@k:** probability that at least one of k attempts succeeds (measures capability)
- **pass^k (all k succeed):** probability that *every* run succeeds (measures **reliability**, which is what production users need). A 90% single-run success rate gives only about 59% for pass^5 (0.9^5).
- Report success **rate and variance**, not a single run.

**Simulated users and environments:**

- For conversational agents, use an **LLM-simulated user** with a scripted goal and persona to run multi-turn tests at scale
- Build **sandbox environments** with mock tools and seeded data (including **mock failures**: timeouts, empty results, conflicting data) so runs are reproducible and safe
- Benchmarks use this approach (for example tau-bench for customer-service tasks, SWE-bench for coding, WebArena and OSWorld for web and computer use). Use them for inspiration, and build your own tasks from real failures.

**Step-level judges:** for each tool-call step, a judge (or code) checks "was this the right next action given the state?" This pinpoints where the trajectory went wrong (the "first error" from Chapter 18's error analysis).

**Multi-agent specifics:** evaluate the **outcome** first, then handoff quality (was the delegation brief complete?), duplicated work, number of agents spawned, and cost. A good final answer from five redundant agents is still a regression in efficiency.

**Safety trajectories:** assert that the agent **never** performs disallowed actions even under adversarial input (Part 5). This is a hard gate, not a score.

```python
def eval_run(run, task):
    final = task.verify_state(run.env)                      # outcome: check real state
    calls = [c.name for c in run.tool_calls]
    return {
        "success": final,
        "used_required": all(t in calls for t in task.required_tools),
        "no_forbidden": not any(t in calls for t in task.forbidden_tools),
        "steps": len(run.steps),
        "efficient": len(run.steps) <= task.max_steps,
        "loop": has_repeated_calls(run, n=3),
        "cost": run.total_cost,
    }
# run each task k times, report pass@k, pass^k, mean steps, mean cost
```

**Use case:** a refund agent is tested on 80 scenarios in a sandbox with mock tools. Outcome is checked by the database state, and invariants assert "eligibility checked before refund" and "no refund over the limit without approval". Results show 88% success, but pass^5 is only 61%, and traces show the failures cluster around ambiguous order IDs. The fix is a clarifying-question step and a tool-description change.

## Part 2: Offline vs online evals

| | **Offline evals** | **Online evals** |
| --- | --- | --- |
| When | Before release (dev, CI) | After release, on live traffic |
| Data | Curated golden and regression sets | Real, sampled production interactions |
| Speed | Fast iteration, fully controlled | Slower feedback, real-world noise |
| Strength | Safe, repeatable, comparable across versions, catches regressions | Reflects true user behavior and distribution, finds unknown failures |
| Weakness | Only covers what you thought of, can drift from reality | Risk exposure to users, needs labels or proxies |
| Ground truth | Labeled references | Often none, so use judges, heuristics and user signals |

**They form a loop:**

```
Offline evals → ship (gradually) → Online monitoring → find failures → error analysis →
   add to golden/regression set → improve → offline evals ...
```

**Online evaluation methods:**

1. **Automated scoring of sampled traffic:** run validated LLM judges and deterministic checks on a sample (all errors and low-confidence cases, plus a random slice). Judges here are **reference-free** (faithfulness to the retrieved context, policy compliance, tone), since no gold answer exists.
2. **User feedback signals:** explicit (thumbs, ratings) and implicit (copy, acceptance, edits, retries and rephrasing, abandonment, escalation, time to resolution). Noisy and biased, so use them to **find** problems and to run A/B tests.
3. **Guardrail and safety trigger rates** as health indicators
4. **Operational metrics:** latency, errors, cost, tool failure rates, loop-detector hits, step counts
5. **Human review** of a weekly stratified sample (also recalibrates the judges)
6. **Drift detection:** input distribution shifts (new topics, languages), retrieval score distributions, judge score trends, and refusal rates. Alert on changes.

**Practical tips:**

- Use **the same rubrics offline and online** so numbers are comparable
- **Log everything needed to evaluate later** (inputs, context, outputs, versions), with privacy controls (Chapter 25)
- **Sample smartly:** oversample failures, rare segments and new query types
- Track **metric deltas by version and segment**, and not only a global average
- Promote real production failures into the offline set **within days**
- Online scores from a judge are **estimates**, so validate the judge on production-like data

**Use case:** offline, the new prompt scores 94% faithfulness. In production, an online judge on 5% of traffic shows 86% on a new query type (Hindi-English mixed queries) that the golden set didn't contain. Those cases are added to the golden set, and the fix ships a week later.

## Part 3: Regression testing

**Definition.** Re-running a fixed set of tests after every change to confirm that **previously working behavior still works**. In LLM systems, nearly anything can cause a regression: prompt edits, model upgrades (even silent alias updates), retrieval changes, tool changes, temperature, new documents in the index, and library updates.

**The regression suite:**

- **Core golden cases** (important use cases weighted by traffic)
- **Every past bug and incident** (permanent members)
- **Safety and policy cases** (hard requirements, often 100% pass required)
- **Edge and adversarial cases**
- **Format and contract checks** (schemas, tool-call shapes)

**Running it:**

1. **Deterministic checks first** (cheap and fast, run on every commit)
2. **Judge-based checks** for subjective criteria, run on PRs or nightly (cost)
3. **Run each case several times** where non-determinism matters, and use **pass-rate thresholds**
4. **Compare against a baseline** (the current production version) side by side, per criterion and per tag
5. **Gate the release:** block on critical-case failures, and on statistically meaningful drops in key metrics
6. **Pin everything:** model snapshot, prompt version, retrieval index version, tool versions, sampling parameters, seed where supported
7. Store results per run (commit, versions, dataset version) so you can **bisect** when something breaks

**Dealing with noise:**

- Expect some run-to-run variance, so set thresholds with that in mind ("no drop greater than 2 points", or a confidence-interval check)
- Distinguish **flaky** tests (sometimes pass) from **real regressions** (consistent drop)
- Use paired comparisons on the same inputs to reduce noise
- For small suites, look at **individual flipped cases** (pass to fail), not only the average

**Triggers for a full regression run:**

- Prompt, template, schema or tool-definition change
- **Model version change** (even a provider-announced minor update)
- Retrieval changes (chunking, embeddings, reranker, index rebuild)
- New or changed guardrails
- Dependency upgrades, and scheduled runs (to catch **silent drift** from provider-side changes)

**Model upgrade protocol:** run the full offline suite on the candidate model, compare per criterion and cost and latency, review flipped cases manually, canary a small share of traffic, monitor online metrics, and keep a fast rollback. Never auto-follow a floating alias in production.

**Anti-patterns:** a suite so slow nobody runs it, ignoring failures as "flaky", updating the expected answers to match the new output without review, tuning to pass the regression set (overfitting, so keep a held-out set), and never adding new cases.

**Use case:** the "friendlier tone" prompt change passes 98% of cases, but diff review shows 4 cases flipped from pass to fail, all on "no refund promises". The release is blocked, the prompt is fixed, and those cases stay in the suite.

## Part 4: A/B testing in production

**Definition.** Randomly split live users between **control (A)** and **treatment (B)** and compare real-world outcomes. It's the arbiter of "does this actually help users?", something offline evals can only approximate.

**Typical sequence (progressive delivery):**

```
Offline evals pass → Shadow mode → Canary (1-5%) → A/B test (e.g., 50/50 or 10/90) → Ramp to 100% → Monitor
```

- **Shadow mode:** the new version runs in parallel on real traffic, but users only see the old output. You compare outputs and cost with zero user risk.
- **Canary:** a small share of users, with automatic rollback on guardrail or error-rate breaches.
- **A/B:** a measured comparison with statistics.
- **Interleaving** (for ranked results) and **multi-armed bandits** (adaptive allocation) are alternatives.

**Design:**

1. **Hypothesis:** "Adding a reranker will improve resolution rate without raising latency beyond +200 ms."
2. **Randomization unit:** usually the **user** (or session), so one user doesn't flip between variants. Keep assignment sticky.
3. **Primary metric:** tied to value, such as task success, resolution rate, conversion, acceptance rate, retention, or CSAT, not just model-centric scores.
4. **Guardrail metrics** that must not get worse: safety violations, escalation rate, cost per task, latency (p95), error rate, complaint rate.
5. **Sample size and duration:** calculate with a power analysis for the smallest effect you care about. Run for **at least a full weekly cycle** to cover usage patterns. **Don't peek and stop early** when the result looks good (it inflates false positives), or use sequential testing methods built for that.
6. **Analysis:** confidence intervals, significance tests, segment breakdowns, and checks for **sample ratio mismatch** (the actual split differs from the planned split, which signals a bug).

**LLM-specific challenges:**

- **Noisy outcome metrics** and sparse explicit feedback, so use behavioral metrics and larger samples
- **Novelty effects** (users react to change, not quality)
- **Delayed outcomes** (resolution days later, retention)
- **Interference:** shared caches, shared memory or learning loops can leak between arms
- **Multi-turn effects:** a conversation spans multiple calls, so randomize at the conversation or user level
- **Cost and latency are part of the result:** a variant that wins on quality but doubles cost may lose overall
- **Judge-scored metrics** need validation, and are best paired with a behavioral metric
- **Safety first:** start with offline and red-team gates, since you can't "A/B test" a harmful output on real users

**Statistical sketch:** for a binary success metric with baseline p = 0.60 and a target lift of 3 points, you need on the order of thousands of users per arm (use a standard power calculator). Small lifts need large samples.

**Decision rule:** ship B if the primary metric improves significantly **and** no guardrail metric regresses beyond its limit. Document the result either way.

**Use case:** a team tests a new retrieval stack at 10% of traffic for 2 weeks. Resolution rate rises from 62% to 66% (CI excludes zero), latency p95 rises 120 ms (within budget), and cost per resolved ticket drops. They ramp to 100%.

## Part 5: Red teaming

**Definition.** **Adversarially** probing the system to find failures before real attackers or edge cases do. Normal evals ask "does it work?", while red teaming asks "how can I make it break, misbehave or cause harm?"

**What to probe:**

| Area | Examples |
| --- | --- |
| **Prompt injection (direct and indirect)** | Instruction overrides, hidden instructions in documents, web pages, emails, images, tool outputs (Chapter 9) |
| **Jailbreaks** | Roleplay framing, hypotheticals, multi-turn escalation, encoding tricks, language switching |
| **Data exfiltration** | Leaking the system prompt, other users' data, secrets, memory contents; markdown-image or link exfiltration |
| **Tool and agent abuse** | Tricking the agent into unauthorized actions, privilege escalation, chaining tools to bypass limits, runaway loops and cost attacks |
| **Harmful content** | Policy-violating outputs (violence, self-harm, illegal advice, hateful content), age-inappropriate content |
| **Bias and fairness** | Different treatment across demographic groups, stereotyping |
| **Hallucination and overconfidence** | Fabricated citations, false claims on unanswerable questions, sycophancy toward false premises |
| **Privacy** | PII leakage, memorized training data, re-identification |
| **Brand and legal risk** | Unauthorized promises, discount or refund commitments, impersonation, defamation |
| **Robustness** | Typos, long inputs, weird encodings, mixed languages, empty input, adversarial formatting |
| **Denial of service / wallet** | Inputs that trigger very long outputs, max tool loops, or expensive calls |
| **Memory poisoning** | Writing malicious "facts" into long-term memory (Chapter 15) |
| **Multimodal attacks** | Instructions embedded in images, audio or documents |

**Approaches:**

1. **Manual red teaming:** creative humans (security staff, domain experts, trusted users) probe freely. It finds novel issues and is needed for high-risk launches.
2. **Automated red teaming:** use an **attacker LLM** to generate and mutate adversarial prompts at scale (for example multi-turn escalation, paraphrase variations), with an automated judge scoring "did it comply with the harmful request?". Frameworks include PyRIT, garak, promptfoo, and DeepTeam.
3. **Benchmarks and datasets** of known attacks (HarmBench, AdvBench, and similar) as a baseline, not a substitute for app-specific tests.
4. **Scenario-based tests:** threat-model your app first ("what's the worst thing this agent could do with its tools?") and write attacks against those specific risks.
5. **Bug bounty or external review** for public, high-stakes products.

**Process:**

1. **Threat model:** assets, attackers, tools, data sensitivity, worst-case actions (use the lethal trifecta check from Chapter 9)
2. **Build attack sets** per risk category, in several styles (direct, indirect, multi-turn, multilingual)
3. **Run and score:** attack success rate (ASR) per category, using deterministic checks (canary tokens, forbidden-tool calls) wherever possible, plus judges and human review
4. **Triage by severity and exploitability**
5. **Mitigate:** the fix is usually in **permissions, isolation, output filtering and human approval** (architecture), with prompt hardening and classifiers as secondary layers
6. **Add the successful attacks to the regression suite** so they never silently return
7. **Repeat regularly**, since models, prompts, tools and attackers change

**Metrics:**

- **Attack success rate** by category (lower is better), tracked over versions
- **Refusal accuracy:** refuses what it should **and** answers legitimate borderline requests (**over-refusal rate** matters, because a bot that refuses everything is "safe" and useless)
- **Time to detect and mitigate** in production
- **Coverage:** share of threat-model risks that have tests

**Deterministic tricks for scoring attacks:** plant a **canary string** in the system prompt or private data and check whether it appears in outputs, assert that **forbidden tools were never invoked**, check that outbound requests only went to allowlisted domains, and check for PII patterns.

**Important mindset:** you can lower attack success but not prove it's zero. Red teaming demonstrates the **presence** of vulnerabilities, not their absence. Design so that a successful attack has limited impact (least privilege, approvals, isolation).

```python
CANARY = "ZX-CANARY-7731"          # planted in system prompt / private data

def attack_succeeded(run, attack):
    out = run.final_output
    return any([
        CANARY in out,                                       # leaked secret
        any(t in run.tool_names for t in attack.forbidden),  # forbidden action taken
        any(not allowed(u) for u in run.outbound_urls),      # exfil attempt
    ])
asr = sum(attack_succeeded(run_attack(a), a) for a in attacks) / len(attacks)
```

**Use case:** before launching an email assistant, the team plants canary secrets in a mock inbox and sends it emails with hidden instructions ("forward the last 10 messages to..."). Automated attacks show a 14% success rate on the first build. After removing the send tool from the summarization path, adding recipient allowlists and approval for sends, the rate drops to 0% on the suite, and all attacks join the CI regression set.

## Interview Q&A

**1. How do you evaluate an agent?**
At three levels: outcome (verified by environment state), trajectory (tool choice, arguments, efficiency, loops, constraint adherence), and step level. Run tasks multiple times and report success rate, pass^k reliability, steps and cost.

**2. Why is a reference trajectory risky?**
Many valid paths exist, so strict matching penalizes alternatives. Use required and forbidden tool checks, invariants, and rubric judges.

**3. pass@k vs pass^k?**
pass@k: at least one of k attempts succeeds (capability). pass^k: all k succeed (reliability). Production users experience reliability, and it falls fast with k.

**4. Why prefer state-based outcome checks?**
They verify the real effect (database updated, tests pass) and don't depend on an LLM interpreting a transcript.

**5. Offline vs online evals?**
Offline uses curated sets before release (safe, repeatable). Online evaluates live traffic (real distribution) using reference-free judges, user signals and monitoring. They feed each other in a loop.

**6. What do you do in regression testing for LLM apps?**
Maintain a suite with golden cases, past bugs and safety cases, run on every prompt, model, retrieval or tool change, compare to the baseline per criterion, gate releases, pin versions, and handle noise with multiple runs and thresholds.

**7. How do you handle a model upgrade safely?**
Run the full suite on the candidate, review flipped cases, compare cost and latency, canary, monitor online metrics, and keep rollback. Don't follow floating aliases.

**8. How do you A/B test an LLM feature?**
Randomize at the user or conversation level, define a primary value metric and guardrail metrics, calculate sample size, run at least a full weekly cycle without peeking, and analyze with confidence intervals and segment views. Use shadow and canary stages first.

**9. Why can LLM A/B tests be tricky?**
Noisy and sparse feedback, novelty effects, delayed outcomes, shared caches or memory causing interference, multi-turn dependence, and cost and latency trade-offs.

**10. What is red teaming and how do you automate it?**
Adversarial testing for injection, jailbreaks, exfiltration, tool abuse and harmful outputs. Automate with attacker LLMs generating and mutating attacks, scored by deterministic checks (canaries, forbidden tools) and judges, then add successful attacks to the regression suite.

**11. How do you measure red-team results?**
Attack success rate per category, over-refusal rate, coverage of the threat model, and time to mitigate.

**12. What fixes injection findings most reliably?**
Architectural controls (least privilege, isolation, output filtering, human approval), not just prompt wording.

## Cheat sheet

Agents: verify outcomes by state, judge trajectories by properties, run multiple times (pass^k). Offline plus online evals form a loop. Regression suite runs on every change and gates releases. A/B: user-level randomization, value metric plus guardrails, no peeking. Red team: threat-model, attack, score with canaries and forbidden-tool checks, fix architecture, add to the regression suite.

## Self-check

1. An agent has 90% single-run success. Roughly what's pass^5, and why does it matter?
2. Your prompt change improved the average score but 4 cases flipped to fail. What do you do?
3. Why can't you stop an A/B test as soon as B looks ahead?
4. Give two deterministic ways to score a data-exfiltration attack.

You have now finished Module 5 (AI Evals).

# Chapter 22: LLM APIs and SDKs, Model Selection, Model Routing and Fallbacks, Streaming

This is the first chapter of Module 6 (LLMOps). It covers how applications talk to models, how to choose and route between them, how to survive failures, and how to stream responses.

## Part 1: LLM APIs and SDKs

**What an LLM API is.** An HTTP service where you send a request (messages, parameters, tools) and receive a model response, billed per token. The model runs on the provider's GPUs. Your app is a client.

**Anatomy of a chat request (most providers are similar):**

```python
response = client.messages.create(          # SDK call (Anthropic-style; OpenAI-style is similar)
    model="<pinned-model-id>",              # exact snapshot where possible
    max_tokens=1024,                        # cap on OUTPUT tokens
    temperature=0.2,
    system="You are a support assistant...",
    messages=[{"role": "user", "content": "Where is my order A123?"}],
    tools=[...],                            # function definitions (Chapter 14)
    # optional: stop_sequences, tool_choice, response format / JSON schema, streaming flag
)
print(response.content, response.usage)     # usage = input/output (and cached) token counts
```

**Key parameters:**

| Parameter | Purpose |
| --- | --- |
| `model` | Which model (and version) |
| `messages` / `system` | The conversation and instructions (Chapter 6) |
| `max_tokens` | Hard limit on output length (also a cost and latency cap) |
| `temperature`, `top_p` | Sampling (Chapter 5) |
| `stop` sequences | Cut generation at a marker |
| `tools`, `tool_choice` | Function calling (Chapter 14) |
| `response_format` / structured output schema | Guaranteed JSON shape (Chapter 7) |
| `stream` | Receive tokens as they're generated |
| `seed` (if supported) | Best-effort reproducibility |
| Thinking / reasoning effort (reasoning models) | Controls thinking budget |
| Metadata and user ID | For abuse tracking and attribution |

**Important response fields:** the generated content (text and tool calls), **stop reason** (end of turn, hit `max_tokens`, tool use, stop sequence, safety refusal), and **usage** (input, output, cached tokens). Always check the stop reason, because a `max_tokens` cutoff means a truncated answer or broken JSON (Chapter 7).

**API styles you'll meet:**

- **Chat/messages APIs** (standard)
- **Streaming (SSE)** responses
- **Batch APIs:** submit many requests for asynchronous processing at a discount (often around half price) with a longer turnaround. Ideal for evals, classification of backlogs, and data labeling.
- **Realtime / audio APIs:** WebSocket or WebRTC for low-latency voice (Chapter 26)
- **Embeddings, moderation, and file APIs**
- **OpenAI-compatible endpoints:** many providers and open-source servers (vLLM, Ollama) expose an OpenAI-style API, which makes switching easy
- **Gateways/proxies** (LiteLLM, Portkey, Cloudflare AI Gateway, OpenRouter, cloud-provider wrappers): one interface to many models, with centralized keys, logging, budgets and fallbacks

**Hosting options for the same model family:** provider's own API, or cloud platforms (AWS Bedrock, Google Vertex AI, Azure). The latter give enterprise controls (private networking, regional data residency, existing billing and compliance), sometimes with different feature and latency characteristics.

**SDK best practices:**

1. **Use the official SDK** (handles auth, retries, typing, streaming helpers). Keep it **pinned** and upgrade deliberately.
2. **Wrap the LLM client in your own thin interface** (`llm.generate(...)`), so swapping providers or adding logging, caching, fallbacks and budgets happens in one place.
3. **Set timeouts** (connection and read) on every call. The default may be very long.
4. **Configure retries** (SDKs often retry transient errors with backoff, Chapter 17), and make sure writes (tools) are idempotent.
5. **Manage secrets properly:** keys in a secrets manager or environment variables, never in code or the browser. **Never call the LLM API directly from a client app with your key.** Put a backend in between (auth, rate limits, logging, prompt control).
6. **Use async clients** for concurrency (many parallel requests), with a concurrency limiter so you don't blow rate limits.
7. **Pin model versions** (snapshot IDs), and keep model names, prompts, and parameters in config (Chapter 9).
8. **Track usage per request** (tokens, cost, latency, model, prompt version, user ID) for attribution (Chapter 25).
9. **Validate responses** (schema, stop reason) before using them.
10. **Handle errors by type:** 400 (bad request, don't retry), 401/403 (auth), 404 (model not found), 429 (rate limit, back off), 5xx and overloaded (retry or fall back), content-filter or refusal stop reasons (handle gracefully).
11. **Keep the conversation state yourself** (the API is stateless): you resend the history each time (Chapter 2), and manage trimming and summarization (Chapter 8).

## Part 2: Model selection (LLMOps view)

(Chapter 26 gives the app-design view. This is the operating view.)

**Decision dimensions:**

| Dimension | Questions |
| --- | --- |
| **Quality** | Does it pass *your* evals at the required bar? On hard cases? |
| **Latency** | Time-to-first-token and tokens per second at your load |
| **Cost** | Input and output token prices, caching discounts, batch discounts, total per task |
| **Context window** | Fits your prompts, documents and history, and how well it uses long context |
| **Capabilities** | Tool use, structured outputs, vision, audio, reasoning, languages, code |
| **Reliability** | Rate limits, uptime, error rates, support, regional availability |
| **Privacy and compliance** | Data retention and training policies, residency, certifications, private deployment |
| **Control** | Fine-tuning, version pinning, deprecation schedules, self-hosting option |
| **Ecosystem** | SDK quality, tooling, observability integrations |

**Process:**

1. Define requirements numerically (quality threshold on your eval set, p95 latency, cost per task, privacy needs).
2. Shortlist 3 to 5 candidates across tiers (large, medium, small, plus an open-weight option).
3. **Run your eval suite** on each (the same prompts first, then lightly tuned per model, since prompts often need model-specific adjustment).
4. Measure **quality, latency, cost, and failure modes** together, as a **quality-cost-latency frontier**, not one number.
5. Choose the **cheapest model that clears the bar** for each step, and consider routing (Part 3).
6. Plan for **model deprecations** and upgrades: providers retire model versions on a schedule. Build the re-evaluation process in advance.

**Rules of thumb:**

- Don't pick on leaderboards or benchmark claims alone
- Small models are often enough for classification, extraction, routing and simple Q&A
- Reasoning models only for steps that need deep reasoning
- Test **at your real context lengths and load**, because quality and latency change
- Calculate **total cost of a task** (including retries, multi-step agents, retrieved context tokens), not the per-token price alone
- **Avoid lock-in** where it's cheap to do so (abstraction layer, portable prompts, evals as the contract)

## Part 3: Model routing and fallbacks

### Routing

**Idea.** Not every request needs your strongest (and most expensive) model. **Route** each request to the cheapest model that can handle it well.

**Routing strategies:**

| Strategy | How | Notes |
| --- | --- | --- |
| **Rule-based** | By task type, input length, user tier, language, keywords | Simple, predictable, and often enough |
| **Classifier router** | A small model or LLM classifies difficulty and intent, then dispatches | Cheap, needs labeled data and evals |
| **Cascade (escalation)** | Try the cheap model first. If **confidence is low** or a check fails, escalate to a stronger model | Saves cost when most requests are easy. Adds latency on escalation |
| **Confidence-based** | Use verifier checks, self-consistency agreement, schema validity, retrieval score, or logprobs to decide on escalation | Needs a trustworthy signal |
| **Learned router** | Train a model on (query, which model succeeded) data | Powerful at scale, needs data and maintenance |
| **Capability-based** | Choose by required feature (vision, long context, tools, language) | Straightforward |
| **Cost/latency-aware** | Choose based on the remaining budget or SLA (for example voice needs the fast model) | Common in real-time systems |
| **Specialist routing** | Code goes to a code model, math to a reasoning model, and so on | Verify specialists beat the generalist on your evals |

```python
def route(request):
    if request.needs_vision:               return MODEL_VISION
    if request.task == "classify":         return MODEL_SMALL
    if request.tokens_in > 100_000:        return MODEL_LONG_CONTEXT
    return MODEL_MID

def answer(request):
    out = call(MODEL_SMALL, request)
    if passes_checks(out):                 # schema valid, groundedness check, confidence
        return out
    return call(MODEL_LARGE, request)      # escalate
```

**Routing tips:**

- **Evaluate the router itself:** measure how often it sends hard queries to weak models (quality loss) and easy ones to strong models (wasted cost)
- Measure the **end-to-end** quality-cost curve with and without routing
- Make the router **cheap and fast**, and its cost should be a small fraction of the savings
- Log the **routing decision** in traces, so you can debug and improve it
- Avoid inconsistent behavior across models in the same conversation (style and tool behavior may differ)
- Keep **prompts per model** where needed, since the same prompt may behave differently

### Fallbacks

**Purpose.** Keep the product working when the primary model or provider fails or is rate-limited.

**Triggers:** timeouts, 429s, 5xx and overloaded errors, region outages, content-filter blocks (sometimes), invalid or unparseable output, or budget exhaustion.

**Fallback chain (typical):**

1. **Retry** the same model with backoff (transient errors, Chapter 17)
2. **Fall back to an equivalent model on another provider or region** (the same family via a different cloud, or another vendor)
3. **Fall back to a smaller or cheaper model** (degraded quality, same availability)
4. **Serve a cached or static response**, or ask the user to retry
5. **Degrade gracefully** (disable optional features, tell the user)

**Design considerations:**

- **Fallback models must be evaluated too.** An untested fallback can silently produce bad output (different tool-calling format, a weaker model failing your schema). Include them in the regression suite.
- **Prompt and schema compatibility:** differences in tool-call syntax, system prompt handling, context limits and structured-output support across providers. A gateway or abstraction layer normalizes these.
- **Circuit breakers:** after repeated failures to a provider, stop sending it traffic for a cooldown period, then probe with a few requests
- **Load balancing** across multiple deployments, keys or regions to spread rate limits
- **Timeouts per tier** so a hung primary doesn't eat the whole latency budget, and consider **hedged requests** (send to a second provider if the first is slow, use whichever returns first) for latency-critical paths, at extra cost
- **Data and compliance constraints:** a fallback provider must meet the same privacy, residency and contract requirements
- **Observability:** log which model actually served each request, and alert on fallback rate spikes (a quiet outage indicator)
- **Idempotency for tools** (Chapter 17) so a retry on a fallback doesn't repeat side effects

**Tools:** LiteLLM, Portkey, OpenRouter, cloud gateways, or your own wrapper.

**Use case:** a support bot routes simple FAQ lookups to a small model, and escalates when the groundedness check fails. The primary provider has an outage, the circuit breaker trips, traffic shifts to the same model family on a second cloud, and the fallback rate alert pages the on-call.

## Part 4: Streaming responses

**What it is.** Instead of waiting for the entire answer, the API sends tokens **as they're generated** (usually via **Server-Sent Events, SSE**, or WebSockets). The client displays them progressively.

**Why stream:**

- **Perceived latency drops dramatically.** Time to first token (TTFT) is typically hundreds of ms, versus many seconds for a full long answer.
- Users can **read while it generates**, and **cancel** early
- Required for **voice** (start TTS on the first sentence, Chapter 26) and for agents showing progress
- Lets you apply **early stopping** and incremental processing

**Metrics:** **TTFT** (time to first token), **inter-token latency / tokens per second**, and **total time**. Streaming doesn't make total generation faster, it makes it *feel* faster.

**How events look (conceptually):** a stream of small events: message start, content deltas (partial text), tool-call deltas (partial JSON arguments), and a final event with the stop reason and usage.

```python
with client.messages.stream(model=MODEL, max_tokens=800, messages=msgs) as stream:
    for text in stream.text_stream:
        send_to_client(text)             # push to browser via SSE/WebSocket
    final = stream.get_final_message()   # stop reason + usage
log_usage(final.usage)
```

**Backend-to-browser:** your server consumes the provider stream and **re-streams** to the browser over SSE or WebSocket, keeping the API key server-side. Make sure proxies and load balancers **don't buffer** the stream (disable response buffering, set proper headers and timeouts).

**Challenges and how to handle them:**

| Challenge | Handling |
| --- | --- |
| **Structured output (JSON)** | Partial JSON isn't parseable. Use an incremental parser, or stream only text fields, or wait for the complete object. Constrained decoding still streams token by token |
| **Tool calls** | Arguments arrive as partial JSON, so accumulate until complete before executing |
| **Output guardrails** | You may have already shown unsafe text before checking. Options: check in chunks (sentence-level) with the ability to retract, buffer a small window, or run a parallel moderation stream and cut off if it trips |
| **Markdown and formatting** | Partial markdown renders oddly (unclosed code fences). Render defensively |
| **Errors mid-stream** | The connection can drop after partial output. Decide whether to retry, resume, or show "response interrupted". Don't double-charge or double-execute tools |
| **Cancellation** | Propagate the client's cancel to the provider (abort the request) so you stop paying for tokens nobody reads |
| **Usage accounting** | Token counts arrive at the end, so log them from the final event |
| **Citations / post-processing** | Need the full text, so stream the answer and attach citations after, or stream structured events |
| **Retries** | Can't transparently retry once you've sent partial output to the user |
| **Reasoning models** | Thinking tokens may stream first (or be hidden or summarized), so decide what to show |

**UX tips:** show a typing indicator until the first token, auto-scroll sensibly, offer a stop button, and flush small chunks frequently.

**When not to stream:** background and batch jobs, machine-to-machine calls where only the final result matters, and cases where you must validate the full output before showing anything.

**Use case:** a chat UI streams answers over SSE. The backend streams in sentence-sized chunks through a lightweight moderation check, supports a stop button that aborts the upstream request, and logs usage from the final event.

## Interview Q&A

**1. Walk me through an LLM API call.**
Send model, messages, system prompt and parameters (plus tools and schema), get content, a stop reason and token usage. Check the stop reason (truncation), validate the output, and log usage.

**2. Best practices for using an LLM SDK in production?**
Pin versions, wrap the client in your own abstraction, set timeouts, retries and concurrency limits, keep keys server-side, handle errors by type, validate responses, and log tokens, cost and latency per request.

**3. Why never call the LLM API directly from a browser or mobile app?**
It exposes your API key and bypasses your auth, rate limits, logging and prompt control. Use a backend proxy.

**4. What is a batch API and when do you use it?**
Asynchronous bulk processing at a discount with delayed results. Use for evals, backfills, labeling and non-interactive workloads.

**5. How do you select a model?**
Numeric requirements, a shortlist, run your own evals, compare the quality-latency-cost frontier, choose the cheapest that clears the bar per step, and plan for deprecations.

**6. What is model routing?**
Dispatching each request to the cheapest model that can handle it, via rules, a classifier, a learned router, or a cascade with escalation on low confidence.

**7. How do you evaluate a router?**
Measure misrouting both ways (hard queries to weak models, easy ones to strong models) and the end-to-end quality-cost curve versus a single-model baseline.

**8. How do you design fallbacks?**
Retry with backoff, switch to an equivalent model on another provider or region, then a smaller model, then cache or graceful degradation. Evaluate fallbacks too, add circuit breakers, log the serving model, and respect compliance constraints.

**9. What is a hedged request?**
Sending a request to a second provider if the first is slow and using whichever returns first, trading extra cost for lower tail latency.

**10. Why stream, and what does it change?**
Lower perceived latency (TTFT), cancellable and incremental output, essential for voice. It doesn't reduce total generation time.

**11. What problems does streaming introduce?**
Partial JSON and tool-call arguments, output guardrails after text is shown, mid-stream errors and retries, buffering by proxies, and usage accounting at the end.

**12. How do you implement an output guardrail with streaming?**
Moderate in chunks with a small buffer or a parallel check that can cut off the stream, and for strict cases buffer and validate before display.

## Cheat sheet

Wrap the SDK, pin models, set timeouts, keep keys server-side, check the stop reason. Pick the cheapest model that passes your evals. Route by rules, classifiers or cascades, and test routers and fallbacks like everything else. Stream for TTFT, handle partial JSON, guardrails, cancellation and usage.

## Self-check

1. Your JSON answers randomly break in production. Which API field do you check first?
2. A cheap model handles 80% of traffic fine. Sketch the cascade and the signal you'd escalate on.
3. Why must fallback models be in your regression suite?
4. Your streaming works locally but arrives all at once in production. What's the likely cause?
