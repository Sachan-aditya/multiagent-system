# How to use this guide

This guide fills the gaps left by the earlier chapters: training basics, the classic architectures (ANN, CNN, RNN, LSTM, CRNN), classic NLP and document AI. It follows the roadmap order, so each part prepares the next.

Every part has the same shape: the idea, a small build you can run on a laptop CPU, then experiments where you break it on purpose.

| Part | Roadmap step it fills | Connects to the earlier chapters |
| --- | --- | --- |
| 1. Tensors, autograd, training loop | 1. AI and ML fundamentals | Ch 1 (backprop), Ch 3 (loss) |
| 2. Training basics | 1. AI and ML fundamentals | Ch 4 (LoRA, quantization) |
| 3. ANN / MLP | 2. Deep learning architectures | Ch 1 (feed-forward layer in a transformer block) |
| 4. CNN | 2. Deep learning architectures | Ch 5 (vision encoders), Ch 10 (document parsing) |
| 5. RNN | 2. Deep learning architectures | Ch 1 (why transformers replaced RNNs) |
| 6. LSTM and GRU | 2. Deep learning architectures | Ch 1, Ch 2 |
| 7. CRNN and CTC | 6. Document AI | Ch 10 (OCR) |
| 8. RNN to attention to Transformer | 2. Deep learning architectures | Ch 1 (self-attention) |
| 9. Classic NLP | 3. NLP and LLMs | Ch 2 (tokens, embeddings) |
| 10. Document AI | 6. Advanced applications | Ch 10 to 13 (RAG) |

## How to study each part

1. Read the idea once.
2. Type the code yourself. Copy-paste teaches almost nothing.
3. Before each break-it run, write down what you expect to happen.
4. Run it, compare with your prediction, and explain any difference.
5. Answer the interview questions in Part 11 out loud.

**Setup:** Python 3.10 or newer, `pip install torch numpy scikit-learn`. Every example runs in seconds on a CPU. The code is written from memory against PyTorch's API, so if a call fails on your version, check the PyTorch docs for the current signature.

# Glossary of AI engineering terms

Short definitions of the terms you will meet in AI engineering work and interviews, with links to where each one is taught. **Ch** means chapter and **F** means a part of the Foundations guide, so "Ch 12" opens Chapter 12 and "F4" opens Foundations Part 4. Use the filter box to find a term fast.

## A

**A/B testing.** Randomly splitting live users between the current version and a new one to compare real outcomes. It decides whether a prompt, model or retrieval change actually helps. Used in [Ch 21](#ch-21), [Ch 25](#ch-25).

**ACL (access control list).** Rules saying which users or groups may see which documents. In RAG it is applied as a filter at retrieval time, in code. Used in [Ch 12](#ch-12), [Ch 29](#ch-29).

**Activation function.** A non-linear function (ReLU, GELU, tanh, sigmoid) applied after a layer's weighted sum. Without it, stacked layers collapse into one linear function. Used in [F3](#foundations-3), [Ch 1](#ch-1).

**Adam / AdamW.** Optimizers that adapt the step size of each parameter using running averages of the gradient. AdamW applies weight decay correctly and is standard for transformers and fine-tuning. Used in [F2](#foundations-2), [Ch 4](#ch-4).

**Adapter.** A small trainable module attached to a frozen model so it learns a task cheaply. LoRA is the most common kind. Used in [Ch 4](#ch-4).

**Agent.** An LLM in a loop that chooses an action (a tool call), observes the result and decides the next step until the goal is met. Used in [Ch 14](#ch-14), [Ch 15](#ch-15), [Ch 16](#ch-16).

**Agentic RAG.** RAG where an agent controls retrieval: it rewrites queries, picks sources and searches again when results are poor. Used in [Ch 13](#ch-13).

**Alignment.** Training a model to be helpful, honest and safe, mainly with preference tuning (RLHF, DPO). Used in [Ch 3](#ch-3).

**ANN (approximate nearest neighbor).** Search that finds vectors very close to a query far faster than exact search, at a small cost in recall. HNSW and IVF are ANN indexes. Used in [Ch 11](#ch-11), [Ch 29](#ch-29).

**Attention.** A mechanism where each token weights other tokens and takes a weighted sum of their values. It is the core of transformers. Used in [Ch 1](#ch-1), [F8](#foundations-8).

**Autograd.** The framework feature (in PyTorch) that records operations and computes gradients automatically with the chain rule. Used in [F1](#foundations-1).

**Autoregressive.** Generating one token at a time, each conditioned on all earlier tokens. This is how GPT-style models work. Used in [Ch 1](#ch-1), [Ch 24](#ch-24).

**AWQ.** Activation-aware Weight Quantization, a post-training 4-bit method that protects the weights that matter most to activations. Used in [Ch 4](#ch-4).

## B

**Backoff (exponential, with jitter).** Waiting longer after each failed attempt, with randomness so many clients don't retry at the same moment. Used in [Ch 17](#ch-17), [Ch 23](#ch-23).

**Backpressure.** Slowing or rejecting new work when a system is saturated, instead of letting queues grow forever. Used in [Ch 23](#ch-23), [Ch 29](#ch-29).

**Backpropagation.** Computing how much each weight contributed to the loss by applying the chain rule from the output back to the input. Used in [F1](#foundations-1), [Ch 1](#ch-1).

**Batch / batch size.** The group of examples processed together, for one weight update in training or one forward pass in serving. Used in [F2](#foundations-2), [Ch 24](#ch-24).

**Batch API.** A provider endpoint that processes many requests asynchronously at a discount. Used in [Ch 22](#ch-22), [Ch 23](#ch-23).

**Batch normalization.** Normalizing activations across a batch to stabilize training. Common in CNNs. Used in [F2](#foundations-2).

**Beam search.** Decoding that keeps the best few partial outputs at each step instead of only one. Used in [F7](#foundations-7).

**BERT.** An encoder-only transformer trained to fill in masked words. Strong for classification, embeddings and reranking, and it cannot generate text. Used in [F9](#foundations-9), [Ch 1](#ch-1).

**bf16 / fp16.** 16-bit number formats. bf16 has fp32's range with less precision and is the usual choice for training. fp16 has more precision but a narrow range. Used in [Ch 4](#ch-4).

**Bi-encoder.** A model that embeds the query and the document separately and compares the vectors. Fast, so it is used for first-stage retrieval. Used in [Ch 12](#ch-12).

**BM25.** A keyword ranking function based on term frequency, how rare the term is across documents, and document length. Used in [Ch 12](#ch-12), [F9](#foundations-9).

**BPE (byte-pair encoding).** A tokenizer that builds its vocabulary by repeatedly merging the most frequent adjacent pairs. Used in [Ch 2](#ch-2).

**Bradley-Terry / Elo.** Models that turn pairwise win and loss results into a ranking with uncertainty. Used in [Ch 20](#ch-20).

## C

**Cache hit rate.** The share of requests served from a cache. For prompt caching, a sudden drop usually means something volatile entered the prefix. Used in [Ch 9](#ch-9), [Ch 23](#ch-23), [Ch 25](#ch-25).

**Canary release.** Sending a small share of traffic to a new version and rolling back automatically if metrics get worse. Used in [Ch 21](#ch-21), [Ch 25](#ch-25).

**Causal mask.** A mask that stops a token from attending to later tokens, so training matches generation. Used in [Ch 1](#ch-1).

**CDC (change data capture).** Streaming changes from a source database or system so an index can be updated incrementally. Used in [Ch 29](#ch-29).

**Chain-of-thought (CoT).** Having the model write intermediate reasoning before its answer, which improves multi-step accuracy. Used in [Ch 7](#ch-7).

**Checkpoint / checkpointing.** Saving state: model weights during training, or an agent graph's state after each step so it can resume or wait for approval. Used in [Ch 16](#ch-16), [Ch 27](#ch-27).

**Chinchilla scaling.** The finding that, for a fixed compute budget, model size and training tokens should grow together (about 20 tokens per parameter). Used in [Ch 3](#ch-3).

**Chunking.** Splitting documents into pieces for embedding and retrieval. Used in [Ch 10](#ch-10).

**Circuit breaker.** Stops calling a failing dependency for a cooldown period, then probes it again. Used in [Ch 17](#ch-17), [Ch 22](#ch-22).

**CLIP.** A model trained so images and their captions land close together in one embedding space. Used in [Ch 5](#ch-5).

**CNN (convolutional neural network).** A network that slides small shared filters over an image (or a sequence) to detect local patterns. Used for vision, OCR and as a feature extractor. Used in [F4](#foundations-4), [F7](#foundations-7).

**Computer-use agent.** An agent that operates software through screenshots and mouse and keyboard actions. Used in [Ch 16](#ch-16).

**Constrained decoding.** Restricting generation so the output must match a grammar or JSON schema. Used in [Ch 7](#ch-7).

**Context engineering.** Deciding what goes into the context window, in what form, in what order and at what time. Used in [Ch 8](#ch-8).

**Context window.** The maximum tokens (input plus output) a model handles in one request. Used in [Ch 2](#ch-2).

**Continuous batching.** A serving technique where finished sequences leave the batch and new ones join at every decode step, keeping the GPU busy. Used in [Ch 24](#ch-24).

**Contrastive learning.** Training that pulls matching pairs together and pushes non-matching pairs apart. It trains embedding models and CLIP. Used in [Ch 11](#ch-11).

**Cosine similarity.** Similarity based on the angle between two vectors, ignoring their length. The standard for embeddings. Used in [Ch 2](#ch-2), [Ch 11](#ch-11).

**CRNN.** A CNN feature extractor plus a (bidirectional) LSTM plus CTC loss. The classic design for reading text from images. Used in [F7](#foundations-7).

**Cross-encoder.** A model that scores a query and a document together. Slower but more accurate than a bi-encoder, so it is used for reranking. Used in [Ch 12](#ch-12).

**Cross-entropy.** A loss that compares predicted probabilities with the true class. It is the loss for next-token prediction. Used in [F1](#foundations-1), [Ch 3](#ch-3).

**CTC (connectionist temporal classification).** A loss and decoding rule for sequence output without alignment labels, using a blank symbol and a collapse rule. Used in [F7](#foundations-7).

**CUDA.** NVIDIA's platform and programming model for running general computation on its GPUs. PyTorch, vLLM and most GPU libraries rely on CUDA kernels. Used in [Ch 24](#ch-24).

## D

**Data leakage.** Information from validation or test data reaching training, which gives misleadingly good scores. Used in [F2](#foundations-2), [Ch 18](#ch-18).

**Dead-letter queue.** A queue that holds messages or jobs that kept failing, so they can be inspected without blocking others. Used in [Ch 28](#ch-28), [Ch 29](#ch-29).

**Decoder-only.** A transformer with causal attention that generates text, such as GPT, Llama and Claude. Used in [Ch 1](#ch-1).

**Dense retrieval.** Retrieval with embedding vectors, as opposed to keyword matching. Used in [Ch 11](#ch-11).

**Deterministic check.** An evaluation computed exactly by code, such as schema validity or an exact value match. Used in [Ch 19](#ch-19).

**Diffusion model.** A model that generates images by gradually removing noise. A different family from LLMs. Used in [Ch 5](#ch-5), [Ch 26](#ch-26).

**Distillation.** Training a smaller model to imitate a larger one. Used in [Ch 5](#ch-5).

**DPO (direct preference optimization).** Preference tuning directly on chosen and rejected pairs, with no reward model or RL loop. Used in [Ch 3](#ch-3).

**Dropout.** Randomly zeroing activations during training to reduce overfitting. Used in [F2](#foundations-2).

**Dynamic few-shot.** Retrieving the most similar labeled examples for each request and inserting them into the prompt. Used in [Ch 6](#ch-6).

## E

**Embedding.** A dense vector that represents a token or a piece of text so that similar meaning is nearby. Used in [Ch 2](#ch-2), [Ch 11](#ch-11).

**Encoder-decoder.** An architecture with one stack that reads the input and another that generates the output, such as T5, the original transformer and seq2seq models. Used in [Ch 1](#ch-1), [F8](#foundations-8).

**Encoder-only.** A bidirectional transformer for understanding tasks, such as BERT. Used in [Ch 1](#ch-1), [F9](#foundations-9).

**Epoch.** One full pass over the training data. Used in [F2](#foundations-2).

**Error analysis.** Reading failures, categorizing the first failure in each, and counting categories to decide what to fix. Used in [Ch 18](#ch-18).

**Eval.** A repeatable measurement of quality on a test set. Used in [Ch 18](#ch-18), [Ch 19](#ch-19), [Ch 20](#ch-20), [Ch 21](#ch-21).

**Exploding gradient.** Gradients that grow uncontrollably during backpropagation. Fixed with gradient clipping. Used in [F5](#foundations-5).

## F

**Faithfulness.** Whether every claim in an answer is supported by the provided context. The hallucination metric for RAG. Used in [Ch 20](#ch-20), [Ch 13](#ch-13).

**Fallback.** A backup model, provider or response used when the primary one fails. Used in [Ch 22](#ch-22).

**Feature flag.** A switch that turns a prompt, model or feature on for chosen users without redeploying code. Used in [Ch 25](#ch-25).

**Few-shot prompting.** Putting examples of input and desired output into the prompt. Used in [Ch 6](#ch-6).

**Fine-tuning.** Further training a pretrained model on your data to change its behavior or style. Used in [Ch 3](#ch-3), [Ch 4](#ch-4).

**FlashAttention.** An exact attention algorithm computed in tiles in fast on-chip memory, which cuts memory traffic and memory use. Used in [Ch 1](#ch-1), [Ch 24](#ch-24).

**FLOPs.** Floating-point operations, a measure of compute. Used in [Ch 24](#ch-24).

**FP8 / int8 / int4.** Low-precision formats for weights (and sometimes the KV cache) that save memory and speed up decoding. Used in [Ch 4](#ch-4), [Ch 24](#ch-24).

**Function calling (tool use).** A mechanism where the model outputs a structured request and your code executes the function. Used in [Ch 14](#ch-14).

## G

**GELU / SiLU.** Smooth activation functions used in transformers. Used in [F3](#foundations-3).

**GGUF.** A file format and quantization family used by llama.cpp for CPU and edge devices. Used in [Ch 4](#ch-4).

**Golden dataset.** A curated set of test inputs with trusted expected outcomes. Used in [Ch 18](#ch-18).

**GPTQ.** A post-training quantization method that minimizes layer-wise error. Popular for 4-bit GPU inference. Used in [Ch 4](#ch-4).

**GPU.** A processor with thousands of cores built for parallel math, especially matrix multiplication. It trains and serves almost all modern models, and its memory size and bandwidth decide what you can run and how fast. Used in [Ch 24](#ch-24), [Ch 4](#ch-4).

**Gradient.** The direction and size of change in the loss with respect to a parameter. Used in [F1](#foundations-1).

**Gradient clipping.** Rescaling gradients when their norm is too large. Used in [F5](#foundations-5).

**Gradient descent.** Updating weights by stepping against the gradient. Used in [F1](#foundations-1).

**GraphRAG.** RAG over a knowledge graph of entities and relations, with community summaries for corpus-wide questions. Used in [Ch 13](#ch-13).

**Greedy decoding.** Always choosing the most probable next token. Used in [Ch 5](#ch-5).

**Grounding.** Anchoring an answer in provided evidence, usually with citations. Used in [Ch 13](#ch-13), [Ch 20](#ch-20).

**GQA / MQA.** Grouped-query and multi-query attention. Key and value heads are shared across query heads to shrink the KV cache. Used in [Ch 24](#ch-24).

**GRPO.** An RL algorithm that compares groups of sampled answers instead of using a value model. Used with verifiable rewards to train reasoning models. Used in [Ch 3](#ch-3), [Ch 5](#ch-5).

**GRU.** A lighter gated recurrent unit with two gates. Used in [F6](#foundations-6).

**Guardrails.** Checks on inputs, tool calls and outputs that block unsafe or out-of-policy behavior. Used in [Ch 17](#ch-17), [Ch 25](#ch-25).

## H

**Hallucination.** Fluent but false or unsupported output. Used in [Ch 5](#ch-5), [Ch 13](#ch-13), [Ch 20](#ch-20).

**HBM / VRAM.** GPU main memory. It holds the weights, KV cache and activations, and its bandwidth limits how fast tokens are decoded. Used in [Ch 24](#ch-24).

**HNSW.** A layered graph index for fast approximate nearest-neighbor search. Fast and accurate but memory-hungry. Used in [Ch 11](#ch-11), [Ch 29](#ch-29).

**Human-in-the-loop (HITL).** Designing points where a person approves, edits or takes over. Used in [Ch 16](#ch-16), [Ch 27](#ch-27).

**Hybrid search.** Combining keyword (BM25) and vector search and fusing the results. Used in [Ch 12](#ch-12).

**HyDE.** Embedding an LLM-written hypothetical answer instead of the raw query to improve retrieval. Used in [Ch 12](#ch-12).

## I

**Idempotency.** An operation that has the same effect when repeated. Essential for safe retries of writes. Used in [Ch 14](#ch-14), [Ch 17](#ch-17).

**In-context learning.** Learning a task from examples in the prompt, without changing weights. Used in [Ch 6](#ch-6).

**Inference.** Running a trained model to get outputs, as opposed to training it. Used in [Ch 24](#ch-24).

**Instruction tuning.** SFT on instruction and response pairs so the model follows instructions. Used in [Ch 3](#ch-3).

**IVF.** An index that clusters vectors and searches only the nearest clusters. Used in [Ch 11](#ch-11), [Ch 29](#ch-29).

## J

**Jailbreak.** A prompt that tricks a model into ignoring its safety rules. Used in [Ch 9](#ch-9), [Ch 21](#ch-21).

**JSON mode / structured outputs.** API features that guarantee valid JSON or output that matches a schema. Used in [Ch 7](#ch-7).

## K

**KL penalty.** A term in RLHF that keeps the tuned model close to the reference model. Used in [Ch 3](#ch-3).

**KV cache.** Stored key and value vectors of past tokens, so each decode step computes only the new token. It often limits how many users a GPU can serve. Used in [Ch 1](#ch-1), [Ch 24](#ch-24).

## L

**Latency (TTFT, tokens per second, p95).** Time to first token, speed per token, and the 95th-percentile response time. Used in [Ch 22](#ch-22), [Ch 23](#ch-23).

**Layer normalization.** Normalizing across the features of each example. Used in transformers because it does not depend on batch size. Used in [F2](#foundations-2), [Ch 1](#ch-1).

**Lethal trifecta.** An agent that has private data, reads untrusted content and can send data out. A successful injection can then leak data. Used in [Ch 9](#ch-9), [Ch 17](#ch-17).

**LLM.** Large language model. Used in [Ch 1](#ch-1).

**LLM-as-a-judge.** Using a model to grade another model's output against a rubric. Used in [Ch 19](#ch-19), [Ch 20](#ch-20).

**LLMOps.** Operating LLM applications in production: APIs, cost, latency, serving, observability, CI/CD. Used in [Ch 22](#ch-22), [Ch 23](#ch-23), [Ch 24](#ch-24), [Ch 25](#ch-25).

**LoRA.** Training small low-rank matrices beside frozen weights, so fine-tuning needs far less memory. Used in [Ch 4](#ch-4).

**Loss function.** A single number measuring error, which training minimizes. Used in [F1](#foundations-1).

**Lost in the middle.** Models use information at the start and end of a long prompt better than information in the middle. Used in [Ch 2](#ch-2), [Ch 8](#ch-8).

**LSTM.** A recurrent network with gates and a cell state that preserves information over long sequences. Used in [F6](#foundations-6).

## M

**MCP (Model Context Protocol).** An open protocol for connecting AI applications to tools and data sources. Used in [Ch 15](#ch-15).

**Memory (agent).** Information put back into the context: short-term (the context itself) and long-term (episodic, semantic, procedural) in external stores. Used in [Ch 15](#ch-15), [Ch 28](#ch-28).

**Metadata filtering.** Restricting a search by attributes such as date, tenant or access group. Used in [Ch 12](#ch-12).

**Mixture of experts (MoE).** A model where each token is processed by only some of many expert sub-networks. Used in [Ch 24](#ch-24).

**MMR.** Maximal marginal relevance, which picks results that are relevant but not redundant. Used in [Ch 12](#ch-12).

**Model routing.** Sending each request to the cheapest model that can handle it. Used in [Ch 22](#ch-22).

**MRR.** Mean reciprocal rank of the first relevant result. Used in [Ch 20](#ch-20).

**Multi-agent system.** Several agents with their own contexts and tools cooperating on a task. Used in [Ch 16](#ch-16).

**Multi-head attention.** Several attention operations run in parallel with different learned projections. Used in [Ch 1](#ch-1).

**Multimodal model.** A model that handles images, audio or video as well as text. Used in [Ch 5](#ch-5), [Ch 26](#ch-26).

## N

**nDCG.** A ranking metric that rewards relevant results placed high and supports graded relevance. Used in [Ch 20](#ch-20).

**NF4.** A 4-bit data type designed for normally distributed weights, used in QLoRA. Used in [Ch 4](#ch-4).

**NLI (natural language inference).** Deciding whether one text supports another. Used to check faithfulness. Used in [Ch 20](#ch-20), [Ch 13](#ch-13).

**Normalization.** Rescaling inputs or activations to stable ranges. Used in [F2](#foundations-2).

## O

**OCR.** Converting images of text into text. Used in [F10](#foundations-10), [Ch 10](#ch-10).

**OOM (out of memory).** GPU or CPU memory exhausted. On GPUs it is usually fixed by limiting concurrency or context length, or by quantizing. Used in [Ch 24](#ch-24).

**OpenTelemetry.** A vendor-neutral standard for traces, metrics and logs. Used in [Ch 17](#ch-17), [Ch 25](#ch-25).

**Open-weight model.** A model whose weights can be downloaded. Not necessarily open source. Used in [Ch 5](#ch-5), [Ch 24](#ch-24).

**Orchestrator.** An agent or program that plans, delegates to other agents and combines results. Used in [Ch 16](#ch-16), [Ch 27](#ch-27).

**Overfitting.** Memorizing the training data: training loss falls while validation loss rises. Used in [F2](#foundations-2).

## P

**PagedAttention.** Storing the KV cache in fixed-size blocks like virtual memory, which cuts waste. The core idea of vLLM. Used in [Ch 24](#ch-24).

**Pairwise comparison.** Judging which of two outputs is better. Used in [Ch 20](#ch-20).

**Parameter.** A learned weight in a model. Used in [F1](#foundations-1).

**PEFT.** Parameter-efficient fine-tuning: training only a small number of added parameters. Used in [Ch 4](#ch-4).

**PII.** Personally identifiable information. Used in [Ch 25](#ch-25).

**Positional encoding.** Information about token order that is added because attention ignores order. RoPE is the common modern form. Used in [Ch 1](#ch-1).

**PPO.** The RL algorithm used in classic RLHF. Used in [Ch 3](#ch-3).

**Prefill / decode.** Prefill processes the prompt in parallel (compute-bound). Decode generates one token at a time (memory-bound). Used in [Ch 24](#ch-24).

**Prefix caching / prompt caching.** Reusing the computation for an identical prompt prefix, which cuts cost and time to first token. Used in [Ch 9](#ch-9), [Ch 23](#ch-23), [Ch 24](#ch-24).

**Pretraining.** The first, very large training stage on text, by next-token prediction. Used in [Ch 3](#ch-3).

**Prompt injection.** Untrusted text that changes a model's behavior against the developer's or user's intent. Used in [Ch 9](#ch-9), [Ch 21](#ch-21).

**Prompt template.** A prompt with variables that are filled in at runtime. Used in [Ch 7](#ch-7).

**PTQ / QAT.** Post-training quantization quantizes a trained model. Quantization-aware training simulates quantization during training. Used in [Ch 4](#ch-4).

**Pydantic.** A Python library for validating structured data. Used to validate model outputs. Used in [Ch 7](#ch-7), [Ch 30](#ch-30).

**PyTorch.** A deep learning framework built on tensors and autograd. Used in [F1](#foundations-1).

## Q

**QLoRA.** LoRA training on a 4-bit quantized base model. Used in [Ch 4](#ch-4).

**Quantization.** Using fewer bits per number to cut memory and speed up inference. Used in [Ch 4](#ch-4), [Ch 24](#ch-24).

**Query rewriting.** Reformulating the user's query (standalone, expanded, decomposed) for better retrieval. Used in [Ch 12](#ch-12).

## R

**RAG (retrieval-augmented generation).** Retrieving relevant documents at question time and putting them in the prompt so the model answers from them. Used in [Ch 10](#ch-10), [Ch 11](#ch-11), [Ch 12](#ch-12), [Ch 13](#ch-13).

**Rate limit (RPM, TPM, 429).** Provider caps on requests and tokens per minute. The 429 error means you hit one. Used in [Ch 23](#ch-23).

**ReAct.** Alternating thought, action and observation. Used in [Ch 15](#ch-15).

**Reasoning model.** A model trained with RL to produce a long chain of thought before answering. Used in [Ch 5](#ch-5).

**Recall@k.** The fraction of relevant items that appear in the top k results. Used in [Ch 20](#ch-20), [Ch 13](#ch-13).

**Red teaming.** Adversarially probing a system to find failures before attackers do. Used in [Ch 21](#ch-21).

**Regression testing.** Re-running a fixed test suite after every change to confirm nothing broke. Used in [Ch 21](#ch-21).

**Reranking.** A second stage that reorders retrieved candidates with a stronger model (usually a cross-encoder) to improve precision. Used in [Ch 12](#ch-12), [Ch 29](#ch-29).

**Residual connection.** Adding a layer's input to its output, which helps deep networks train. Used in [F4](#foundations-4), [Ch 1](#ch-1).

**Reward model / reward hacking.** A learned scorer of human preferences, and a policy exploiting its flaws. Used in [Ch 3](#ch-3).

**RLHF / RLAIF / RLVR.** Reinforcement learning from human feedback, from AI feedback, and with verifiable rewards. Used in [Ch 3](#ch-3), [Ch 5](#ch-5).

**RNN.** A recurrent network that processes a sequence step by step, carrying a hidden state. Used in [F5](#foundations-5).

**RoPE.** Rotary position embedding, a way of encoding token position inside attention. Used in [Ch 1](#ch-1).

**Row-level security (RLS).** Database rules that restrict which rows a user can read, used as a safety net for multi-tenant data. Used in [Ch 28](#ch-28).

**RRF (reciprocal rank fusion).** Merging ranked lists by summing 1 / (k + rank), so no score normalization is needed. Used in [Ch 12](#ch-12).

**Rubric.** An explicit set of criteria and levels that defines what good means for humans and judges. Used in [Ch 19](#ch-19).

## S

**Sampling.** Choosing the next token from the model's probability distribution (temperature, top-p, top-k). Used in [Ch 5](#ch-5).

**Scaling laws.** The finding that loss falls predictably as parameters, data and compute grow. Used in [Ch 3](#ch-3).

**Self-attention.** Attention where tokens attend to other tokens in the same sequence. Used in [Ch 1](#ch-1), [F8](#foundations-8).

**Self-consistency.** Sampling several reasoning paths and taking the majority answer. Used in [Ch 8](#ch-8).

**Semantic cache.** A cache that returns a stored answer for a question of similar meaning. Fast but risky. Used in [Ch 23](#ch-23).

**Seq2seq.** An encoder-decoder model that maps an input sequence to an output sequence, such as in translation. Used in [F8](#foundations-8).

**SFT (supervised fine-tuning).** Training on prompt and ideal-response pairs. Used in [Ch 3](#ch-3).

**Sharding.** Splitting an index or database across machines. Used in [Ch 29](#ch-29).

**Shadow mode.** Running a new version on live traffic without showing its output to users, to compare safely. Used in [Ch 21](#ch-21), [Ch 25](#ch-25).

**SLO (service-level objective).** A target for a service metric, such as p95 time to first token under 1 second. Used in [Ch 24](#ch-24), [Ch 29](#ch-29).

**Softmax.** Turns a vector of scores into probabilities that sum to 1. Used in [Ch 1](#ch-1), [Ch 5](#ch-5).

**Speculative decoding.** A small draft model proposes tokens and the large model verifies them in parallel, for faster decoding with the same output distribution. Used in [Ch 24](#ch-24), [Ch 23](#ch-23).

**SSE (server-sent events).** One-way streaming of events over HTTP. Used to stream model output to browsers. Used in [Ch 22](#ch-22), [Ch 30](#ch-30).

**STT / TTS / VAD.** Speech-to-text, text-to-speech and voice activity detection, the parts of a voice pipeline. Used in [Ch 26](#ch-26).

**Streaming.** Sending tokens to the client as they are generated. Used in [Ch 22](#ch-22).

**Structured outputs.** See JSON mode. Used in [Ch 7](#ch-7).

**Subword tokenization.** Splitting words into pieces so any word can be represented. Used in [Ch 2](#ch-2), [F9](#foundations-9).

**System prompt.** Persistent developer instructions at the start of a conversation. Used in [Ch 6](#ch-6).

## T

**Temperature.** A setting that scales the logits before softmax: low is focused, high is random. Used in [Ch 5](#ch-5).

**Tensor.** An n-dimensional array with a shape, dtype and device. Used in [F1](#foundations-1).

**Tensor core.** Specialized GPU units for fast low-precision matrix math. Used in [Ch 24](#ch-24).

**Tensor parallelism.** Splitting each layer's matrices across several GPUs. Used in [Ch 24](#ch-24).

**Test-time compute.** Spending more compute at inference (longer thinking, more samples) to improve answers. Used in [Ch 5](#ch-5), [Ch 8](#ch-8).

**TF-IDF.** Weighting words by how often they appear in a document and how rare they are across documents. Used in [F9](#foundations-9), [Ch 12](#ch-12).

**Token.** A chunk of text (a word, part of a word or punctuation) mapped to an integer ID. Used in [Ch 2](#ch-2).

**Tool design.** Writing tool names, descriptions and schemas so a model can use them well. Used in [Ch 14](#ch-14).

**Top-k / top-p.** Sampling that keeps only the k most likely tokens, or the smallest set whose probabilities add up to p. Used in [Ch 5](#ch-5).

**Tracing.** Recording every step of a run (model calls, tool calls, retrievals) as spans. Used in [Ch 17](#ch-17), [Ch 25](#ch-25).

**Transformer.** The attention-based architecture behind modern LLMs. Used in [Ch 1](#ch-1), [F8](#foundations-8).

**TTFT (time to first token).** How long until the first token of a response appears. Used in [Ch 22](#ch-22), [Ch 23](#ch-23).

## U to Z

**Underfitting.** A model too simple or undertrained to fit even the training data. Used in [F2](#foundations-2).

**Vector database.** A store for embeddings plus metadata that finds nearest neighbors quickly. Used in [Ch 11](#ch-11).

**vLLM.** An open-source LLM serving engine built on PagedAttention and continuous batching. Used in [Ch 24](#ch-24).

**ViT (Vision Transformer).** A transformer that processes an image as a sequence of patches. Used as the vision encoder in many multimodal models. Used in [F4](#foundations-4), [Ch 5](#ch-5).

**VLM (vision-language model).** A model that takes images and text together. Used in [Ch 5](#ch-5), [F10](#foundations-10).

**WebRTC.** A protocol for low-latency real-time audio and video. Used in [Ch 26](#ch-26).

**Weight decay.** A penalty on large weights that reduces overfitting. Used in [F2](#foundations-2).

**Weights.** The learned numbers in a model. Used in [F1](#foundations-1).

**WER / CER.** Word error rate and character error rate, measured by edit distance against a reference. Used for speech and OCR. Used in [F7](#foundations-7), [F10](#foundations-10).

**word2vec.** An early method that learns one vector per word from the words around it. Used in [F9](#foundations-9).

**Zero-shot prompting.** Giving an instruction with no examples. Used in [Ch 6](#ch-6).

<script type="text/markdown" id="md-foundations-1">
# Part 1: Tensors, autograd and the training loop

Every neural network, from a one-neuron model to an LLM, trains with the same five steps: forward pass, loss, backward pass, weight update, gradient reset. This part builds that loop from scratch.

## Tensors

A tensor is an n-dimensional array with a shape, a dtype and a device. Most real bugs are shape bugs, so print `.shape` often.

```python
import torch
a = torch.tensor([[1., 2., 3.], [4., 5., 6.]])
print(a.shape, a.dtype, a.device)    # torch.Size([2, 3]) torch.float32 cpu
print(a @ a.T)                       # matrix multiply, shape (2, 2)
print(a.sum(dim=0))                  # reduce over rows, shape (3,)
print(a.reshape(3, 2).shape)         # reshape keeps the data, changes the view
print((a + torch.tensor([10., 20., 30.])).shape)   # broadcasting: (2,3) + (3,) works
```

**Broadcasting** lines shapes up from the right and stretches size-1 dimensions. It is convenient and it hides bugs, as the break-it table below shows.

## Loss functions

The loss is one number that says how wrong the model is. Training means making it smaller.

| Task | Loss | Notes |
| --- | --- | --- |
| Regression | Mean squared error (MSE) | Punishes large errors heavily |
| Binary classification | Binary cross-entropy | Model outputs one logit |
| Multi-class classification | Cross-entropy | Model outputs one logit per class |
| Next-token prediction (LLMs) | Cross-entropy over the vocabulary | Same loss as multi-class, from Chapter 3 |

## Autograd and gradient descent

Mark a tensor with `requires_grad=True` and PyTorch records every operation on it as a graph. `.backward()` walks that graph in reverse and applies the chain rule to get the gradient of the loss with respect to each parameter.

```python
w = torch.tensor(2.0, requires_grad=True)
loss = (3 * w - 12) ** 2        # minimum at w = 4
loss.backward()
print(w.grad)                   # 2*(3w-12)*3 = -36
```

The gradient points toward higher loss, so each update steps the opposite way. The step size is the learning rate:

```latex
w \leftarrow w - \eta \, \frac{\partial L}{\partial w}
```

## The full training loop

Fit a line to noisy data whose true answer is `w = 3`, `b = 2`.

```python
import torch
torch.manual_seed(0)

x = torch.randn(200, 1)
y = 3 * x + 2 + 0.1 * torch.randn(200, 1)

w = torch.zeros(1, requires_grad=True)
b = torch.zeros(1, requires_grad=True)
lr = 0.1

for step in range(100):
    pred = w * x + b                   # 1. forward pass
    loss = ((pred - y) ** 2).mean()    # 2. loss
    loss.backward()                    # 3. backward: fills w.grad and b.grad
    with torch.no_grad():              # 4. update (do not record this step)
        w -= lr * w.grad
        b -= lr * b.grad
    w.grad.zero_(); b.grad.zero_()     # 5. reset gradients
    if step % 20 == 0:
        print(step, round(loss.item(), 4))

print(w.item(), b.item())              # close to 3 and 2
```

## Break it

Write your prediction first, then change one thing at a time.

| # | Change | What happens and why |
| --- | --- | --- |
| 1 | `lr = 1.2` | Loss grows every step and ends as `nan` or `inf`. Each step overshoots the minimum by more than the last |
| 2 | Delete the `.zero_()` line | Gradients accumulate across steps, so updates grow and training turns erratic or diverges |
| 3 | Remove `with torch.no_grad():` | `RuntimeError`: a leaf variable that requires grad is used in an in-place operation |
| 4 | Delete `loss.backward()` | `w.grad` is `None`, so the update raises a `TypeError` |
| 5 | Make `y` shape `(200,)` instead of `(200, 1)` | No error. `pred - y` silently broadcasts to `(200, 200)`, and the model trains to the wrong answer. This is the classic silent shape bug |
| 6 | `lr = 0.0001` | Loss falls but far too slowly after 100 steps. Too small a learning rate looks like "it works but never finishes" |

**Key takeaway:** the loop never changes. Bigger models only change how `pred` is computed and which loss is used.
</script>
<script type="text/markdown" id="md-foundations-2">
# Part 2: Training basics with nn.Module

Part 1 wrote every step by hand. Real code uses three helpers: `nn.Module` holds the layers, an optimizer does the update, and a `DataLoader` feeds batches. The five steps stay identical.

```python
import torch, torch.nn as nn
from torch.utils.data import TensorDataset, DataLoader, random_split

torch.manual_seed(0)
X = torch.randn(1000, 2)
y = (X[:, 0] * X[:, 1] > 0).long()            # label depends on both features

ds = TensorDataset(X, y)
train_ds, val_ds = random_split(ds, [800, 200])
train_dl = DataLoader(train_ds, batch_size=32, shuffle=True)
val_dl = DataLoader(val_ds, batch_size=200)

model = nn.Sequential(nn.Linear(2, 16), nn.ReLU(), nn.Linear(16, 2))
loss_fn = nn.CrossEntropyLoss()               # expects raw logits, not softmax output
opt = torch.optim.Adam(model.parameters(), lr=1e-2)

for epoch in range(30):
    model.train()
    for xb, yb in train_dl:
        opt.zero_grad()
        loss = loss_fn(model(xb), yb)
        loss.backward()
        opt.step()
    model.eval()
    with torch.no_grad():
        xv, yv = next(iter(val_dl))
        acc = (model(xv).argmax(1) == yv).float().mean().item()
    if epoch % 5 == 0:
        print(epoch, round(loss.item(), 3), round(acc, 3))
```

## Vocabulary you must know

| Term | Meaning |
| --- | --- |
| Batch | The examples used for one weight update (here 32) |
| Epoch | One full pass over the training set |
| Iteration (step) | One batch, one update |
| Train / validation / test split | Train fits weights, validation tunes choices (learning rate, model size), test is touched once at the end |
| Logits | Raw model outputs before softmax |

## Optimizers

| Optimizer | Idea | When |
| --- | --- | --- |
| SGD | Step along the gradient | Simple baseline, needs a tuned learning rate |
| SGD + momentum | Keep a running average of past gradients, so it smooths noise and rolls through flat spots | Classic for CNNs |
| Adam | Per-parameter adaptive step sizes from running averages of the gradient and its square | The default for most deep learning |
| AdamW | Adam with weight decay applied correctly | Standard for transformers and fine-tuning |

Learning rate is the most important hyperparameter. A **schedule** (warmup, then decay) is standard for transformers: start small, rise, then shrink.

## Underfitting and overfitting

- **Underfitting:** training and validation loss are both high. The model is too small, trained too briefly, or the learning rate is wrong.
- **Overfitting:** training loss keeps falling while validation loss rises. The model memorizes the training set.

**Regularization** fights overfitting: more data and data augmentation, weight decay (an L2 penalty on weights), dropout (randomly zero activations during training), early stopping (stop when validation loss stops improving), and a smaller model.

## Initialization and normalization

- **Initialization:** weights start random, but the scale matters. Xavier/Glorot suits tanh and sigmoid, He/Kaiming suits ReLU. PyTorch picks a sensible default for common layers.
- **BatchNorm** normalizes activations across the batch (common in CNNs). **LayerNorm** normalizes across features within each example (used in transformers, because it does not depend on batch size).
- **Normalize inputs** (zero mean, unit variance). Unscaled inputs make the loss surface badly shaped and slow training.

## Metrics beyond accuracy

Accuracy misleads on imbalanced data: a model that always says "not fraud" is 99% accurate if 1% of cases are fraud.

| Metric | Question it answers |
| --- | --- |
| Precision | Of the items flagged positive, how many were right? |
| Recall | Of the true positives, how many did we find? |
| F1 | Balance of precision and recall |
| Confusion matrix | Which classes get confused with which |
| ROC-AUC | How well the model ranks positives above negatives, across thresholds |

## Break it

| # | Change | What happens and why |
| --- | --- | --- |
| 1 | Delete `opt.zero_grad()` | Gradients accumulate across batches, so training becomes unstable |
| 2 | Add `nn.Softmax` as the last layer, keep `CrossEntropyLoss` | It still trains, but worse. The loss applies softmax itself, so you softmax twice. A very common bug |
| 3 | Set `shuffle=False` on data sorted by label | Each batch contains one class, the model swings between classes, and accuracy is poor |
| 4 | Skip `model.eval()` on a model with dropout | Validation scores are noisy and lower, because dropout is still active |
| 5 | Evaluate on the training data and call it accuracy | You will report a high score and learn nothing. Always report validation or test numbers |
| 6 | Multiply `X` by 1000 without normalizing | Training becomes unstable or very slow |
| 7 | Use 20 training examples and 2000 epochs | Training loss goes to near zero while validation accuracy stalls. This is overfitting you can watch happen |
| 8 | Put the validation examples in the training set | Validation looks great and is meaningless. This is data leakage |
</script>
<script type="text/markdown" id="md-foundations-3">
# Part 3: ANN and MLP (the feed-forward network)

An artificial neural network (ANN), also called a multi-layer perceptron (MLP), is layers of neurons where every neuron connects to every neuron in the next layer. It is the simplest deep network, and it still sits inside every transformer block as the feed-forward layer.

## One neuron, one layer

```latex
y = \sigma(w_1 x_1 + w_2 x_2 + \dots + b)
```

The weights decide how much each input matters, `b` is a bias, and `sigma` is a non-linear activation. A layer is many neurons side by side, which is one matrix multiply plus the activation. Stacking layers makes the network deep.

## Activation functions

| Activation | Shape | Notes |
| --- | --- | --- |
| Sigmoid | Squashes to 0 to 1 | Gradients shrink at both ends, so deep sigmoid networks train badly. Still used for binary outputs |
| Tanh | Squashes to -1 to 1 | Zero-centered, but also saturates. Used inside RNNs and LSTMs |
| ReLU | `max(0, x)` | Cheap, does not saturate for positive inputs, the default for years. Neurons can "die" if stuck at 0 |
| GELU / SiLU | Smooth ReLU-like curves | Standard in transformers |
| Softmax | Turns a vector into probabilities that sum to 1 | Output layer for multi-class problems |

## Why the activation matters

Without a non-linearity, stacked linear layers collapse into one linear layer, so depth adds nothing. The XOR problem shows it: no straight line separates the XOR points, but one hidden layer with a non-linearity can.

```python
import torch, torch.nn as nn
X = torch.tensor([[0.,0.],[0.,1.],[1.,0.],[1.,1.]])
y = torch.tensor([[0.],[1.],[1.],[0.]])

model = nn.Sequential(nn.Linear(2, 8), nn.Tanh(), nn.Linear(8, 1), nn.Sigmoid())
opt = torch.optim.Adam(model.parameters(), lr=0.05)
for _ in range(500):
    opt.zero_grad()
    loss = nn.functional.binary_cross_entropy(model(X), y)
    loss.backward(); opt.step()
print(model(X).round().T)       # tensor([[0., 1., 1., 0.]])
```

## Key ideas

- **Universal approximation:** one hidden layer that is wide enough can approximate any reasonable function. That says it is possible, not that it is easy to learn or efficient.
- **Why depth:** deep networks build features in stages (simple, then abstract) and need far fewer parameters than a very wide shallow one for many tasks.
- **Backpropagation** applies the chain rule layer by layer, from the loss back to the first layer.
- **Parameter count:** a layer from `n_in` to `n_out` has `n_in * n_out + n_out` parameters.

## Where MLPs fall short

An MLP treats its input as a flat list with no structure.

- A 224x224 RGB image has 150,528 values. One hidden layer of 1,000 units would need about 150 million weights, and it would not know that neighboring pixels are related. **CNNs fix this.**
- A sentence is a sequence where order and length vary, and an MLP needs a fixed input size. **RNNs and transformers fix this.**

## Break it

| # | Change | What happens and why |
| --- | --- | --- |
| 1 | Remove `nn.Tanh()` from the XOR model | It cannot learn XOR, and outputs hover near 0.5. The model is linear |
| 2 | Use 1 hidden unit | XOR usually fails: too little capacity |
| 3 | Build a 20-layer network with `nn.Sigmoid` between layers | The early layers' gradients become tiny and the loss barely moves. Print `layer.weight.grad.abs().mean()` per layer to see it vanish |
| 4 | Swap sigmoid for ReLU in experiment 3 | Gradients reach the early layers, and training works much better |
| 5 | Initialize all weights to zero | Every neuron in a layer gets the same gradient and stays identical, so the network never differentiates its neurons (the symmetry problem) |
</script>
<script type="text/markdown" id="md-foundations-4">
# Part 4: CNN (convolutional neural networks)

A CNN slides small learned filters over an image to detect local patterns, then stacks layers so early filters find edges and later ones find shapes and objects. It exploits two facts about images: nearby pixels are related, and a pattern means the same thing wherever it appears.

## Convolution

A filter (kernel), for example 3x3, slides across the input. At each position it multiplies its weights with the pixels under it and sums the result into one output value. The grid of outputs is a **feature map**.

- **Weight sharing:** the same filter is reused at every position, so the layer has very few parameters.
- **Local connectivity:** each output looks only at a small patch.
- **Translation equivariance:** shift the input and the feature map shifts with it.
- **Channels:** an RGB image has 3 input channels, and a layer with 16 filters produces 16 output channels (one feature map per filter).

## Shapes and parameter counts

```latex
W_{out} = \left\lfloor \frac{W_{in} - K + 2P}{S} \right\rfloor + 1
```

`K` is the kernel size, `P` the padding and `S` the stride.

| Setting | Effect |
| --- | --- |
| Padding | Adds a border of zeros. "Same" padding keeps the output size equal to the input size |
| Stride | Step size of the filter. Stride 2 halves the output size |
| Kernel size | 3x3 is the common choice. Stacking two 3x3 layers sees a 5x5 area with fewer parameters than one 5x5 |
| Pooling | Max or average over small windows. Shrinks the map and gives some shift tolerance |

**Parameter example:** a conv layer with 3 input channels, 16 filters and 3x3 kernels has `3 * 3 * 3 * 16 + 16 = 448` parameters, whatever the image size. A dense layer from the same image would need millions.

**Receptive field:** the input region that influences one output value. It grows as you stack layers and pool, which is how deep layers "see" whole objects.

## A small CNN

```python
import torch, torch.nn as nn

class SmallCNN(nn.Module):
    def __init__(self, n_classes=10):
        super().__init__()
        self.features = nn.Sequential(
            nn.Conv2d(1, 8, kernel_size=3, padding=1), nn.ReLU(),   # (1,28,28) -> (8,28,28)
            nn.MaxPool2d(2),                                         # -> (8,14,14)
            nn.Conv2d(8, 16, kernel_size=3, padding=1), nn.ReLU(),  # -> (16,14,14)
            nn.MaxPool2d(2),                                         # -> (16,7,7)
        )
        self.head = nn.Linear(16 * 7 * 7, n_classes)

    def forward(self, x):                       # x: (batch, 1, 28, 28)
        return self.head(self.features(x).flatten(1))

model = SmallCNN()
print(model(torch.randn(4, 1, 28, 28)).shape)   # torch.Size([4, 10])
print(sum(p.numel() for p in model.parameters()))
```

Train it with the loop from Part 2 on MNIST (`torchvision.datasets.MNIST`) and it reaches over 98% accuracy in a few epochs on a CPU.

## Architectures worth knowing

| Model | Contribution |
| --- | --- |
| LeNet (1990s) | The first practical CNN, digit recognition |
| AlexNet (2012) | Deep CNN on GPUs, ReLU and dropout, started the deep learning wave |
| VGG | Many stacked 3x3 convolutions |
| ResNet | **Skip connections**: output = `x + F(x)`, so gradients flow through the shortcut and networks can be 100+ layers deep. The same residual idea is in transformers |
| EfficientNet, MobileNet | Accuracy and size trade-offs for mobile and edge |
| ViT (Vision Transformer) | Replaces convolutions with attention over image patches. Used as the vision encoder in many multimodal models (Chapter 5) |

## 1D convolutions and other uses

A 1D CNN slides filters along a sequence, so on text it acts like a learned n-gram detector. It is fast and parallel, which is why CNNs appear in speech models, time-series models and the feature extractor inside CRNN (Part 7).

Typical uses: image classification, object detection, segmentation, OCR and document layout analysis, medical imaging, and feature extraction for other models.

## Break it

| # | Change | What happens and why |
| --- | --- | --- |
| 1 | Change the head to `nn.Linear(16*5*5, 10)` | Shape error: the flattened size no longer matches. Always compute the flatten size |
| 2 | Remove `padding=1` | Feature maps shrink at each layer (28 to 26 to 24), and again the head size breaks |
| 3 | Shuffle the pixels of every image with one fixed random permutation (the same for all images), then train | An MLP does about as well as before, but the CNN loses its advantage. The CNN relies on spatial structure |
| 4 | Train on centered digits, test on digits shifted by 6 pixels | Accuracy drops. Convolution is shift-equivariant, but the flatten and linear head is not shift-invariant, so add pooling and data augmentation |
| 5 | Remove the ReLU layers | The network becomes linear and accuracy drops noticeably |
| 6 | Compare parameter counts of this CNN and an MLP with the same accuracy | The CNN needs far fewer parameters. That is the point of weight sharing |
| 7 | Add `nn.Dropout` and `nn.BatchNorm2d` between layers | Compare training stability and validation accuracy |
</script>
<script type="text/markdown" id="md-foundations-5">
# Part 5: RNN (recurrent neural networks)

An RNN reads a sequence one step at a time and carries a **hidden state** forward, so each step can use a summary of everything before it. It was the first neural answer to text, speech and time series, where order and length vary.

## The recurrence

```latex
h_t = \tanh(W_{xh} x_t + W_{hh} h_{t-1} + b)
```

The same weights are reused at every step, which is how one model handles sequences of any length. The hidden state `h_t` is the only memory.

Common shapes of the task:

| Pattern | Example | What you use |
| --- | --- | --- |
| Many to one | Sentiment of a sentence | The last hidden state, or a pooled one |
| Many to many, same length | Tag every word (part of speech) | The hidden state at every step |
| One to many | Generate a caption from an image feature | Feed each output back as the next input |
| Many to many, different length | Translation | Encoder-decoder (seq2seq), see Part 8 |

## Training: backpropagation through time (BPTT)

Unroll the loop so the network becomes one very deep network with a copy of the cell per time step and shared weights. Backpropagation then runs backward across all the steps. A sequence of 100 tokens is a 100-layer network.

## The core problem: vanishing and exploding gradients

The gradient flowing back across `k` steps is a product of `k` similar Jacobians, roughly the recurrent weight matrix times the `tanh` derivative, repeated `k` times.

- If those factors are mostly **below 1**, the product shrinks toward zero. Early steps stop learning, so the network cannot connect distant words. This is **vanishing gradients**.
- If they are **above 1**, the product blows up and training becomes unstable. This is **exploding gradients**. The fix is **gradient clipping**: rescale the gradient when its norm exceeds a limit.

```python
torch.nn.utils.clip_grad_norm_(model.parameters(), max_norm=1.0)   # call between backward() and step()
```

Clipping fixes explosion. Nothing in a plain RNN fixes vanishing, which is why LSTMs exist (Part 6).

## A task that exposes the problem

**Remember the first token:** feed a sequence whose first value is a random class (0 to 4) followed by noise for `T` steps, and ask the model for the first value at the end. The only way to succeed is to carry information across `T` steps.

```python
import torch, torch.nn as nn

def make_batch(n, T):
    first = torch.randint(0, 5, (n,))
    x = torch.randn(n, T, 5)                              # noise features
    x[:, 0, :] = nn.functional.one_hot(first, 5).float()  # the signal, only at step 0
    return x, first

class Net(nn.Module):
    def __init__(self, cell=nn.RNN):                      # swap in nn.LSTM / nn.GRU later
        super().__init__()
        self.rnn = cell(5, 32, batch_first=True)          # input (batch, time, features)
        self.out = nn.Linear(32, 5)
    def forward(self, x):
        _, h = self.rnn(x)                                # nn.RNN and nn.GRU return h of shape (layers, batch, hidden)
        return self.out(h[-1] if not isinstance(h, tuple) else h[0][-1])   # LSTM returns (h, c)

def run(T, cell=nn.RNN, steps=600):
    torch.manual_seed(0)
    model = Net(cell); opt = torch.optim.Adam(model.parameters(), 1e-2)
    for _ in range(steps):
        x, y = make_batch(64, T)
        opt.zero_grad()
        nn.functional.cross_entropy(model(x), y).backward()
        torch.nn.utils.clip_grad_norm_(model.parameters(), 1.0)
        opt.step()
    x, y = make_batch(1000, T)
    return (model(x).argmax(1) == y).float().mean().item()

for T in (5, 20, 60):
    print(T, run(T))        # expect high accuracy at T=5, falling toward 0.2 (chance) as T grows
```

I have not run this exact script, so the numbers will vary. The expected pattern is a plain RNN that does well on short sequences and falls toward chance (0.2 here) on long ones.

## Practical notes

- `batch_first=True` makes tensors `(batch, time, features)`. The default is `(time, batch, features)`, a frequent source of silent shape bugs.
- Sequences in a batch have different lengths: pad them to equal length and use `pack_padded_sequence`, or mask the padded steps, so padding does not pollute the hidden state.
- RNNs are inherently sequential: step `t` waits for step `t-1`, so they cannot use a GPU's parallelism across time. This is the second reason transformers won (Chapter 1).
- **Teacher forcing:** when training a generator, feed it the true previous token and not its own prediction. It speeds training but creates a train/inference mismatch.

## Break it

| # | Change | What happens and why |
| --- | --- | --- |
| 1 | Run the task above for T = 5, 20, 60, 120 | Accuracy falls as T grows. You are watching vanishing gradients |
| 2 | Remove `clip_grad_norm_` and raise the learning rate to 0.1 | Loss spikes or becomes `nan` from exploding gradients |
| 3 | Print the gradient norm of the first step's input weights during training | It is far smaller for long T. This is the vanishing gradient, measured |
| 4 | Forget `batch_first=True` while passing `(batch, time, features)` | No error, but the model treats batch as time. Accuracy is garbage. Another silent shape bug |
| 5 | Replace `tanh` with `ReLU` inside the RNN | Gradients can explode, and training is less stable |
| 6 | Feed padded sequences without masking | Results depend on how much padding each example has |
</script>
<script type="text/markdown" id="md-foundations-6">
# Part 6: LSTM and GRU

An LSTM (Long Short-Term Memory) is an RNN with a separate memory lane, the **cell state**, and **gates** that learn what to write, keep and read. It fixes vanishing gradients by letting information and gradients flow along the cell state with only small, learned modifications.

## The cell

At each step the LSTM sees the input `x_t` and the previous hidden state `h_{t-1}` and cell state `c_{t-1}`.

```latex
\begin{aligned}
f_t &= \sigma(W_f [h_{t-1}, x_t] + b_f) && \text{forget gate: what to erase from } c \\
i_t &= \sigma(W_i [h_{t-1}, x_t] + b_i) && \text{input gate: how much new info to write} \\
\tilde{c}_t &= \tanh(W_c [h_{t-1}, x_t] + b_c) && \text{candidate new content} \\
c_t &= f_t \odot c_{t-1} + i_t \odot \tilde{c}_t && \text{cell state update (additive)} \\
o_t &= \sigma(W_o [h_{t-1}, x_t] + b_o) && \text{output gate: what to expose} \\
h_t &= o_t \odot \tanh(c_t) && \text{new hidden state}
\end{aligned}
```

Plain words:

- **Forget gate:** a number between 0 and 1 per memory slot. Near 1 keeps the slot, near 0 erases it.
- **Input gate and candidate:** decide what new information to store.
- **Output gate:** decides which part of the memory the rest of the network sees.

## Why it fixes vanishing gradients

The key line is `c_t = f_t * c_{t-1} + i_t * c~_t`. The cell state is updated by **multiplying by the forget gate and adding**, and not by pushing everything through a matrix and a `tanh` every step. When the forget gate is near 1, the gradient flows backward through `c` almost unchanged, like the skip connection in ResNet. The network can therefore keep a signal for hundreds of steps.

Two practical details: initialize the **forget gate bias to about 1** so the cell starts by remembering, and keep **gradient clipping** because LSTMs can still explode.

## GRU: a lighter alternative

A GRU (Gated Recurrent Unit) merges the cell and hidden state and uses two gates: an **update gate** (how much of the old state to keep) and a **reset gate** (how much old state to use when forming the new candidate). It has fewer parameters and trains faster, and it often matches an LSTM in accuracy.

| Model | Gates | State | Parameters per layer (input `x`, hidden `h`) |
| --- | --- | --- | --- |
| RNN | none | `h` | `h*(h+x) + h` |
| GRU | 2 (+ candidate) | `h` | `3 * (h*(h+x) + h)` |
| LSTM | 3 (+ candidate) | `h` and `c` | `4 * (h*(h+x) + h)` |

(PyTorch stores two bias vectors per gate, so its exact counts are slightly higher. The ratio is what matters: an LSTM is about 4 times a plain RNN.)

## Variants you will hear about

- **Bidirectional:** run one RNN forward and one backward over the sequence and concatenate their states, so each position sees both left and right context. Useful when you have the whole input (tagging, OCR, speech recognition) and not for generation.
- **Stacked (multi-layer):** feed one layer's outputs into the next, with dropout between layers.
- **Seq2seq encoder-decoder:** one LSTM encodes the input into a final state, another decodes the output from it. This is the pre-transformer design for translation (see Part 8 for its bottleneck).

## Use it

Swap the cell in the Part 5 experiment: `Net(cell=nn.LSTM)` and `Net(cell=nn.GRU)`, and run `run(T, cell=...)` for T = 5, 20, 60, 120.

```python
lstm = nn.LSTM(input_size=5, hidden_size=32, num_layers=2, batch_first=True,
               bidirectional=True, dropout=0.1)
out, (h, c) = lstm(torch.randn(8, 20, 5))
print(out.shape)    # (8, 20, 64): bidirectional doubles the feature size
print(h.shape)      # (4, 8, 32): layers * directions, batch, hidden
```

**Where LSTMs are still used:** small and low-latency models, streaming speech, sensor and time-series data, and as the sequence layer in CRNN (Part 7). For large-scale language tasks, transformers replaced them.

## Break it

| # | Change | What happens and why |
| --- | --- | --- |
| 1 | Run the remember-the-first-token task with RNN, GRU and LSTM at T = 60 and 120 | RNN falls toward chance. GRU and LSTM hold up much longer. This is the whole argument for gates |
| 2 | Set the LSTM's forget gate bias to a large negative number | The cell forgets immediately, and long-range memory fails |
| 3 | Remove gradient clipping and raise the learning rate | Training can still diverge. Gates do not stop exploding gradients |
| 4 | Try T = 1000 | Even LSTMs struggle. Gates extend memory, they do not make it unlimited. This motivates attention |
| 5 | Use `bidirectional=True` and then feed the output to a next-token predictor | It cheats: the backward direction sees the future tokens. Bidirectional models are wrong for generation |
| 6 | Compare training time per epoch of LSTM and a small transformer at the same size on long sequences | The transformer parallelizes across time, so it is faster on a GPU, while the LSTM is sequential |
</script>
<script type="text/markdown" id="md-foundations-7">
# Part 7: CRNN and CTC (reading text from images)

A CRNN (Convolutional Recurrent Neural Network) reads a line of text from an image. A CNN turns the image into a sequence of feature columns, a bidirectional LSTM reads that sequence left to right and right to left, and a **CTC loss** lets the model learn without knowing which pixel column belongs to which character. It is the classic design for OCR, handwriting and license-plate reading.

## The problem

Given a cropped image of a word like "hello", output the string. Two things make this hard: the number of characters varies, and nobody has labeled where each character sits in the image. You only have the image and the final string.

## The architecture

1. **Input:** a text-line image, resized to a fixed height (for example 32 px) and variable width, shape `(batch, 1, 32, W)`.
2. **CNN:** stacked convolutions and poolings that shrink the height to 1 but keep most of the width, giving a feature map of shape `(batch, C, 1, W')`. Each of the `W'` columns describes a thin vertical slice of the image.
3. **Reshape to a sequence:** treat the `W'` columns as time steps, giving `(W', batch, C)`.
4. **Bidirectional LSTM:** reads the column sequence in both directions so each column knows its left and right context (needed to tell "rn" from "m").
5. **Linear layer:** maps each time step to `num_classes + 1` scores. The extra class is the CTC **blank** symbol.
6. **log-softmax and CTC loss:** per-step class probabilities go into the loss with the target string.

CNN for local visual features, RNN for context along the line, CTC for alignment-free training. That division of labor is the point of the name.

## CTC (Connectionist Temporal Classification)

The model emits one prediction per time step, and there are usually more time steps than characters. CTC defines how to turn the per-step predictions into a string:

1. **Blank symbol:** a special "no character here" label, written `-`.
2. **Collapse rule:** merge repeated labels, then remove blanks.

So `h h - e e - l l - l o o` collapses to "hello". The blank between the two `l` groups is what lets the model write a double letter: without it, `l l l` would collapse to a single `l`.

To train, CTC sums the probability of **all** step-by-step paths that collapse to the target string (computed efficiently with dynamic programming) and minimizes the negative log of that sum. No alignment labels are needed.

**Decoding at inference:**

| Method | How | Trade-off |
| --- | --- | --- |
| Greedy | Take the highest-probability label at each step, then collapse | Fast, usually good |
| Beam search | Keep the best few partial strings | Slower, a bit more accurate |
| Beam search + language model or lexicon | Prefer valid words | Helps on noisy text, can wrongly "correct" names and IDs |

## Code sketch

```python
import torch, torch.nn as nn

class CRNN(nn.Module):
    def __init__(self, n_classes):                       # n_classes includes the blank at index 0
        super().__init__()
        self.cnn = nn.Sequential(
            nn.Conv2d(1, 64, 3, padding=1), nn.ReLU(), nn.MaxPool2d(2, 2),         # H 32 -> 16, W / 2
            nn.Conv2d(64, 128, 3, padding=1), nn.ReLU(), nn.MaxPool2d(2, 2),       # H 16 -> 8,  W / 4
            nn.Conv2d(128, 256, 3, padding=1), nn.ReLU(), nn.MaxPool2d((2, 1), (2, 1)),  # H 8 -> 4, keep W
            nn.Conv2d(256, 256, 3, padding=1), nn.ReLU(), nn.MaxPool2d((4, 1), (4, 1)),  # H 4 -> 1, keep W
        )
        self.rnn = nn.LSTM(256, 128, num_layers=2, bidirectional=True)
        self.fc = nn.Linear(256, n_classes)

    def forward(self, x):                                # x: (N, 1, 32, W)
        f = self.cnn(x).squeeze(2)                       # (N, 256, W')
        f = f.permute(2, 0, 1)                           # (T=W', N, 256): time first for nn.LSTM
        out, _ = self.rnn(f)                             # (T, N, 256)
        return self.fc(out).log_softmax(2)               # (T, N, n_classes)

model = CRNN(n_classes=27)                               # blank + 26 letters
ctc = nn.CTCLoss(blank=0, zero_infinity=True)

x = torch.randn(4, 1, 32, 128)
logp = model(x)                                          # (T=32, N=4, 27)
targets = torch.randint(1, 27, (4, 5))                   # 4 words of 5 letters, labels 1..26
input_lengths = torch.full((4,), logp.size(0), dtype=torch.long)
target_lengths = torch.full((4,), 5, dtype=torch.long)
loss = ctc(logp, targets, input_lengths, target_lengths)
loss.backward()

def greedy_decode(logp):                                 # logp: (T, N, C)
    best = logp.argmax(2).T                              # (N, T)
    out = []
    for seq in best.tolist():
        s, prev = [], 0
        for k in seq:
            if k != prev and k != 0:                     # collapse repeats, drop blanks
                s.append(k)
            prev = k
        out.append(s)
    return out
```

The shapes and lengths are the usual trouble: `CTCLoss` wants `(T, N, C)` log-probabilities, plus the length of each input and each target.

## Metrics

- **CER** (character error rate) and **WER** (word error rate): edit distance between the prediction and the reference, divided by the reference length.
- Also track exact-match accuracy per field when you read IDs, amounts or dates, since one wrong digit can make a whole field wrong.

## Where CRNN fits today

CRNN-style recognizers were the standard text-recognition stage in many OCR toolkits. Newer systems use transformer recognizers and OCR-free models that read a whole page image and output text or structured data, and vision-language models can do both. CRNN is still worth knowing because it is small, fast and trainable on modest data, and because it combines everything in Parts 4 to 6 in one model. Part 10 places it inside a full document pipeline.

## Break it

| # | Change | What happens and why |
| --- | --- | --- |
| 1 | Use a target of length 40 with only 32 time steps | Loss is `inf` (or 0 with `zero_infinity=True`, silently ignoring the example). CTC needs enough time steps for the labels, plus a blank between repeated letters |
| 2 | Pass probabilities instead of `log_softmax` output | Loss values are wrong and training does not converge |
| 3 | Pass `(N, T, C)` instead of `(T, N, C)` | No error if sizes line up by accident, and a wrong loss. Check shapes |
| 4 | Give label 0 (the blank) as a real character | The model learns to treat blank as a letter and decoding breaks |
| 5 | Remove the blank class and decode with the collapse rule | Double letters ("ll") can no longer be produced |
| 6 | Replace the BiLSTM with just the linear layer | Accuracy drops on look-alike characters ("rn" vs "m"), showing what sequence context adds |
| 7 | Train on clean fonts, test on noisy phone photos | Accuracy collapses. Add augmentation (blur, noise, skew, contrast) |
</script>
<script type="text/markdown" id="md-foundations-8">
# Part 8: From RNNs to attention to Transformers

Transformers did not appear from nowhere. Each step below fixes a specific weakness of the one before it, and knowing the chain lets you answer "why attention?" in an interview without memorizing a definition.

## Step 1: the seq2seq bottleneck

In an LSTM encoder-decoder for translation, the encoder reads the whole source sentence and compresses it into **one fixed-size vector** (its final state). The decoder must generate the entire translation from that single vector. Short sentences work. Long sentences lose detail, because one vector cannot hold everything.

## Step 2: attention fixes the bottleneck

Bahdanau attention (2014) lets the decoder look back at **all** encoder states at every output step and choose which ones matter right now.

```latex
\text{score}_{ij} = \text{score}(s_{i-1}, h_j), \qquad
\alpha_{ij} = \text{softmax}_j(\text{score}_{ij}), \qquad
c_i = \sum_j \alpha_{ij} h_j
```

For each output word `i`, the decoder state scores every source position `j`, softmax turns the scores into weights, and the weighted sum `c_i` is the context vector fed to the decoder. When producing "cat", the weights concentrate on the source word for "cat". Translation quality on long sentences improved a lot, and the weights are easy to visualize as an alignment.

## Step 3: self-attention removes the RNN

The 2017 paper "Attention Is All You Need" asked whether attention alone, with no recurrence, is enough. **Self-attention** applies the same idea inside one sequence: every token attends to every other token in the same sequence (Chapter 1 has the Q, K, V mechanics). Stacking self-attention with feed-forward layers, residual connections and layer norm gives the transformer.

## Why transformers won

| Property | RNN / LSTM | CNN | Transformer |
| --- | --- | --- | --- |
| Parallel across the sequence in training | No, step `t` waits for `t-1` | Yes | Yes |
| Path length between two distant tokens | Up to `n` steps | About `n / kernel size` layers | 1 step (direct attention) |
| Handles variable length | Yes | Yes | Yes (with masking) |
| Compute per layer | O(n) sequential | O(n) | O(n squared) |
| Memory for long inputs | Constant hidden state | Small | Grows with n squared (attention) and n (KV cache) |
| Position information | Built in by order | From local windows | Must be added (positional encoding) |

The winning combination: **parallel training on GPUs** plus **direct long-range connections**. The price is quadratic cost in sequence length, which is why long contexts are expensive (Chapters 1 and 24) and why newer research looks at state-space models and hybrids that bring back recurrent-style efficiency.

## The chain in one line

MLP (no structure) -> CNN (spatial structure) -> RNN (sequence structure) -> LSTM/GRU (long memory via gates) -> seq2seq (variable-length in and out) -> attention (look back at everything) -> transformer (attention only, fully parallel).

## Break it

| # | Change | What happens and why |
| --- | --- | --- |
| 1 | Build a seq2seq LSTM that reverses a string, and test on lengths 5, 20 and 60 | Accuracy falls with length. That is the bottleneck |
| 2 | Add a simple dot-product attention over the encoder states (about 15 lines) and re-test | Long sequences improve a lot |
| 3 | Plot the attention weights for one example | You should see a sharp anti-diagonal alignment, a visible proof the model learned to look back at the right place |
| 4 | Use the self-attention code from Chapter 1 without positional information on a task where order matters ("dog bites man" vs "man bites dog") | The model cannot tell them apart. Attention treats the input as a set |
</script>
<script type="text/markdown" id="md-foundations-9">
# Part 9: Classic NLP (before and around LLMs)

Classic NLP explains why embeddings and transformers exist, and several of its ideas (TF-IDF, subwords, masked language models) are still in production systems and interviews.

## Representing text: from counts to meaning

| Method | Idea | Strength | Weakness |
| --- | --- | --- | --- |
| Bag of words | A vector of word counts per document | Simple, fast | Ignores order, huge sparse vectors, "good" and "great" are unrelated |
| TF-IDF | Weight each word by how often it appears in the document (TF) and how rare it is across documents (IDF) | Strong keyword baseline, the ancestor of BM25 (Chapter 12) | No meaning, no synonyms |
| word2vec / GloVe | One dense vector per word, learned so words in similar contexts get similar vectors | Captures similarity ("king" near "queen") | One vector per word regardless of context |
| fastText | word2vec using character n-grams, so words are built from subword pieces | Handles typos and rare words | Still context-free |
| ELMo | Vectors from a BiLSTM language model, different per sentence | First widely used contextual embeddings | LSTM-based, replaced by transformers |
| BERT and successors | Transformer encoder trained to fill masked words | Strong contextual embeddings and classifiers | Not a generator |
| GPT-style decoders | Transformer decoder trained to predict the next token | Generation, in-context learning | See Chapters 1 to 5 |

## TF-IDF in code

```python
from sklearn.feature_extraction.text import TfidfVectorizer
from sklearn.metrics.pairwise import cosine_similarity

docs = ["refund policy for electronics", "how to reset your password", "returning electronics for a refund"]
vec = TfidfVectorizer()
X = vec.fit_transform(docs)
q = vec.transform(["refund electronics"])
print(cosine_similarity(q, X))      # docs 0 and 2 score high, doc 1 near zero
```

## word2vec in one paragraph

Train a small network to predict a word from its neighbors (**CBOW**) or the neighbors from a word (**skip-gram**). The learned hidden weights become the word vectors. **Negative sampling** makes training cheap: instead of a softmax over the whole vocabulary, the model learns to tell real (word, neighbor) pairs from random fake ones. Because words that appear in similar contexts end up with similar vectors, relationships appear as directions (the famous king - man + woman is close to queen), though these analogies are less reliable than the demos suggest.

## The step that mattered: contextual embeddings

In word2vec, "bank" has one vector whether the sentence is about a river or money. Contextual models (ELMo, then BERT) produce a different vector for each occurrence, because the vector is computed from the whole sentence. This is the same idea as the hidden states of the transformer in Chapter 1.

## BERT vs GPT

| | BERT (encoder-only) | GPT (decoder-only) |
| --- | --- | --- |
| Attention | Bidirectional: sees the whole input | Causal: sees only the past |
| Pretraining | Masked language modeling (guess hidden words) and, originally, next-sentence prediction | Next-token prediction |
| Output | A vector per token, plus a sentence vector | A next-token distribution |
| Best for | Classification, tagging, embeddings, reranking, search | Generation, chat, tool use |
| Typical use today | Small and fast classifiers, embedding and reranker models (Chapters 11 and 12) | LLMs |

**Fine-tuning pattern for classification:** take a pretrained encoder, add a small linear head on its sentence vector, and train on a few thousand labeled examples. It is often cheaper, faster and more predictable than prompting an LLM for a fixed-label task (Chapter 22 on routing and small models).

## Subword tokenization (recap and context)

Word-level vocabularies fail on unknown words, and character-level sequences are too long. Subword schemes (BPE, WordPiece, SentencePiece) split rare words into pieces, so any word can be represented (Chapter 2).

## Classic tasks you should recognize

Text classification, named entity recognition (find people, places, dates), part-of-speech tagging, sentiment analysis, machine translation, summarization, question answering, and semantic similarity. Today a single LLM can attempt all of them by prompting, but small task-specific models are still common for cost, latency and privacy reasons.

## Break it

| # | Change | What happens and why |
| --- | --- | --- |
| 1 | TF-IDF search for "money back" against the docs above | Zero overlap with "refund", so it fails. Bag-of-words cannot match synonyms. Embeddings can |
| 2 | Train word2vec (gensim) on a tiny corpus and query similar words | Results are noisy: word2vec needs a lot of text |
| 3 | Look up a misspelled word ("refudn") in a word2vec vocabulary | Out of vocabulary error. fastText handles it through character n-grams |
| 4 | Embed "river bank" and "bank account" with a static embedding and with a BERT-style model, then compare the vectors for "bank" | Static: identical. Contextual: different. This is the key idea of contextual embeddings |
| 5 | Use a BERT-style classifier for open-ended generation | It cannot generate fluent text. Match the architecture to the task |
