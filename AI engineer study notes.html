# Chapter 26: AI Systems Design, Choosing Models and Building Real Apps

This is a design chapter that puts everything from Chapters 1 to 20 to work on real products. The running example is a **voice agent that looks and sounds like a specific person, with lip-sync**. The model and tool names are from my knowledge, and this field moves fast, so verify the current best option before you commit.

## Part 1: The model landscape

An AI app is almost never one model. It's a **stack of specialized models** plus ordinary code.

| Model type | Job | Examples (verify current ones) | Key trade-offs |
| --- | --- | --- | --- |
| **LLM (text brain)** | Reasoning, conversation, tool use | Claude, GPT, Gemini, Llama, Qwen, Mistral, DeepSeek | Quality vs latency vs cost. Closed vs open-weight (Chapter 5) |
| **Reasoning LLM** | Hard multi-step problems | Models with extended thinking | Slower and costlier, so use selectively |
| **Small / fast LLM** | Routing, classification, simple replies, voice turns | Haiku-class, Flash-class, 3B to 8B open models | Cheap and quick, weaker on hard tasks |
| **Embedding model** | Semantic search, RAG | OpenAI, Cohere, Voyage, BGE, E5 | Dimension, language, domain fit (Chapter 11) |
| **Reranker** | Precise ordering of candidates | Cohere Rerank, BGE-reranker | Latency vs precision |
| **STT / ASR** (speech to text) | Transcribe audio | Whisper (and faster variants), Deepgram, AssemblyAI, Google/Azure STT | Streaming support, accuracy on accents and noise, latency |
| **TTS** (text to speech) | Generate speech | ElevenLabs, Cartesia, OpenAI TTS, PlayHT, open-source (XTTS, Piper, Kokoro) | Time-to-first-byte, naturalness, voice cloning, price |
| **Voice cloning** | Reproduce one person's voice | ElevenLabs, Cartesia, XTTS, and similar | **Consent required.** Quality depends on sample length |
| **Speech-to-speech / realtime models** | Audio in, audio out in one model | Realtime APIs from major labs | Lowest latency and natural prosody, but less control, harder to inspect or intercept |
| **Vision-language model** | Understand images, screenshots, documents | Frontier multimodal LLMs, open VLMs | Token cost of images (Chapter 5) |
| **OCR / layout models** | Parse documents | Textract, Document Intelligence, Docling | Cheaper and more reliable than a VLM for plain text |
| **Image generation** | Create images | Diffusion models (Stable Diffusion family, FLUX, commercial APIs) | Speed, control (ControlNet, LoRA), licensing |
| **Video generation** | Generate clips | Text-to-video models | Slow and costly, not real-time |
| **Talking-head / lip-sync** | Animate a face to match audio | Wav2Lip, MuseTalk, SadTalker, LivePortrait, Hallo; commercial: HeyGen, D-ID, Tavus, Synthesia, Simli | Realtime vs offline, identity fidelity, GPU cost |
| **3D avatar / viseme engines** | Drive a 3D face from audio or phonemes | MetaHuman, Ready Player Me, NVIDIA Audio2Face | Needs rigged characters, controllable and cheap to render |
| **Classifiers and safety models** | Moderation, PII, injection, intent | Small fine-tuned models, moderation APIs | Fast and cheap, run on every request |

### How to choose a model

1. **Write the requirement in numbers:** latency budget, quality bar (from your eval set), cost per request, privacy and residency, languages, volume.
2. **Prototype with the strongest model** to learn what's possible, then **move down** (smaller, cheaper) while your evals still pass. Don't start by guessing.
3. **Match the model to the step.** Use a big model only for steps that need it. Classification, routing and extraction are often fine with small models.
4. **Use routing** (Chapter 22): a cheap model handles the easy 80% and escalates the hard 20%.
5. **Run your own evals** on your own data. Leaderboards don't know your task.
6. **Plan for model swaps.** Keep prompts, schemas and model names in config, and keep a thin abstraction layer, so replacing a model is a config change plus an eval run.
7. **Pin versions** and re-test on upgrades (Chapter 9).

## Part 2: A repeatable design method

For any AI app, walk through these steps in order:

```
1. Define the user job + success metric
2. Decide: single call, workflow, or agent?  (simplest that works, Chapter 14)
3. Map the data flow: inputs → steps → outputs
4. Pick a model per step (small first where possible)
5. Add knowledge: prompt, RAG, memory, fine-tuning (in that order, Chapter 3)
6. Add tools and permissions (least privilege, Chapter 17)
7. Add guardrails, HITL, error handling, fallbacks
8. Set budgets: latency, cost, tokens, steps
9. Build evals and tracing BEFORE scaling (Chapters 18 to 20)
10. Ship small, monitor, iterate
```

**Where knowledge goes:** instructions and style go in the prompt, changing facts go in RAG, user facts go in memory, and consistent behavior or style at scale goes in fine-tuning (LoRA).

## Part 3: Case study, a voice agent with a person's face, voice and lip-sync

### First, the consent and safety gate

Cloning a real person's voice and face is a **deepfake-class capability**, so design it responsibly from day one:

- **Explicit, documented consent** from the person (or their legal representative), covering voice, likeness, and what the agent may say
- **Clear disclosure to users** that they're talking to an AI avatar, shown in the UI and spoken at the start
- **Content boundaries:** the agent must not make statements, endorsements or commitments the person hasn't authorized, and it should refuse impersonation uses (fraud, fake endorsements, intimate content)
- **Provenance:** watermark outputs and attach content credentials (C2PA) where possible
- **Access control and audit logs** for the voice and face models (leaked voice clones get abused)
- Comply with local laws (right of publicity, biometric and voice-data privacy, GDPR-style rules)

Legitimate uses include a creator's own digital twin, a company spokesperson with consent, an AI tutor avatar, and memorial or accessibility projects with proper consent. Without consent, don't build it.

### The pipeline

```
 User mic ──► VAD / turn detection ──► STT (streaming) ──► LLM "brain" (persona + RAG + tools)
                                                                    │ (stream tokens)
                                                                    ▼
 User screen ◄── WebRTC video+audio ◄── Lip-sync / avatar renderer ◄── TTS (cloned voice, streaming)
```

**Each stage and the choices:**

| Stage | What it does | Options | Notes |
| --- | --- | --- | --- |
| **Transport** | Real-time audio and video to the browser or phone | **WebRTC** via LiveKit, Daily; frameworks Pipecat, LiveKit Agents | WebRTC beats plain WebSocket for low latency, jitter handling and echo cancellation |
| **VAD** (voice activity detection) | Detect speech vs silence | Silero VAD, WebRTC VAD | Needed for turn-taking |
| **Turn detection / endpointing** | Decide when the user has finished | Silence timeout plus semantic turn-detection models | Too eager means interrupting people, too slow means feeling laggy |
| **STT** | Streaming transcription with partial results | Deepgram, AssemblyAI, Whisper (streaming variants), cloud STT | Pick for accent and noise robustness plus streaming latency |
| **LLM brain** | Decide what to say, call tools | A fast model for conversation | Time-to-first-token matters more than raw intelligence here |
| **TTS** | Speak in the person's cloned voice | ElevenLabs, Cartesia, XTTS (open) | Stream audio chunks as text arrives, and choose low time-to-first-byte |
| **Lip-sync / avatar** | Turn audio into a moving face | See below | Biggest GPU and complexity cost |
| **Output** | Render video and audio to the client | WebRTC track | Keep audio and video in sync |

### Three ways to do the face

| Approach | How it works | Pros | Cons |
| --- | --- | --- | --- |
| **A. Managed avatar API** (HeyGen Interactive Avatar, Tavus, D-ID, Simli, Anam and similar) | You send text or audio, they return a streaming video avatar from a short training video of the person | Fastest to ship, handled GPU, often bundles voice | Vendor cost and lock-in, less control, consent and data terms to review |
| **B. Open-source 2D talking head** | Take a base video or photo of the person and use an **audio-to-lip** model (**Wav2Lip, MuseTalk** for real-time mouth region replacement over a base video; **LivePortrait, SadTalker, Hallo** for animating a still image) | Full control, no per-minute fee, can run on your own GPUs | Needs GPU ops, quality and identity fidelity vary, real-time is hard |
| **C. 3D avatar driven by visemes/blendshapes** | TTS (or an audio model) outputs **phonemes/visemes**, which drive a rigged character (MetaHuman, Ready Player Me, NVIDIA Audio2Face) rendered in a game engine or the browser | Cheap per frame, precise control, expressions and gestures programmable | Looks like a game character unless you invest, rigging effort |

**Which to pick:**

- **Prototype or product, small team:** A (managed) first, to validate the product before investing in infrastructure.
- **Privacy-sensitive, high volume, or custom:** B on your own GPUs (or your own cloud account).
- **Stylized or branded characters, game-like experiences:** C.

**How real-time lip-sync works (approach B):**

1. TTS produces audio in small chunks (for example 200 to 500 ms).
2. The lip-sync model takes **audio features** (mel spectrogram or speech embeddings) and a **reference face** and generates the **mouth region** (or whole face) for each frame, aiming for 25 to 30 fps.
3. Frames are blended onto the base video, encoded, and streamed over WebRTC along with the audio, which keeps lips aligned to sound.
4. Between utterances the avatar plays an **idle loop** (blinking, small head motion) so it doesn't freeze.

### The latency budget (the thing that makes or breaks voice)

Human conversation expects a reply in roughly **under about a second**. Rough budget (approximate, depends on providers and geography):

| Stage | Target |
| --- | --- |
| Endpointing (deciding the user finished) | 200 to 500 ms |
| STT final transcript | 50 to 300 ms |
| LLM time-to-first-token | 200 to 600 ms |
| TTS time-to-first-audio | 100 to 300 ms |
| Lip-sync and video encode | 100 to 300 ms |
| Network | 50 to 150 ms |
| **Total** | **roughly 0.8 to 2 s** |

**Latency techniques:**

1. **Stream everything.** STT streams partial text, the LLM streams tokens, and TTS starts speaking at the **first sentence or clause** while the LLM is still writing. Never wait for the full answer.
2. **Sentence-level chunking** between LLM and TTS (flush on punctuation).
3. **Fast, small model for the conversational turn** (and a bigger model only when needed), with a concise-reply system prompt (voice replies should be short, spoken style, no markdown or lists).
4. **Prompt caching** (Chapter 9): persona and instructions are a stable prefix.
5. **Co-locate** STT, LLM, TTS and the renderer in the same region, and keep connections warm.
6. **Filler and acknowledgments** ("Hmm, let me check that") while tools run, so silence doesn't feel like a failure.
7. **Speculative or early processing:** start the LLM on a stable partial transcript when confident (advanced).
8. **Barge-in (interruption handling):** when the user starts talking, **cancel** TTS, video and the in-flight LLM stream, and flush audio buffers. Without this, the avatar talks over people. Handle echo cancellation so the agent doesn't hear itself.

### The chain in code (simplified, async and streaming)

```python
async def conversation_loop(session):
    async for utterance in session.stt_stream():          # VAD + endpointing + STT
        session.cancel_speaking()                         # barge-in: stop old TTS/video
        context = await build_context(utterance, session) # persona + memory + RAG (parallel)
        sentence_q = asyncio.Queue()

        async def produce():                              # LLM → sentences
            buf = ""
            async for tok in llm_stream(context, tools=TOOLS):
                buf += tok
                if buf.endswith((".", "?", "!", ",")) and len(buf) > 20:
                    await sentence_q.put(buf); buf = ""
            if buf: await sentence_q.put(buf)
            await sentence_q.put(None)

        async def speak():                                # sentences → TTS → lipsync → WebRTC
            while (s := await sentence_q.get()) is not None:
                async for audio in tts_stream(s, voice_id=session.voice):
                    frames = lipsync(audio, session.face)
                    await session.send(audio, frames)

        session.task = asyncio.gather(produce(), speak())
```

### Making it "that person": persona design

Layered, cheapest first (this mirrors Chapters 3, 6 and 15):

1. **System prompt persona:** tone, vocabulary, catchphrases, topics they do and don't discuss, how they respond to unknown questions, and a **voice-specific style** (short sentences, contractions, no markdown).
2. **Few-shot examples** of the person's real replies (dynamic few-shot by retrieval works well).
3. **RAG over their material:** transcripts, writings, FAQs, interviews, so factual answers come from their real views, with the instruction to say "I'm not sure" beyond that material.
4. **Memory** of returning users (preferences, past topics), with the poisoning and privacy cautions from Chapter 15.
5. **LoRA fine-tuning** (Chapter 4) on the person's text only when prompting plus RAG can't hit the style, and with consent over the training data.
6. **Boundaries and guardrails:** a list of forbidden commitments (financial, legal, medical, endorsements), output filtering, and escalation to the real person or a human team.

### Multi-agent in a voice product: "talker and thinkers"

A voice agent can't block for 20 seconds while sub-agents work. The pattern:

```
              ┌────────────── Talker (fast model, owns the conversation, always responsive)
User ⇄ Voice ─┤                         │ delegates (async, non-blocking)
              │                         ▼
              └── shared state ◄── Thinker/worker agents: research, calendar, CRM, doc search
                                   (slower, stronger models, tools, run in background)
```

- The **talker** keeps the conversation going, says "let me look into that", and **injects results** into the conversation when workers finish.
- **Workers** run in their own contexts (context isolation, Chapter 16) and return **condensed results**.
- Keep **state outside the models** (a shared store), with a trace ID across all agents.
- **Risk-tier tools** and require **spoken confirmation** for sensitive actions ("I'll send that email to Priya. Shall I go ahead?"), and confirm the *actual parameters* (Chapter 16).
- Treat anything the workers fetch from the web or files as untrusted (injection, Chapter 9), especially since it ends up in a spoken answer in someone's voice.

### Evaluating a voice avatar

- **Latency:** time-to-first-audio and end-of-user-speech to start-of-reply, at p50 and p95
- **Speech:** word error rate (WER) of STT on your audience's accents, naturalness ratings of TTS (human MOS-style tests), and pronunciation of names and domain terms
- **Lip-sync:** audio-visual sync error (for example SyncNet-style scores) and human review
- **Conversation:** task success, interruption handling, false endpointing rate, rate of the agent talking over the user
- **Persona fidelity:** blind human ratings ("does this sound like them?") plus a judge for style consistency, and **boundary tests** (will it make commitments it shouldn't?)
- **Safety and consent:** red-team for impersonation misuse and injection
- **Cost:** per minute of conversation (STT + LLM + TTS + GPU render)

### Cost sketch (per conversation minute, qualitative)

STT and LLM are usually small. **TTS and the avatar render dominate.** Managed avatars bill per minute, and self-hosted ones bill GPU time (concurrency drives how many GPUs you need). Reduce cost with shorter replies, caching, a fast small LLM, and idle-loop video instead of rendering during silence.

## Part 4: Related voice and avatar designs

**Simple voice assistant (no face):** WebRTC or phone (Twilio/SIP) → VAD → STT → LLM → TTS. This is also the base of **call-center agents** and IVR replacements.

**Speech-to-speech variant:** a realtime model takes audio and returns audio directly. It has lower latency and more natural prosody (it hears tone and can be interrupted gracefully), but you have less control (harder to insert RAG and guardrails mid-stream, harder to inspect text). A common compromise is to use it for conversation and call tools via function calling, with a parallel transcript for logging and guardrails.

**AI dubbing / translation with lip-sync:** video → extract audio → **STT** → **machine translation (LLM)** → **TTS in the speaker's cloned voice** → **lip-sync model** re-animates the mouth for the new language → mux back into the video. The chain is offline, so quality matters more than latency, and consent applies again.

## Part 5: Blueprints for other AI apps

For each: the shape (single call, workflow, agent), models, and the main risks.

| App | Shape | Models and stack | Main risks and tips |
| --- | --- | --- | --- |
| **Document Q&A / knowledge chatbot** | RAG workflow | Embedding + (hybrid search) + reranker + LLM, vector DB or Elasticsearch | Stale docs, permissions, citations (Chapters 10 to 13) |
| **Customer support agent** | Router + RAG + tool-using agent | Small router model, RAG, tools (order lookup, refunds), strong model for hard cases | Tool permissions, approval for refunds, escalation, tone guardrails |
| **Document extraction (invoices, contracts)** | Chain: parse → extract → validate → review | OCR or VLM + LLM with structured output + code validation | Schema allows `null`, cross-checks in code, human review queue |
| **Coding assistant** | Agent with tools | Strong or reasoning LLM, file read/search/edit/run tools, sandbox, tests as the verifier | Sandboxing, context management over large repos, permission prompts |
| **Research / deep-research agent** | Orchestrator + parallel subagents | Strong orchestrator, cheaper workers, web search and fetch tools | Cost, citation verification, injection from web pages |
| **Natural-language analytics (text-to-SQL)** | Workflow with schema retrieval | LLM + schema RAG + read-only DB role + SQL validation | Read-only role, query cost limits, ambiguity (ask clarifying questions), result checks |
| **Meeting assistant** | Pipeline | STT with diarization → LLM summary and action items → tools (calendar, tickets) | Speaker attribution errors, privacy and consent to record, hallucinated action items |
| **Email / calendar personal assistant (multi-agent)** | Master orchestrator + domain agents (mail, calendar, meetings) | Router model + specialist agents + OAuth-scoped tools | Indirect injection through emails, confirm before sending or scheduling, least privilege |
| **Content generation (marketing copy, images)** | Generate → critique → revise | LLM and image model, brand-voice RAG, human approval | Brand safety, copyright, review before publishing |
| **Recommendations / personalization** | Retrieval + ranking, LLM for explanation | Embeddings, two-tower or classic recommender models, LLM only for explanation | Often classic ML beats an LLM here, so don't force one in |
| **Classification / routing / moderation** | Single call | Small LLM or fine-tuned classifier | Measure precision and recall per class, cheaper than a big model |
| **Voice IVR / phone agent** | Voice pipeline (above) | STT + fast LLM + TTS + telephony | Latency, barge-in, compliance (call recording consent) |
| **Image editing / generation app** | Workflow | Diffusion model + ControlNet or LoRA + safety filter | Moderation, licensing, GPU queueing |

**Rules of thumb across all of them:**

1. **Not everything needs an LLM.** Use regex, SQL, search, classic ML, or rules when they work. They're cheaper and more reliable.
2. **Choose workflow over agent** when you know the steps.
3. **Use code for the deterministic parts**, and models for language and judgment.
4. **Put a small model in front** as a router or classifier.
5. **Every write action** gets a permission tier and, if risky, human approval.
6. **Every app** needs evals, tracing, versioned prompts and a fallback path before launch.

## Part 6: A framework for system-design interviews

When asked "design an AI X", structure your answer like this:

1. **Clarify:** users, scale, latency, accuracy and risk tolerance, privacy, budget
2. **Define success metrics:** quality (task success, faithfulness), latency (p95), cost per request, safety
3. **Simplest solution first:** single call, then RAG or workflow, then agent only if needed
4. **Draw the data flow** and name a model per step, with the reason
5. **Knowledge strategy:** prompt, RAG, memory, fine-tuning, and why
6. **Tools and permissions**, with risk tiers and human approval
7. **Reliability:** retries, fallbacks, idempotency, timeouts, budgets, loop limits
8. **Safety:** guardrails, injection defense, PII, consent (for voice and likeness)
9. **Evaluation:** golden set, error analysis, judges validated against humans, online monitoring and A/B tests
10. **Observability and iteration:** tracing, versioning, canary rollout, feedback loop
11. **Scaling and cost:** caching, routing, batching, quantization, GPU planning
12. **Trade-offs and what you'd do next**

## Interview Q&A

**1. How do you choose a model for a task?**
Define numeric requirements (latency, quality bar, cost, privacy), prototype with a strong model, move down in size while evals pass, run your own evals, and keep models swappable.

**2. Design a real-time voice agent.**
WebRTC transport, VAD and turn detection, streaming STT, a fast LLM with persona, RAG and tools, streaming TTS, optional avatar rendering. Stream every stage, chunk by sentence, handle barge-in, and target roughly one second end to end.

**3. Where does latency come from, and how do you cut it?**
Endpointing, STT, LLM time-to-first-token, TTS time-to-first-byte, rendering and network. Stream everything, use a small fast model, cache the prompt prefix, co-locate services, and use filler phrases.

**4. How do you handle interruptions?**
Detect speech during playback, cancel TTS, video and the LLM stream, flush buffers, use echo cancellation, and resume listening.

**5. Speech-to-speech model vs a STT-LLM-TTS cascade?**
S2S gives lower latency and more natural prosody but less control and visibility. A cascade is more controllable (RAG, guardrails, logging, swapping components) at the cost of added latency.

**6. How does lip-sync work?**
An audio-to-video model takes audio features and a reference face and generates mouth (or face) frames at video rate. They're blended over a base video and streamed with the audio, using an idle loop between utterances. Alternatives are managed avatar APIs and viseme-driven 3D avatars.

**7. How would you make the agent sound and behave like a specific person?**
A persona system prompt, dynamic few-shot examples, RAG over their material, memory, optionally LoRA fine-tuning, plus boundaries and guardrails, all with the person's explicit consent.

**8. What are the ethical and legal requirements for cloning someone's voice and face?**
Explicit consent, disclosure that it's AI, content boundaries, provenance and watermarking, access control, and compliance with likeness and biometric laws.

**9. How do you use multiple agents in a voice product?**
A fast "talker" agent owns the conversation, background worker agents handle slow tasks asynchronously, and results are injected back. State lives in a shared store, and sensitive actions need spoken confirmation.

**10. When is a recommender better built without an LLM?**
When the problem is ranking from behavior data at scale. Classic or two-tower models are faster and cheaper, and an LLM can be used only for explanations.

**11. How do you evaluate a voice avatar?**
Latency percentiles, WER, naturalness ratings, lip-sync error, interruption and turn-taking quality, persona fidelity with blind human ratings, boundary and safety tests, and cost per minute.

**12. How would you design an email and calendar assistant?**
A master router plus domain agents (mail, calendar, meetings) with least-privilege OAuth scopes, injection-aware handling of email content, structured outputs, and human confirmation before sending or scheduling.

## Cheat sheet

- An AI app is a stack of specialized models plus code. Pick per step, start strong, then shrink with evals.
- Voice chain: **VAD → STT → LLM → TTS → lip-sync → WebRTC**. Stream everything, chunk by sentence, handle barge-in, and aim for about 1 second end to end.
- Face options: **managed avatar API** (fastest), **open-source lip-sync** (control), **3D viseme avatar** (cheap, stylized).
- Persona = prompt + examples + RAG + memory (+ LoRA if needed), always with consent, disclosure and boundaries.
- Voice multi-agent = fast talker plus background workers, with state outside the models.
- Don't use an LLM where rules, search or classic ML work. Prefer workflows over agents, and use code for deterministic steps.

## Self-check

1. Your avatar replies after 3 seconds. List four changes, ordered by likely impact.
2. Why do voice replies need a different system prompt from chat replies?
3. Which face approach would you pick for a 3-person startup validating a product, and why?
4. Your voice agent needs to look up a customer record that takes 6 seconds. How do you design the conversation and the agents?
5. A client asks you to clone their CEO's voice from a public interview. What do you do?

# Chapter 27: Designing LangGraph Graphs (State, Nodes, Edges)

This chapter covers how to design stateful agent workflows as graphs: state, nodes, edges, reducers, persistence, human approval and subgraphs. Framework APIs change, so check the exact LangGraph syntax against the current docs. The concepts and patterns stay stable.

## Part 1: The mental model

LangGraph models an agent or workflow as a **state machine over a shared state object**.

```
State (typed dict, checkpointed)  ←  every node reads it and returns a PARTIAL UPDATE
Nodes (functions)                 =  do work (LLM call, tool, retrieval, validation)
Edges                             =  decide what runs next (fixed or conditional)
Reducers                          =  define how updates MERGE into state (overwrite vs append)
Checkpointer                      =  saves state after each step (memory, resume, HITL, replay)
```

Execution happens in "supersteps". Nodes in the same step run in parallel, and their updates are merged by the reducers before the next step.

```python
from typing import TypedDict, Annotated
from langgraph.graph import StateGraph, START, END
import operator

class State(TypedDict):
    question: str
    docs: list[str]
    answer: str
    steps: Annotated[list[str], operator.add]    # reducer: APPEND (default is overwrite)

def retrieve(state: State) -> dict:
    return {"docs": search(state["question"]), "steps": ["retrieve"]}

def generate(state: State) -> dict:
    return {"answer": llm(prompt(state["docs"], state["question"])), "steps": ["generate"]}

g = StateGraph(State)
g.add_node("retrieve", retrieve)
g.add_node("generate", generate)
g.add_edge(START, "retrieve")
g.add_edge("retrieve", "generate")
g.add_edge("generate", END)
app = g.compile()
result = app.invoke({"question": "What is the refund window?"})
```

**Reducers are the most-asked topic.**

- No reducer means **last write wins** (overwrite).
- `Annotated[list, operator.add]` appends lists.
- `Annotated[list, add_messages]` appends messages and merges by message ID (updates a message in place if the ID matches). `MessagesState` is a ready-made state with this.
- If two **parallel** nodes write the same key and it has **no reducer**, LangGraph raises `InvalidUpdateError` ("can receive only one value per step").

## Part 2: Node design principles

| Principle | Why |
| --- | --- |
| **One job per node** | Easy to test, trace, retry and swap. Split "retrieve + grade + generate" into three nodes |
| **Return only the keys you change** | Partial updates keep merging predictable. Never mutate `state` in place |
| **Keep state small and serializable** | State is checkpointed on every step. Store IDs and references, not 5 MB blobs. Never put clients, connections or lambdas in state (use closures, `config`, or dependency injection) |
| **Explicit reducers for shared keys** | Prevents silent overwrites and parallel-write crashes |
| **Separate "decide" from "act"** | A router node or function decides. Action nodes act. This keeps side effects auditable |
| **Routers are pure functions** | `state → label`. Table-testable with no LLM calls |
| **Every cycle needs a stop condition** | An attempt counter in state, plus `recursion_limit` as the backstop |
| **Idempotent side effects** | Nodes can be retried, and nodes with `interrupt()` re-run on resume |
| **Errors as state** | Catch expected failures, write `error` to state, and route to a handler node |
| **Typed and named by verb** | `retrieve`, `grade_docs`, `rewrite_query`, `request_approval`, with edge labels as outcomes |
| **Small models for decision nodes** | Use a cheap model for routing and grading, and a strong one for synthesis |
| **Decide the granularity** | Too coarse is a hidden prompt-chain, too fine is overhead and giant traces |

## Part 3: Edges and routing

```python
from typing import Literal

def route_after_grade(s: RAGState) -> Literal["generate", "rewrite", "fallback"]:
    if s["docs"]:
        return "generate"
    if s["attempts"] < 2:
        return "rewrite"
    return "fallback"

g.add_conditional_edges("grade", route_after_grade,
                        {"generate": "generate", "rewrite": "rewrite", "fallback": "fallback"})
g.add_edge("rewrite", "retrieve")        # the cycle (bounded by attempts)
```

**Corrective RAG as a graph** (a very common interview design):

```
START → retrieve → grade_docs ──(relevant)──→ generate → check_grounding ──(ok)──→ END
                       │                                      │(unsupported)
                       └─(none)→ rewrite_query ─(attempts<2)─→ retrieve      └→ generate (retry once) → END
                                       └─(attempts≥2)→ fallback_answer → END
```

**Other routing tools:**

```python
from langgraph.types import Command, Send

# 1) A node that decides AND updates: Command(goto=..., update=...)
def triage(state) -> Command[Literal["billing", "tech"]]:
    kind = classify(state["messages"][-1].content)          # small model
    return Command(goto=kind, update={"category": kind})

# 2) Dynamic fan-out (map-reduce): Send one task per item, each with its own input
class S(TypedDict):
    topics: list[str]
    summaries: Annotated[list[str], operator.add]

def fan_out(state: S):
    return [Send("summarize_one", {"topic": t}) for t in state["topics"]]

def summarize_one(payload: dict) -> dict:                   # receives the Send payload, not full state
    return {"summaries": [llm(f"Summarize: {payload['topic']}")]}

g.add_conditional_edges(START, fan_out, ["summarize_one"])
g.add_edge("summarize_one", "combine")                      # runs after all branches finish

# 3) Static parallel branches + join: wait for BOTH
g.add_edge(["search_web", "search_docs"], "merge")
```

## Part 4: A ReAct agent from scratch in LangGraph

```python
from langgraph.graph import MessagesState
from langgraph.prebuilt import ToolNode, tools_condition
from langchain_core.tools import tool

@tool
def get_order_status(order_id: str) -> str:
    """Look up an order's status by ID. Read-only. Use when the user asks where an order is."""
    return db_lookup(order_id)

tools = [get_order_status]
model = chat_model.bind_tools(tools)           # any LangChain chat model

def agent(state: MessagesState) -> dict:
    return {"messages": [model.invoke(state["messages"])]}

g = StateGraph(MessagesState)
g.add_node("agent", agent)
g.add_node("tools", ToolNode(tools))            # runs tool calls, appends ToolMessages
g.add_edge(START, "agent")
g.add_conditional_edges("agent", tools_condition)   # → "tools" if tool calls else END
g.add_edge("tools", "agent")
app = g.compile()

app.invoke({"messages": [("user", "Where is order A123?")]}, {"recursion_limit": 10})
```

`create_react_agent` in `langgraph.prebuilt` builds exactly this graph, so interviewers often ask you to build it by hand. Exceeding `recursion_limit` raises `GraphRecursionError`, which is your hard stop.

## Part 5: Persistence, memory and human-in-the-loop

```python
from langgraph.checkpoint.memory import MemorySaver        # dev; use Sqlite/Postgres savers in prod
from langgraph.types import interrupt, Command

def request_approval(state) -> dict:
    decision = interrupt({"action": "issue_refund",
                          "order_id": state["order_id"], "amount": state["amount"]})
    return {"approved": decision == "approve"}

def issue_refund(state) -> dict:                            # side effect lives in its OWN node
    if not state["approved"]:
        return {"status": "rejected"}
    return {"status": payments.refund(state["order_id"], state["amount"],
                                      idempotency_key=state["request_id"])}

app = g.compile(checkpointer=MemorySaver())
cfg = {"configurable": {"thread_id": "user42-conv7"}}       # thread = one conversation's state
out = app.invoke(inputs, cfg)                               # pauses at interrupt (result has "__interrupt__")
# ...a human approves in a UI, possibly days later...
app.invoke(Command(resume="approve"), cfg)                  # resumes from the checkpoint
```

**The gotcha:** when the graph resumes, **the interrupted node re-executes from its first line**. Anything before `interrupt()` runs again, so never put non-idempotent side effects before it. Keep the approval node pure and the action in the next node.

**Checkpointer capabilities:**

- `thread_id` gives short-term memory (conversation state persists across invokes)
- `app.get_state(cfg)` inspects state, and `app.update_state(cfg, {...})` edits it (a human correction)
- `app.get_state_history(cfg)` enables **time travel** (replay or fork from an earlier checkpoint)
- Crash recovery: resume from the last completed step
- Production: SQLite or Postgres checkpointers (Postgres needs a setup call), and keep thread IDs scoped per user

**Long-term memory** (across threads) uses a separate **store** (key-value with namespaces, optionally with semantic search):

```python
from langgraph.store.memory import InMemoryStore
store = InMemoryStore()
store.put(("users", user_id, "prefs"), "language", {"value": "Hindi"})
items = store.search(("users", user_id, "prefs"))
app = g.compile(checkpointer=saver, store=store)            # nodes can accept a `store` argument
```

Checkpointer means per-thread state, and store means cross-thread knowledge. Interviewers love this distinction.

## Part 6: Subgraphs and multi-agent graphs

```python
billing_graph = billing_builder.compile()                   # a graph is a runnable
parent = StateGraph(ParentState)
parent.add_node("billing_agent", billing_graph)             # subgraph as a node
```

- If parent and child state schemas **share keys**, they map automatically. If not, wrap the subgraph in a function that transforms the state in and out.
- Give each subagent its **own narrow state** and tools (context isolation, Chapter 16). Return a condensed result.
- A subgraph can navigate its parent with `Command(graph=Command.PARENT, goto=...)`, which is how handoffs are implemented.

**Design walkthrough: master orchestrator for an email, calendar and meeting assistant**

```
START → classify_intent (small model, structured output: email|calendar|meeting|chitchat|unclear)
   ├─ email    → email_subgraph    (search_mail, draft_reply, [approve] → send)
   ├─ calendar → calendar_subgraph (find_slots, [approve] → create_event)
   ├─ meeting  → meeting_subgraph  (fetch_transcript, summarize, extract_actions)
   ├─ unclear  → ask_clarifying_question → END
   └─ chitchat → respond → END
all branches → compose_final_answer → END
```

State: `messages`, `intent`, `pending_action`, `approved`, `error`, `steps`.

Rules: write actions go behind an approval node, tools are scoped to the user's OAuth token, email bodies are untrusted data (injection, Chapter 9), and `recursion_limit` plus per-subgraph step caps keep it bounded.

## Part 7: Streaming, errors and testing

```python
for update in app.stream(inputs, cfg, stream_mode="updates"):   # per-node state deltas
    print(update)
# stream_mode="values"   → full state each step
# stream_mode="messages" → LLM tokens as they arrive (for chat UIs)
```

**Errors:** retry transient failures at the node level with a retry policy (the parameter name and import vary by version, so check docs), catch expected failures and write `error` to state, and route with a conditional edge to a handler or fallback node.

**Testing:**

- Nodes are plain functions, so unit-test with a dict state and a mocked LLM.
- Routers are pure, so test them with a table: `assert route({"docs": [], "attempts": 2}) == "fallback"`.
- Test the graph with a fake chat model that returns scripted tool calls.
- Trajectory evals (Chapter 21): assert the node path, the number of steps, and forbidden nodes.
- Trace with LangSmith or OpenTelemetry (Chapter 25).

## Part 8: When not to use LangGraph

If the flow is a **fixed linear chain**, plain async functions are simpler. Reach for a graph when you need cycles, branching, parallel fan-out, durable state, human-in-the-loop, or resumability. Frameworks are optional, and you should be able to explain the underlying loop (Chapter 14) without one.

## Interview Q&A

**1. What are the core parts of a LangGraph graph?**
State schema, nodes (functions returning partial updates), edges (fixed or conditional), reducers, and a checkpointer for persistence.

**2. What does a reducer do?**
It defines how a node's update merges into a key: overwrite by default, or append with `operator.add` or `add_messages`. Parallel writes to one key need a reducer.

**3. Two parallel nodes both write `results`. What happens?**
Without a reducer, an `InvalidUpdateError`. Add an `Annotated[list, operator.add]` reducer.

**4. How do you build a loop safely?**
A counter in state that the router checks, plus `recursion_limit` as a hard stop.

**5. Checkpointer vs store?**
The checkpointer saves per-thread state (short-term memory, resume, HITL, time travel). The store holds cross-thread long-term memory (user facts) with namespaces.

**6. How does `interrupt` work, and what's the gotcha?**
It pauses and saves state, and `Command(resume=...)` continues. The node re-runs from the top on resume, so side effects before the interrupt must be idempotent or moved to a later node.

**7. Command vs conditional edge?**
Both route. `Command` lets a node update state and choose the next node in one return. Conditional edges keep routing logic separate from nodes.

**8. How do you implement map-reduce?**
`Send` returns one task per item to a worker node, results merge via a reducer, then a join node combines them.

**9. How would you structure a multi-agent assistant?**
A router node, domain subgraphs with their own state and tools, approval nodes before write actions, and a final composition node, with step and cost limits.

**10. What shouldn't go in graph state?**
Large blobs, non-serializable objects (clients, connections), and secrets, because state is checkpointed.

**11. How do you test a graph?**
Unit-test nodes and routers with dict states, run with scripted fake models, and assert on trajectories.

## Self-check

1. A node does `state["messages"].append(x)` and returns nothing. Why is that wrong?
2. Where do you put a payment call relative to an `interrupt`?
3. Design the node list for corrective RAG with at most 2 query rewrites.
4. Your graph state grows to 40 MB and slows every step. Why, and what do you change?
</script>

# Chapter 28: Conversation and File-Chat Design

This chapter covers how to store conversations, how to build "chat with my file" end to end, how to manage history and memory, and how to isolate users and delete their data.

## Part 1: The data model

Think in four entities: **users → threads → messages**, and **users → files → chunks**.

```sql
CREATE TABLE threads (
  id uuid PRIMARY KEY, user_id uuid NOT NULL, title text,
  summary text,                            -- rolling summary of old turns
  created_at timestamptz DEFAULT now(), updated_at timestamptz DEFAULT now()
);

CREATE TABLE messages (
  id uuid PRIMARY KEY, thread_id uuid NOT NULL REFERENCES threads ON DELETE CASCADE,
  seq bigint NOT NULL,                     -- monotonic per thread (ordering + optimistic locking)
  role text CHECK (role IN ('user','assistant','tool','system')),
  content jsonb NOT NULL,                  -- text, tool_calls, tool results, citations
  token_count int, model text, prompt_version text, trace_id text,
  created_at timestamptz DEFAULT now(),
  UNIQUE (thread_id, seq)
);

CREATE TABLE files (
  id uuid PRIMARY KEY, user_id uuid NOT NULL, thread_id uuid,        -- thread_id null = reusable library file
  filename text, mime text, size_bytes bigint, sha256 text, storage_key text,
  status text CHECK (status IN ('uploaded','parsing','indexing','ready','failed')),
  error text, page_count int, doc_summary text, token_count int,
  created_at timestamptz DEFAULT now(), expires_at timestamptz,
  UNIQUE (user_id, sha256)                                           -- dedupe re-uploads
);

CREATE TABLE chunks (
  id uuid PRIMARY KEY, file_id uuid NOT NULL REFERENCES files ON DELETE CASCADE,
  user_id uuid NOT NULL,                   -- denormalized for filtering + row-level security
  idx int, page int, section text, text text,
  embedding vector(1024), tsv tsvector
);
CREATE INDEX ON chunks USING hnsw (embedding vector_cosine_ops);
CREATE INDEX ON chunks USING gin (tsv);
CREATE INDEX ON chunks (user_id, file_id);
```

**Design notes:**

- Store messages as **structured JSON**, not a flat string, so tool calls and their results stay linked.
- `seq` per thread gives deterministic ordering and lets you detect two tabs writing at once (optimistic locking: insert fails on a duplicate `seq`).
- Record **model, prompt version and trace ID** on each assistant message (Chapter 25).
- **Row-level security** as a safety net:

```sql
ALTER TABLE chunks ENABLE ROW LEVEL SECURITY;
CREATE POLICY own_chunks ON chunks USING (user_id = current_setting('app.user_id')::uuid);
-- per request, inside a transaction:  SET LOCAL app.user_id = '<uuid from auth>';
```

## Part 2: "Chat with my file" end to end

**Ingestion (asynchronous, never inline in the request):**

```
Client → presigned URL → object storage (S3/GCS)
       → POST /files {key}   → files row (status=uploaded) → enqueue job
Worker: validate (type, size, page limits) → malware scan → parse (OCR if scanned)
        → chunk (structure-aware, keep page and section) → [contextual prefix]
        → embed in batches → bulk insert chunks → generate doc summary (for global questions)
        → status=ready  (or failed + reason)
Client polls /files/{id} or receives SSE/webhook progress
```

**Rules for the pipeline:**

- **Idempotent:** key on `(user_id, sha256, chunker_version, embed_model)`. A retry or re-upload doesn't duplicate chunks.
- **Visible states:** the UI must show "parsing, indexing, ready, failed". Never let a user ask questions about a half-indexed file without telling them.
- **Limits and quotas:** file size, pages, files per user, total storage. Reject early.
- **Retries with a dead-letter queue** for poison files. Store the error.
- **TTL cleanup:** an `expires_at` plus a periodic job deletes files, chunks, objects and caches.
- **Never trust file contents:** a PDF may contain prompt injection. Treat chunk text as untrusted data (Chapter 9).

**Query path:**

```python
async def answer(user, thread_id: str, question: str):
    thread  = await db.get_thread(thread_id, owner=user.id)        # authz: thread belongs to user
    history = await load_history(thread_id)                        # recent messages + rolling summary
    file_ids = await db.ready_files(thread_id, user.id)            # scope: this thread's files only

    standalone = await condense(history, question)                 # resolve "what about page 3?"
    qvec = await embed_query(standalone)

    cands = await db.hybrid_search(                                # vector + BM25, fused with RRF
        qvec, standalone, user_id=user.id, file_ids=file_ids, k=40)  # user_id from AUTH, never from the client body
    top = (await rerank(standalone, cands))[:6]

    prompt = build_prompt(SYSTEM, thread.summary, history.recent, top, question)
    full = ""
    async for tok in llm_stream(prompt):
        full += tok
        yield tok
    await db.save_turn(thread_id, question, full, citations=extract_citations(full, top))
```

Key points: the **user and file scope comes from the server's session**, never from request parameters or the model, citations carry file name and page, and the turn is saved after streaming (on client cancel, save a partial message with a flag).

## Part 3: Full-context vs RAG for a single file

```python
def choose_strategy(file_tokens: int, window: int = 200_000, budget_frac: float = 0.4) -> str:
    return "full_context" if file_tokens <= window * budget_frac else "rag"
```

| Situation | Choice |
| --- | --- |
| Short file (fits easily) | **Put the whole file in context** with prompt caching (the file is the stable prefix, Chapter 9). Simpler and often more accurate |
| Long file or many files | RAG with hybrid search and reranking |
| "Summarize the whole document" or "what are the main themes?" | RAG fails (top-k sees fragments). Use **hierarchical summaries** |

**Global questions:** precompute at ingestion, per-section summaries and a document summary (map-reduce summarization). Then route:

```python
async def route_question(q: str) -> str:            # small model, structured output
    return await classify(q, labels=["global_summary", "specific_lookup", "comparison"])
# global_summary → use stored summaries; specific_lookup → chunk retrieval;
# comparison → retrieve per file/section, then synthesize
```

## Part 4: Managing conversation history

**The problem:** history grows, the context window is finite, and cost rises each turn (Chapter 8).

```python
def build_context(system, summary, messages, budget, count_tokens):
    used = count_tokens(system) + count_tokens(summary or "")
    kept = []
    for m in reversed(messages):                    # newest first
        t = count_tokens(m["content"])
        if used + t > budget:
            break
        kept.append(m); used += t
    kept.reverse()
    # never start with an orphan tool result: keep tool_call and tool_result messages together
    while kept and kept[0]["role"] == "tool":
        kept.pop(0)
    return kept
```

**Strategy:** keep the system prompt, a **rolling summary** of dropped turns, and the last N turns verbatim. When turns fall out of the window, summarize them asynchronously (after the response, not in the user's latency path) and append to `threads.summary`. Reserve budget for retrieved chunks and the answer: `window = system + summary + recent + retrieved + output_reserve`.

**Gotchas:**

- **Don't split a tool call from its tool result.** Most APIs reject a tool result with no matching call, or a call with no result.
- Summaries can **drop or distort facts**. Keep key entities and decisions, and keep the raw messages in the DB.
- **Summaries cause cache misses** the first time they change. Update them in batches, not every turn.
- Count tokens with the **model's tokenizer** (or a conservative estimate), not word counts.

## Part 5: Memory layers

| Layer | Scope | Storage | Use |
| --- | --- | --- | --- |
| Working | This request | Context window | The prompt |
| Short-term | One thread | `messages` table or a graph checkpointer | Conversation continuity |
| Long-term (user) | All threads for a user | Key-value or vector store | Preferences, facts ("prefers Hindi replies") |
| File knowledge | One file or library | Chunk index and summaries | RAG |

**Long-term memory rules (Chapter 15):** write via a background pass after the conversation (extract and consolidate), resolve conflicts and timestamp, set TTLs, support deletion, never write memory from untrusted file content without validation (poisoning), and scope everything by `user_id`.

## Part 6: Multi-file, multi-tenant, deletion

- **Multi-file questions:** the retrieval filter is `file_id IN (...)`. Every chunk carries `file_id`, filename and page, and the prompt labels sources (`<document index=1 source="contract.pdf" page=4>`). For cross-file comparison, retrieve per file and then synthesize, so one large file doesn't crowd out the others.
- **Isolation:** `user_id` filter in the query, plus row-level security, plus per-user cache keys. Test with canary documents ("can user B ever retrieve user A's canary?").
- **Large scale:** a shared index with user-based partitioning or namespaces beats one index per user once users number in the thousands.
- **Deletion:** deleting a file removes chunks (cascade), the object-store blob, cached embeddings and answers, and search-index entries. Deleting a thread removes its messages, summary and any thread-scoped files. Deleting a user removes everything, with a defined backup-retention policy. Traces and logs need the same treatment (Chapter 25).
- **Concurrency:** two tabs on one thread can race. Use `seq` uniqueness or a per-thread lock, and show the latest state.
- **Library vs thread files:** decide whether a file belongs to one conversation or to the user's library. This decides your `thread_id` nullability and your filters.

## Interview Q&A

**1. Design "chat with a PDF".**
Async ingestion (upload, parse, chunk, embed, index with `user_id` and `file_id`), status tracking, a query path that scopes retrieval to the user's files, hybrid search with reranking, cited streaming answers, and TTL cleanup.

**2. Why async ingestion?**
Parsing and embedding take seconds to minutes. It must not block requests, and it needs retries, status, and backpressure.

**3. When do you skip RAG for a file?**
When it fits comfortably in the context window. Put it in the prompt with caching, which is simpler and often more accurate.

**4. How do you answer "summarize this 300-page document"?**
Precomputed hierarchical (map-reduce) summaries, and a question router that sends global questions to summaries and specific ones to chunks.

**5. How do you stop users seeing each other's files?**
Server-derived `user_id`, filter in every query, row-level security, per-user cache keys, and canary tests.

**6. How do you store conversation history?**
Threads and messages tables with structured content, a monotonic `seq`, and metadata (model, prompt version, trace ID), plus a rolling summary.

**7. How do you trim history safely?**
Keep the system prompt and summary, then the newest turns within a token budget, keep tool call and result pairs together, and summarize dropped turns asynchronously.

**8. How do you dedupe re-uploads?**
A content hash per user with a unique constraint, and idempotent pipeline keys.

**9. How do you delete a user's data?**
Cascade across messages, files, chunks, blobs, caches, memory and traces, with backup-retention rules.

**10. How do you handle a 100-page scanned PDF?**
OCR or a vision model, page limits and progress status, and confidence checks on the text.

## Self-check

1. A user asks "what about page 3?" with no other context. What steps make retrieval work?
2. Where can a deleted file's content still live after you delete its DB row?
3. Your history trimmer produced an API error about tool messages. What's the likely bug?
4. Why derive `user_id` from the session and not from the request body?

# Chapter 29: Scaling RAG, and System-Design Drills

This chapter covers how RAG changes when the corpus gets huge or the user count gets large, how to do the sizing math, and ten worked design questions.

## Part 1: Two different scaling problems

| | **Corpus scale** (10M documents) | **Concurrency scale** (500 users) |
| --- | --- | --- |
| Bottleneck | Index memory and storage, ingestion throughput, retrieval quality (more distractors) | LLM throughput and rate limits, latency, cost per query |
| Hard parts | ANN index design, sharding, incremental updates, ACLs, embedding cost | Queuing, caching, autoscaling, streaming connections, provider limits |
| Retrieval | Hard (billions of vectors are expensive) | Easy (a small index is fast at high QPS) |
| LLM load | Whatever the QPS is | **Dominant** |
| Typical failure | "It worked at 100k docs, it's wrong at 10M" | "Fine in testing, falls over at peak" |

**Always clarify first:** "500 *concurrent* users, or 500 total? How often does each ask? What's the peak-to-average ratio? What's the p95 latency target? How large is the corpus, and how often does it change?" Answers change the design by 10x.

## Part 2: Sizing math (know how to do this on a whiteboard)

**Corpus: 10M documents.** Assume about 10 pages per document and about 2 chunks per page (about 400 tokens each) → **20 chunks per document → 200M chunks**.

```python
def rag_sizing(n_docs, chunks_per_doc, dim, bytes_per_dim=4, hnsw_m=16):
    n = n_docs * chunks_per_doc
    raw = n * dim * bytes_per_dim
    graph = n * hnsw_m * 2 * 8              # rough HNSW link overhead
    return n, raw / 1e9, graph / 1e9        # chunks, GB raw vectors, GB graph

print(rag_sizing(10_000_000, 20, 768))      # (200M, ~614 GB, ~51 GB)
```

| Representation (200M × 768 dims) | Size | Notes |
| --- | --- | --- |
| float32 | ~614 GB | Too much RAM for one machine |
| int8 scalar quantization | ~154 GB | Small recall loss, 4x smaller |
| Matryoshka truncation to 256 dims (float32) | ~205 GB | Needs a model trained for it |
| Product Quantization (96 bytes per vector) | ~19 GB | More loss, often paired with rescoring |
| Binary (768 bits = 96 bytes) | ~19 GB | Fast Hamming search, rescore the top candidates |
| HNSW graph on top | +~51 GB | HNSW wants vectors and graph in RAM |

**Embedding cost (illustrative):** 200M chunks × 400 tokens = **80B tokens**. At an illustrative $0.02 to $0.13 per 1M tokens, that's roughly $1.6k to $10k via an API. Self-hosting a small embedding model at about 10k tokens/s/GPU would need about 2,200 GPU-hours, or about 3 days on 32 GPUs. Re-embedding (a model change) repeats this cost, so version your indexes.

**Concurrency: 500 users.** Little's Law: `in-flight requests = arrival rate × time in system`.

```
500 concurrent users, each sends a query about every 40 s  →  λ ≈ 500 / 40 ≈ 12.5 queries/s
LLM call takes ~8 s end to end                            →  ≈ 12.5 × 8 = 100 requests in flight
Peak is 3x average                                        →  design for ~38 QPS and ~300 in flight
Tokens: ~4,000 in + 400 out per query                     →  ~12.5 × 4,400 × 60 ≈ 3.3M tokens/min (average), ~10M TPM at peak
Output rate: 12.5 × 400 ≈ 5,000 output tokens/s           →  compare with provider limits, or GPU capacity
```

Retrieval at 12 to 38 QPS on a small index is trivial. The LLM is the bottleneck. If "500 users" means 500 registered users, concurrency is maybe 5 to 10% of that, and the problem shrinks a lot.

## Part 3: Architecture for 10M documents

**Ingestion pipeline:**

```
Sources → object store → queue (Kafka/SQS) →
  parse workers (CPU, autoscale) → chunk → embed workers (GPU, large batches) →
  index writers (bulk) ; metadata → DB ;  failures → dead-letter queue
```

- **Idempotent keys** `(doc_id, doc_version, chunker_version, embed_model)`, and **dedupe** by content hash (and near-duplicate detection like MinHash).
- **Incremental updates** via change data capture or webhooks, upserts with versions, **tombstones** for deletes, and periodic compaction.
- **Re-embedding or re-chunking:** build a **new index in the background and swap atomically** (blue/green). Plan for about 2x storage during the swap.
- Backfill is a batch job, so use spot capacity and checkpoint progress.

**Index design:**

- **HNSW is memory-hungry.** At 200M vectors use **IVF-PQ**, **scalar/binary quantization with rescoring**, or **DiskANN-style SSD indexes**.
- **Two-stage retrieval:** ANN over compressed vectors (top 200 to 500) → **rescore with full-precision vectors** fetched from SSD → cross-encoder rerank (top 30 to 50) → top 5 to 8 to the LLM.
- **Shard** by hash for even load, or by tenant, source or time for **partition pruning** (searching only relevant shards). Add **replicas** for QPS and availability.
- **Scatter-gather:** the query fans out to shards, each returns top-k, and a coordinator merges. **p99 is set by the slowest shard**, so keep shard count reasonable and consider hedged requests.
- **Hybrid search:** BM25 over an inverted index scales well. Elasticsearch/OpenSearch can host both BM25 and vectors, and fuse with RRF.
- **Hierarchical retrieval:** an index of document summaries (10M entries, small) → pick the top documents → search chunks within them. This is a strong fix for "more documents, more distractors".

**Filtering and security at scale:**

- Store `acl_groups` (group IDs, not per-user lists) on each chunk. Filter with the user's groups at query time, and verify with the authorization service before returning text.
- Highly selective filters can hurt ANN recall or return too few results. Test them, and consider partitioning by the most common filter.
- ACL changes need a fast metadata update path (update the field, don't re-embed).

**Quality at scale (why it degrades):**

- More documents mean more near-duplicates and plausible distractors, so precision at fixed k falls.
- Fixes: better chunk context (contextual retrieval), hybrid search, reranking, metadata routing and query classification, hierarchical retrieval, near-duplicate removal, freshness and authority boosts.
- **Check ANN recall itself:** compare ANN results against exact search on a sample. Aggressive PQ or low `efSearch` may be the cause.
- Re-measure recall@k at 100k, 1M and 10M. If it falls with scale, find which stage does.

## Part 4: Architecture for 500 concurrent users

```
Clients ⇄ CDN/LB ⇄ stateless API pods (async, autoscaled)
              ├─ auth + per-user rate limits
              ├─ cache layer: semantic/response cache, embedding cache
              ├─ retrieval service (vector DB replicas)
              ├─ LLM gateway (routing, fallbacks, budgets, retries) → provider(s) or vLLM pool
              └─ queue for non-interactive work (ingestion, evals)
```

**Playbook:**

1. **Stateless API pods** that autoscale on in-flight requests, with async I/O and connection pooling to DBs. 500 open **streaming connections** are fine for an async server, but check LB idle timeouts and disable proxy buffering.
2. **LLM capacity:** compare required TPM and output tokens/s against provider rate limits (request a higher tier before launch), or size a vLLM pool (a benchmark decides, Chapter 24). Keep a fallback provider (Chapter 22).
3. **Cut tokens per query:** retrieve fewer and better chunks (rerank, top 4 to 6), cap output, **prompt caching** for the static prefix, and a small model for easy queries (routing).
4. **Caches:** prompt cache, semantic cache for FAQ-like traffic (scoped, TTL), embedding cache for repeated queries, and request coalescing for identical in-flight queries.
5. **Backpressure:** bounded queues, **load shedding** and graceful degradation (a smaller model, shorter answers, "high demand" message) instead of a collapse.
6. **Per-user quotas** and abuse protection (denial-of-wallet).
7. **Peak planning:** design for 3 to 5x the average, load-test with realistic token lengths (not tiny prompts), and measure p95/p99.
8. **Observability:** traces and cost per query, queue depth, rate-limit rate, cache hit rate (Chapter 25).

**Both at once (10M docs and 500 users):** the retrieval tier needs sharded, replicated indexes sized for about 40 QPS at p99 under about 300 ms, and the LLM tier needs the concurrency plan above. Cache hit rates and tokens per query decide the bill.

## Part 5: The answer template

For any "design RAG for X" question:

1. **Clarify** (corpus size and growth, update rate, users and peak concurrency, latency target, accuracy bar, access control, languages, budget)
2. **Do the math out loud** (chunks, vector memory, QPS, in-flight requests, tokens per minute)
3. **Ingestion** (parse, chunk, embed, dedupe, idempotency, incremental updates, versioned index swaps)
4. **Retrieval** (hybrid, filters and ACLs, reranking, hierarchical if large, query rewriting)
5. **Generation** (model routing, grounding, citations, abstention, streaming)
6. **Scale levers** (sharding, quantization, replicas, caching, autoscaling, rate limits)
7. **Quality and evals** (golden set, recall@k by scale, faithfulness, online monitoring)
8. **Safety and privacy** (ACLs, injection, PII, deletion)
9. **Cost and trade-offs**, and what you'd build first (MVP) versus later

## Part 6: Ten design drills with model answers

**1. "Chat with PDFs: 100k users, each uploads up to 20 PDFs."**
Shared index, partitioned by `user_id` (namespaces or partitions), not an index per user. Async ingestion with quotas and a TTL. Most users are inactive, so keep only active users' vectors on fast storage and tier the rest (re-index lazily on return). Small files go full-context with caching. Math: 100k × 20 × 60 chunks = 120M chunks worst case, so quota and TTL control cost. Row-level security and canary tests for isolation.

**2. "Legal team of 50, 10M documents, high accuracy, citations required."**
Low concurrency, huge corpus, so spend effort on quality: hybrid search, contextual chunks, hierarchical retrieval (document then passage), strong reranker, citation verification in code, ethical-wall ACLs per matter, audit logs, and a strong or reasoning model for synthesis since cost per query is small. Evaluate with lawyers (golden set, faithfulness, recall@k). Infra is a sharded index, with modest replicas.

**3. "Consumer app, 1M monthly users, 5k-document FAQ corpus."**
Tiny corpus, huge traffic. The index fits in RAM on one node. The problem is LLM cost and concurrency: semantic cache (high hit rate on FAQs), small model by default, escalation on low confidence, prompt caching, per-user rate limits, abuse controls, and autoscaling stateless pods with a provider fallback. Measure cost per resolved query.

**4. "Documents change every minute."**
Change data capture into the queue, upserts keyed by `(doc_id, version)`, tombstones for deletes, a freshness SLA, small near-real-time index segments merged periodically, cache invalidation by document version, and a retrieval-time filter to the latest version. Accept eventual consistency within the SLA and tell users the index "as of" time when it matters.

**5. "p95 under 1 second end to end."**
Budget it: embed 30 ms, ANN 30 ms, rerank 80 ms (30 candidates), LLM TTFT 300 ms, stream the rest. Skip query rewriting on first turns, cache embeddings, run guardrails in parallel, use a small fast model and a cached prefix, and co-locate services. Under 1 s refers to first tokens, since a full long answer won't finish in 1 s.

**6. "Cut cost 5x."**
Measure first (tokens per query, model mix, cache hit rate). Then route easy queries to small models, add prompt and semantic caching, retrieve fewer chunks and cap output, quantize the index and shrink dimensions, batch embeddings, drop the reranker where evals show no benefit, and use the batch API for offline work. Verify with evals that quality holds.

**7. "Multilingual: Hindi, English, Hinglish."**
Multilingual embedding models (test on your languages), per-language BM25 analyzers, language detection on queries, a transliteration step for Hinglish, evaluate per language (recall@k and faithfulness), and decide whether to translate queries or documents (translation adds cost and errors).

**8. "Per-document ACLs, 10M documents, 20k users."**
Group-based ACLs stored as `acl_groups` on chunks, query filter built from the user's groups, a post-retrieval check with the authorization service, and a fast metadata-update path for ACL changes (no re-embedding). Never share caches across ACL scopes. Test with leak canaries and audit retrievals.

**9. "Enterprise search across Slack, Drive and Jira."**
Connectors with incremental sync (webhooks and cursors), source-specific parsing and chunking (threads, tickets, docs), identity mapping and permission sync, respect source API rate limits, deletion sync, per-source freshness SLAs, and source and recency boosts. Unified metadata schema.

**10. "Answers were fine at 100k documents and wrong at 10M."**
Diagnose by stage: measure recall@k at both scales, then check ANN recall against exact search, whether reranking is limited by too few candidates, near-duplicate pollution, and filter selectivity. Fixes: hierarchical retrieval, hybrid search, bigger candidate pool plus reranking, dedupe, metadata routing, and better chunk context. Add scale-aware evals so it doesn't regress again.

## Interview Q&A

**1. How much memory for 200M × 768-dim float32 vectors?**
About 614 GB, plus HNSW graph overhead (about 50 GB). Use quantization (int8 about 154 GB, PQ or binary about 19 GB) with rescoring.

**2. Why not HNSW for everything at billion scale?**
It needs vectors and graph in RAM. Use IVF-PQ, DiskANN-style SSD indexes, or quantization plus rescoring.

**3. What is two-stage retrieval at scale?**
ANN over compressed vectors for candidates, rescoring with full precision, cross-encoder reranking, then the top few to the LLM.

**4. How do you estimate load for 500 users?**
Convert to QPS (users ÷ time between queries), multiply by latency for in-flight requests (Little's Law), multiply by tokens for TPM, and apply a peak factor.

**5. Is 10M documents a retrieval problem or a serving problem?**
Mostly retrieval and indexing. 500 users is mostly an LLM serving problem. Clarify which one is being asked.

**6. How do you update a huge index without downtime?**
Incremental upserts for changes, tombstones for deletes, and blue/green rebuilds for model or chunking changes.

**7. Why can quality drop as the corpus grows?**
More distractors and near-duplicates lower precision at a fixed k. Fix with hybrid, reranking, hierarchy, dedupe and better chunk context.

**8. How do you shard a vector index?**
By hash for balance or by tenant and metadata for pruning, with replicas for QPS, and a scatter-gather merge. p99 depends on the slowest shard.

**9. How do you make 500 users cheap?**
Route to small models, cache (prompt, semantic, embedding), shrink the context, cap outputs, and coalesce duplicate requests.

**10. How do you handle ACLs on 10M documents?**
Group-based filters, post-checks, fast metadata updates, and no cross-scope caching.

## Self-check

1. 50M chunks × 1024 dims in float32 and in int8: sizes?
2. 300 users, one query per 30 s, 6 s per response: QPS and in-flight requests?
3. Name three reasons quality falls at 10M documents.
4. Which clarifying questions come first when someone says "500 users"?

**P1. Top-k cosine search (numpy).**

```python
import numpy as np

def top_k(query: np.ndarray, matrix: np.ndarray, k: int = 5):
    k = min(k, len(matrix))
    q = query / np.linalg.norm(query)
    m = matrix / np.linalg.norm(matrix, axis=1, keepdims=True)
    scores = m @ q
    idx = np.argpartition(-scores, k - 1)[:k]        # O(n) partial selection
    idx = idx[np.argsort(-scores[idx])]              # sort only the k winners
    return idx, scores[idx]
```

Say: "normalize so dot equals cosine", "argpartition avoids a full sort", "this is exact O(N·d), so at scale I'd use ANN."

**P2. Overlapping chunker.**

```python
def chunk_text(text: str, size: int = 800, overlap: int = 100) -> list[str]:
    if overlap >= size:
        raise ValueError("overlap must be smaller than size")
    if not text:
        return []
    step = size - overlap
    return [text[i:i + size] for i in range(0, max(len(text) - overlap, 1), step)]

**P3. Reciprocal Rank Fusion.**

```python
def rrf(rankings: list[list[str]], k: int = 60, weights: list[float] | None = None) -> list[str]:
    weights = weights or [1.0] * len(rankings)
    scores: dict[str, float] = {}
    for w, ranking in zip(weights, rankings):
        for rank, doc_id in enumerate(ranking, start=1):
            scores[doc_id] = scores.get(doc_id, 0.0) + w / (k + rank)
    return sorted(scores, key=lambda d: (-scores[d], d))      # deterministic tie-break
```

**P4. BM25 from scratch.**

```python
import math
from collections import Counter

class BM25:
    def __init__(self, docs: list[list[str]], k1: float = 1.5, b: float = 0.75):
        self.docs, self.k1, self.b = docs, k1, b
        self.N = len(docs)
        self.avgdl = sum(len(d) for d in docs) / self.N
        self.df = Counter(t for d in docs for t in set(d))
        self.tf = [Counter(d) for d in docs]

    def idf(self, t: str) -> float:
        n = self.df.get(t, 0)
        return math.log(1 + (self.N - n + 0.5) / (n + 0.5))

    def score(self, query: list[str], i: int) -> float:
        dl, s = len(self.docs[i]), 0.0
        for t in query:
            f = self.tf[i].get(t, 0)
            if f:
                s += self.idf(t) * f * (self.k1 + 1) / (f + self.k1 * (1 - self.b + self.b * dl / self.avgdl))
        return s

    def search(self, query: list[str], k: int = 5):
        return sorted(((self.score(query, i), i) for i in range(self.N)), reverse=True)[:k]
```

Explain `k1` (term-frequency saturation) and `b` (length normalization). For scale, use an inverted index, not a scan over all documents.

```python
import asyncio, random, functools

def retry(max_attempts=5, base=0.5, cap=30.0, retry_on=(TimeoutError,)):
    def deco(fn):
        @functools.wraps(fn)
        async def wrapper(*a, **kw):
            for attempt in range(1, max_attempts + 1):
                try:
                    return await fn(*a, **kw)
                except retry_on as e:
                    if attempt == max_attempts:
                        raise
                    delay = getattr(e, "retry_after", None) or random.uniform(0, min(cap, base * 2 ** attempt))
                    await asyncio.sleep(delay)
        return wrapper
    return deco
```

    for _ in range(max_steps):
        resp = llm(messages, tools=tool_schemas())
        messages.append(resp.as_message())
        if not resp.tool_calls:
            return resp.text
        for call in resp.tool_calls:                              # EVERY call must get a result message

            seen[key] += 1
            result = ("Error: repeated identical call; try another approach or answer."
                      if seen[key] > 2 else run_tool(call.name, call.args))
            messages.append({"role": "tool", "tool_call_id": call.id, "content": result})

    reasoning: str                                  # before the answer field: reasoning first
    priority: Literal["P1", "P2", "P3", "P4"]

**P9. Semantic cache with scope and TTL.**

```python
import time
import numpy as np

class SemanticCache:
    def __init__(self, embed, threshold=0.92, ttl=86_400):
        self.embed, self.threshold, self.ttl = embed, threshold, ttl
        self.vecs: list[np.ndarray] = []
        self.meta: list[dict] = []

    def get(self, query: str, scope: str):
        if not self.vecs:
            return None
        q = self.embed(query); q = q / np.linalg.norm(q)
        sims = np.stack(self.vecs) @ q
        now = time.time()
        for i in np.argsort(-sims)[:3]:
            if sims[i] < self.threshold:
                break
            m = self.meta[i]
            if m["scope"] == scope and now - m["ts"] < self.ttl:
                return m["answer"]
        return None

    def put(self, query: str, answer: str, scope: str):
        v = self.embed(query)
        self.vecs.append(v / np.linalg.norm(v))
        self.meta.append({"answer": answer, "scope": scope, "ts": time.time()})
```

Say: scope by tenant and document version, high threshold, TTL, and don't cache personalized answers.

inflight: dict[str, asyncio.Future] = {}

async def coalesced(key: str, fn):
    if key in inflight:
        return await inflight[key]
    fut = asyncio.ensure_future(fn())

**P11. Retrieval metrics.**

```python
import math

def recall_at_k(ret, rel, k):  return len(set(ret[:k]) & set(rel)) / len(rel)
def mrr(ret, rel):             return next((1 / i for i, d in enumerate(ret, 1) if d in rel), 0.0)

def ndcg_at_k(ret, grades: dict, k):
    dcg  = sum(grades.get(d, 0) / math.log2(i + 1) for i, d in enumerate(ret[:k], 1))
    ideal = sorted(grades.values(), reverse=True)[:k]
    idcg = sum(g / math.log2(i + 1) for i, g in enumerate(ideal, 1))
    return dcg / idcg if idcg else 0.0

**P12. Multi-head causal self-attention (PyTorch).**

```python
import math, torch, torch.nn as nn

class MHA(nn.Module):
    def __init__(self, d_model: int, n_heads: int):
        super().__init__()
        assert d_model % n_heads == 0
        self.h, self.dk = n_heads, d_model // n_heads
        self.qkv = nn.Linear(d_model, 3 * d_model)
        self.out = nn.Linear(d_model, d_model)

    def forward(self, x, causal: bool = True):
        B, T, D = x.shape
        q, k, v = self.qkv(x).chunk(3, dim=-1)
        split = lambda t: t.view(B, T, self.h, self.dk).transpose(1, 2)    # (B, h, T, dk)
        q, k, v = map(split, (q, k, v))
        scores = q @ k.transpose(-2, -1) / math.sqrt(self.dk)             # (B, h, T, T)
        if causal:
            mask = torch.triu(torch.ones(T, T, dtype=torch.bool, device=x.device), 1)
            scores = scores.masked_fill(mask, float("-inf"))
        y = (scores.softmax(-1) @ v).transpose(1, 2).contiguous().view(B, T, D)
        return self.out(y)
```

**P13. LoRA layer.**

```python
class LoRALinear(nn.Module):
    def __init__(self, base: nn.Linear, r: int = 8, alpha: int = 16, dropout: float = 0.0):
        super().__init__()
        self.base = base
        for p in self.base.parameters():
            p.requires_grad = False                                       # freeze W
        self.A = nn.Parameter(torch.randn(r, base.in_features) * 0.01)    # random
        self.B = nn.Parameter(torch.zeros(base.out_features, r))          # zero → ΔW = 0 at start
        self.scale, self.drop = alpha / r, nn.Dropout(dropout)

    def forward(self, x):
        return self.base(x) + (self.drop(x) @ self.A.T @ self.B.T) * self.scale
```

**P14. Sampling: temperature and top-p.**

```python
import numpy as np

def sample(logits, T=1.0, top_p=1.0, rng=np.random.default_rng()):
    z = np.asarray(logits) / max(T, 1e-8)
    p = np.exp(z - z.max()); p /= p.sum()
    idx = np.argsort(-p)
    cum = np.cumsum(p[idx])
    keep = idx[: np.searchsorted(cum, top_p) + 1]          # smallest set reaching top_p
    q = p[keep] / p[keep].sum()
    return int(rng.choice(keep, p=q))
```

**Bug hunt 1: LangGraph agent.** Find the bugs.

```python
class State(TypedDict):
    messages: list
    count: int

def agent(state):
    state["messages"].append(llm(state["messages"]))
    state["count"] += 1

def should_continue(state):
    return "tools" if state["messages"][-1].tool_calls else "end"

g = StateGraph(State)
g.add_node("agent", agent)
g.add_node("tools", ToolNode(tools))
g.add_edge("agent", "tools")
g.add_conditional_edges("agent", should_continue)
g.add_edge("tools", "agent")
app = g.compile()
app.invoke({"messages": [("user", "hi")]}, {"configurable": {"thread_id": "1"}})
```

Bugs:

1. The node **mutates state and returns `None`**. It must return a partial update dict: `{"messages": [resp], "count": state.get("count", 0) + 1}`.
2. `messages` has **no reducer**, so a returned message would overwrite the history. Use `Annotated[list, add_messages]` (or `MessagesState`).
3. The router returns `"end"`, which isn't a node. Return `END` or provide a path map.
4. The unconditional `agent → tools` edge makes the router meaningless: tools runs even with no tool calls. Remove it.
5. **No `START` edge**, so the graph has no entry point.
6. `count` is read but never initialized (`KeyError`), and there is **no stop condition**. Check `count` in the router and set `recursion_limit`.
7. A `thread_id` is passed but **no checkpointer** is compiled, so there is no memory across calls.
